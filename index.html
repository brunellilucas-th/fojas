}
// respuesta de búsqueda amplia, para que nunca quede sin contestar
function agResponderAmplio(q){
  const t = normTxt(q);
  const rec = t.match(/^(?:recorda|recordate|aprende|aprendete|anota|anotate|guarda|tene en cuenta)\s+(?:que\s+)?(.{6,})$/);
  if(rec){ const txt = q.replace(/^\s*\S+\s+(que\s+)?/i,'').trim(); const s = agAprender(txt, txt, 'recordado'); return {texto:`Listo, lo anoté y lo voy a tener en cuenta para todo el equipo:\n“${s.r}”`, saberId:s.id, sistema:true}; }
  const kb = agKB(q), top = kb[0];
  if(top && top.d.tipo==='saber' && top.sc>=0.55){ const s = top.d.s; s.usos = (s.usos||0)+1; save(); return {texto:`${s.r}\n\n_(Lo aprendí de ${userName(s.autor).split(' ')[0]} el ${fmt(s.fecha)}.)_`, saberId:s.id}; }
  return null;
}
function agResponderBusqueda(q){
  const kb = agKB(q).filter(x=>x.d.tipo!=='saber' || x.sc>=0.55), dt = agBuscarDatos(q);
  const partes = []; let ir = null, irL = null;
  if(kb[0] && kb[0].sc>=0.5){ const a = kb[0]; partes.push(`**${a.d.tipo==='saber'?'':a.d.t}**${a.d.tipo==='saber'?'':'\n'}${a.d.r}`.replace(/^\*\*\*\*/,'')); if(a.d.ir){ ir = a.d.ir; irL = 'Ir ahí'; }
    const b = kb[1]; if(b && b.sc>=0.6 && b.sc>=a.sc*0.85 && b.d.tipo!=='ayuda') partes.push(`**${b.d.t}**\n${b.d.r}`); }
  if(dt.length) { (/\b(expediente|expedientes|caso|casos|amparo|amparos|afiliado|afiliados|quien|quienes)\b/.test(normTxt(q)) ? partes.unshift.bind(partes) : partes.push.bind(partes))(`**En los expedientes encontré:**\n${dt.map(x=>'• '+agExpCorto(x.e)).join('\n')}`); if(dt.length===1){ ir = 'expediente-'+dt[0].e.id; irL = 'Abrir expediente'; } }
  if(!partes.length) return null;
  return {texto:partes.join('\n\n'), ir, irL, busqueda:true};
}

function admDatos(t){

  if((m = t.match(/(\d{2})\s*a[nñ]os\s+de\s+edad|edad\s+de\s+(\d{2})\s*a[nñ]os|(?:cumplir|cumpli[oó]|tiene|tener|de)\s+(\d{2})\s*a[nñ]os(?!\s+de\s+antig)/i))) o.edad = m[1]||m[2]||m[3];
  if((m = t.match(/(\d{1,2})\s*a[nñ]os\s+de\s+antig[uü]edad|antig[uü]edad\s+(?:de\s+|mayor\s+a\s+)?(\d{1,2})\s*a[nñ]os|afiliad\w*\s+(?:desde\s+hace|hace)\s+(?:m[aá]s\s+de\s+)?(\d{1,2})\s*a[nñ]os/i))) o.antig = m[1]||m[2]||m[3];
  if((m = t.match(/plan\s+([A-Z0-9][A-Za-z0-9 ]{0,18}?)(?=[,.;\s]\s*(?:con|de|y|que|cuya|por|desde)?\b)/))) o.plan = m[1].trim();
  const montos = [...t.matchAll(/\$\s?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:,\d{1,2})?)/g)].map(x=>x[1]);
  if(montos.length>=2){ o.cuotaAnt = montos[0]; o.cuotaNueva = montos[1]; } else if(montos.length===1) o.cuotaNueva = montos[0];
  if((m = t.match(/deuda\s+(?:de\s+|por\s+)?(?:la\s+suma\s+de\s+)?\$\s?([\d.,]+)/i))) o.deuda = m[1];
  if(/amparo\s+colectivo|acci[oó]n\s+colectiva|\bclase\b|asociaci[oó]n\s+de\s+(?:consumidores|usuarios)/i.test(t)) o.colectivo = true;

}

// eventos del módulo Administrativos
function trTaskRow(t, p, i){ const n = daysTo(p.vence), u = urg(n); return `<div class="task ${u}"><div class="txt"><a href="#tramite-${t.id}">${esc(p.desc)}</a><div class="small muted">${esc(orgById(t.org).c)} · ${esc(trNombre(t))}${t.numero?' · '+esc(t.numero):''}</div></div>
  <div style="text-align:right"><div class="when ${u}">${whenText(n)}</div><div class="small muted">${fmt(p.vence)}</div></div><button class="btn sm" data-act="trhecho" data-t="${t.id}" data-i="${i}">${ic('check','sm')} Hecho</button></div>`; }
function vencAdm(){ if(!tieneMod('administrativos')) return ''; const l = trs().flatMap(t=>(t.plazos||[]).map((p,i)=>({t,p,i})).filter(x=>!x.p.hecho)).sort((a,b)=>a.p.vence.localeCompare(b.p.vence));
  if(!l.length) return ''; return `<section class="card"><div class="row"><h2>Administrativos</h2><span class="badge">${l.length}</span></div><div class="cases">${l.map(x=>trTaskRow(x.t,x.p,x.i)).join('')}</div></section>`; }
document.addEventListener('click', async ev => {
  if(!S || !S.user) return;
  const el = ev.target.closest('[data-admtab],[data-admf],[data-guiacat],[data-guiaopen],[data-guiair],[data-tretapa],[data-act],[data-ag-open]'); if(!el) return;
  const d = el.dataset;
  if(d.agOpen){ AG.open = true; drawAgente(); return; }
  if(d.admtab){ ui.admTab = d.admtab; render(); return; }
  if(d.admf){ ui.admF = d.admf; render(); return; }
  if(d.guiacat){ ui.guiaCat = d.guiacat; render(); return; }
  if(d.guiaopen){ ui.guiaOpen = ui.guiaOpen===d.guiaopen ? null : d.guiaopen; render(); return; }
  if(d.guiair){ ev.preventDefault(); ui.admTab = 'guia'; ui.guiaCat = 'Todas'; ui.guiaQ = ''; ui.guiaOpen = d.guiair; render(); setTimeout(()=>{ const c = document.querySelector('.gcard.open'); if(c) c.scrollIntoView({block:'center'}); }, 50); return; }
  const r = route(), t = r.name==='tramite' ? trById(r.id) : null;
  if(d.tretapa!==undefined && t){ const et = TR_ETAPAS[t.clase], old = t.estado, nu = et[+d.tretapa]; if(nu===old) return; t.estado = nu; save(); audit('Cambió la etapa de un trámite', orgById(t.org).c, `${trNombre(t)}: ${old} → ${nu}`); render(); toast('Etapa actualizada', ()=>{ t.estado = old; save(); render(); }); return; }
  const a = d.act; if(!a) return;
  if(a==='trnuevo'){ openTramite(d.clase||'reclamo', {guia:d.guia, org:d.org}); return; }
  if(a==='trcrear'){ crearTramite(); return; }
  if(a==='trhecho'){ const x = d.t ? trById(d.t) : t; if(!x) return; const p = x.plazos[+d.i]; if(!p) return; p.hecho = true; save(); audit('Cumplió un plazo administrativo', orgById(x.org).c, `${trNombre(x)}: ${p.desc}`); render(); toast('Marcado como hecho', ()=>{ p.hecho = false; save(); render(); }); return; }
  if(!t && !/^guia/.test(a)) return;
  if(a==='trplazo'){ const desc = $('#trPDesc').value.trim(), v = $('#trPVence').value; if(!desc || !v){ toast('Completá qué hay que hacer y la fecha'); return; } t.plazos.push({desc, vence:v, hecho:false}); save(); audit('Agregó un plazo administrativo', orgById(t.org).c, `${trNombre(t)}: ${desc} (${fmt(v)})`); render(); toast('Plazo agregado'); return; }
  if(a==='trmulta'){ const m = $('#trMulta').value.trim(); t.multa = m ? {monto:m} : null; save(); audit('Registró una multa', orgById(t.org).c, `${trNombre(t)}: ${m||'sin multa'}`); render(); toast('Guardado'); return; }
  if(a==='trdel'){ const i = trs().indexOf(t); if(i<0) return; trs().splice(i,1); S.trBorrados = [...new Set([...(S.trBorrados||[]), t.id])]; save(); audit('Eliminó un trámite', orgById(t.org).c, trNombre(t)); location.hash = 'administrativos'; toast('Trámite eliminado', ()=>{ trs().splice(i,0,t); S.trBorrados = S.trBorrados.filter(x=>x!==t.id); save(); location.hash = 'tramite-'+t.id; }); return; }
  if(a==='tresc'){ const x = TR_ESCRITOS.find(z=>z.id===d.esc); const txt = trEscrito(d.esc, t);
    showModal(`<div class="row" style="justify-content:space-between"><h2 style="font-size:22px">${esc(x.l)}</h2><button class="btn ghost sm" data-act="close">Cerrar</button></div><p class="small muted">Es un modelo: completá lo que está entre [CORCHETES] y revisalo antes de presentarlo.</p><textarea id="trEscTxt" rows="18" style="width:100%;font-family:inherit">${esc(txt)}</textarea>
      <div class="row" style="gap:8px"><button class="btn pri" data-act="trescopy">${ic('copy','sm')} Copiar</button><button class="btn" data-act="trescsave" data-l="${esc(x.l)}">${ic('check','sm')} Guardar en la línea de tiempo</button></div>`); return; }
  if(a==='trescopy'){ try{ await navigator.clipboard.writeText($('#trEscTxt').value); toast('Copiado'); }catch(err){ $('#trEscTxt').select(); document.execCommand('copy'); toast('Copiado'); } return; }
  if(a==='trescsave'){ const txt = $('#trEscTxt').value; const blob = new File([txt], `${d.l} - ${trNombre(t)}.txt`, {type:'text/plain'}); let fid = null; try{ fid = await saveFileBlob(blob, txt); }catch(err){}
    t.movimientos.push({fecha:iso(today()), parte:'nosotros', titulo:d.l, desc:'Borrador preparado en Fojas.', fid, archivo:blob.name, user:S.user}); save(); audit('Preparó un escrito administrativo', orgById(t.org).c, `${trNombre(t)}: ${d.l}`); closeModal(); render(); toast('Guardado en la línea de tiempo'); return; }
  if(a==='trmov'){ const tit = $('#trMT').value.trim(); if(!tit){ toast('Escribí qué es (ej.: Notificación)'); return; } const f = $('#trMA').files[0]; let fid = null, txt = '';
    if(f){ try{ txt = await readFile(f, ()=>{}); if(typeof txt!=="string") txt = (txt&&txt.text)||""; }catch(err){} try{ fid = await saveFileBlob(f, txt); }catch(err){} }
    t.movimientos.push({fecha:$('#trMF').value||iso(today()), parte:$('#trMP').value, titulo:tit, desc:$('#trMD').value.trim(), fid, archivo:f?f.name:'', user:S.user});
    save(); audit('Agregó una novedad a un trámite', orgById(t.org).c, `${trNombre(t)}: ${tit}`); render(); toast('Agregado a la línea de tiempo'); return; }
  if(a==='trver'){ openViewer({fid:d.fid, meta:{nombre:d.n||'Archivo'}}); return; }
  if(a==='guianueva'){ showModal(`<div class="row" style="justify-content:space-between"><h2 style="font-size:22px">Agregar un trámite a la guía</h2><button class="btn ghost sm" data-act="close">Cancelar</button></div><p class="small muted">Queda guardado para todo el equipo y el asistente lo usa para responder.</p>
      <div class="form"><label class="full">Nombre del trámite<input type="text" id="gnT"></label><label>Organismo<select id="gnO">${ORGS.map(o=>`<option value="${o.id}">${esc(o.l)}</option>`).join('')}</select></label><label>Categoría<input type="text" id="gnC" list="gnCL" value="Otros"><datalist id="gnCL">${[...new Set(guiaTodas().map(g=>g.cat))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label>
      <label class="full">Qué es<textarea id="gnQ" rows="2"></textarea></label><label class="full">A quién alcanza<input type="text" id="gnA"></label><label class="full">Cuándo<input type="text" id="gnW"></label><label class="full">Cómo se hace (un paso por renglón)<textarea id="gnH" rows="3"></textarea></label><label>Norma<input type="text" id="gnN"></label><label>Link oficial<input type="url" id="gnL"></label></div>
      <div class="row"><button class="btn pri big" data-act="guiaguardar">${ic('check')} Guardar</button></div>`); return; }
  if(a==='guiaguardar'){ const v = id => $('#'+id).value.trim(); if(!v('gnT')){ toast('Escribí el nombre del trámite'); return; }
    const g = {id:'gp'+randId(6), cat:v('gnC')||'Otros', org:v('gnO'), t:v('gnT'), que:v('gnQ'), quien:v('gnA'), cuando:v('gnW'), como:v('gnH').split('\n').map(x=>x.trim()).filter(Boolean), norma:v('gnN'), link:v('gnL'), autor:S.user};
    S.guiaPropia = S.guiaPropia || []; S.guiaPropia.push(g); save(); audit('Agregó un trámite a la guía', g.t, orgById(g.org).c); closeModal(); ui.admTab = 'guia'; ui.guiaOpen = g.id; render(); toast('Agregado a la guía'); return; }
  if(a==='guiadel'){ const i = (S.guiaPropia||[]).findIndex(x=>x.id===d.g); if(i<0) return; const g = S.guiaPropia.splice(i,1)[0]; S.trBorrados = [...new Set([...(S.trBorrados||[]), g.id])]; save(); audit('Quitó un trámite de la guía', g.t, ''); render(); toast('Quitado de la guía', ()=>{ S.guiaPropia.splice(i,0,g); S.trBorrados = S.trBorrados.filter(x=>x!==g.id); save(); render(); }); return; }
});

document.addEventListener('change', ev => { if(ev.target.id==='ueRol' && UE){ ueRead(); drawUserEdit(); return; } if(ev.target.id==='trOrg' && TRF){ const o = orgById(ev.target.value), r = o.plazo||{}; const n = $('#trNota'); if(n) n.textContent = o.plazoNota||''; const lab = $('#trVence') && $('#trVence').closest('label'); if(lab) lab.firstChild.textContent = o.plazoDesc||'Próximo vencimiento'; if(r.modo && r.modo!=='fecha'){ const ini = ($('#trIni')||{}).value || iso(today()); $('#trVence').value = calcPlazo({...r, desde:ini}).vence; } } });

// ---------- actualización automática: si hay una versión nueva publicada, se carga sola ----------
const APP_VERSION = (document.querySelector('meta[name=fojas-version]')||{}).content || '';
async function buscarVersionNueva(){
  try{
    if(!/^https?:/.test(location.protocol)) return;
    const r = await fetch(location.pathname + '?v=' + Date.now(), {cache:'no-store'}); if(!r.ok) return;
    const m = (await r.text()).match(/name="fojas-version" content="([^"]+)"/); if(!m || !APP_VERSION || m[1]===APP_VERSION) return;
    const ocupado = W || UP || XL || UE || AG.cargando || (AG.open && AG.borrador) || ($('#overlay') && $('#overlay').classList.contains('show'));
    if(!ocupado){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} location.reload(); return; }
    if(!$('#nuevaVersion')){ const b = document.createElement('div'); b.id = 'nuevaVersion'; b.innerHTML = 'Hay una versión nueva de Fojas. <button class="btn sm pri" onclick="try{localStorage.setItem(KEY, JSON.stringify(S))}catch(e){} location.reload()">Actualizar ahora</button>'; document.body.appendChild(b); }
  }catch(e){}
}
setTimeout(buscarVersionNueva, 4000); setInterval(buscarVersionNueva, 3*60*1000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) buscarVersionNueva(); });
// ---------- arranque ----------
(async function init(){
  const got = load();
  let fromIdb = null; try{ fromIdb = await IDB.get('estado'); }catch(e){}
  if(fromIdb && Array.isArray(fromIdb.exps)){
    if(!got) { S = await migrate(fromIdb); save(); }
    else { const a = got.data, b = fromIdb; const nuevo = (b.savedAt||0) > (a.savedAt||0) ? b : a, otro = nuevo===a ? b : a; got.data = unir(nuevo, otro); }
  }
  try{ const h = await IDB.get('fileHandle'); if(h){ PERSIST.file = h; PERSIST.fileName = h.name; const p = await h.queryPermission({mode:'readwrite'}); PERSIST.fileNeeds = p!=='granted'; } }catch(e){}
  try{ if(navigator.storage && navigator.storage.persist){ PERSIST.persistent = await navigator.storage.persisted() || await navigator.storage.persist(); } }catch(e){}
  if(got){ S = await migrate(got.data); if(S._sumados && S._sumados.length){ const sm = S._sumados.slice(); setTimeout(()=>toast(`Recuperamos: ${sm.join(', ')}.`), 1200); } delete S._sumados; save(); if(got.from){ setTimeout(()=>toast('Recuperamos los datos que tenías cargados en la versión anterior.'), 400); } }
  if(S && S.exps){ const r = rescatar(); if(r.length) setTimeout(()=>toast(`Recuperamos ${r.length===1?'un amparo':r.length+' amparos'} que había quedado guardado por una versión anterior: ${r.map(x=>x.afiliado).join(', ')}.`), 900); }
  else if(!S){ S = await migrate(await fresh()); save(); await seedAudit(); }
  S.lock = S.lock || {}; S.toured = S.toured || {}; S.teams = S.teams || [];
  render();
  const u = getSession() && me(); if(u && u.mustChange) openPwd(true);
})();
