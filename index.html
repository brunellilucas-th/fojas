<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: menú lateral con íconos grandes + área de trabajo con tarjetas amplias; lo urgente siempre arriba y en color */
:root{
  /* Paleta: fondo blanco, verdes (bosque, oliva, salvia) y marrones (nogal, tierra, arena) */
  --bg:#FFFFFF; --surface:#FFFFFF; --sunken:#F7F4EF; --line:#E6DED3;
  --ink:#2E2520; --muted:#6F6157; --faint:#A39586;
  --accent:#2F6B3F; --accent-ink:#FFFFFF; --accent-soft:#E5F0E3;
  --danger:#B23A2B; --danger-soft:#FBE7E2; --warn:#9A6A1E; --warn-soft:#FAF0DC; --ok:#5E8A3A; --ok-soft:#EEF4E4;
  --violet:#8B5E3C; --violet-soft:#F4EADF;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px; --shadow:0 1px 2px rgba(60,40,20,.05), 0 4px 14px rgba(60,40,20,.06); color-scheme:light;
}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800} h2{font-size:20px;font-weight:700} h3{font-size:17px;font-weight:700}
a{color:var(--accent)}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.92em}
.muted{color:var(--muted)} .small{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:18px;height:18px}
svg.i.lg{width:30px;height:30px}

.app{display:grid;grid-template-columns:250px 1fr;height:100%}
.side{background:#FBF9F5;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:18px 14px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px}
.brand .mark{width:40px;height:40px;flex:none;border-radius:11px;box-shadow:0 2px 6px rgba(29,69,41,.25)}
.brand .mark svg{border-radius:11px}
.brand b{letter-spacing:-.02em}
.brand b{font-size:21px;font-weight:800}
.navlabel{font-size:13px;font-weight:600;color:var(--faint);padding:16px 12px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;border:0;background:none;cursor:pointer;text-align:left;width:100%}
.nav a:hover,.nav button:hover{background:var(--sunken)}
.nav a.on{background:var(--accent);color:var(--accent-ink)}
.nav .badge{margin-left:auto}
.badge{font-size:13px;font-weight:700;min-width:24px;text-align:center;padding:1px 8px;border-radius:12px;background:var(--sunken);color:var(--muted)}
.badge.red{background:var(--danger);color:#fff}
.nav a.on .badge{background:rgba(255,255,255,.25);color:inherit}
.side .foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;margin-left:auto}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--violet-soft);color:var(--violet);display:grid;place-items:center;font-weight:800}
.who div{line-height:1.2} .who span{font-size:13px;color:var(--muted)}
.search{position:relative;flex:1;min-width:220px;max-width:520px}
.search input[type=search]{width:100%;padding:11px 14px 11px 44px;border-radius:12px;border:1px solid var(--line);background:var(--sunken)}
.search > svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:5;overflow:hidden}
.results a{display:block;padding:10px 14px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.results a:last-child{border-bottom:0}
.results{max-height:70vh;overflow:auto}
.dtree{border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.dtree-root{display:flex;width:100%;gap:12px;align-items:center;padding:14px 18px;background:transparent;border:0;border-radius:14px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.dtree-root:hover{background:var(--sunken)}
.dtree .chev{display:inline-flex;color:var(--muted);transition:transform .15s} .dtree.open .chev{transform:rotate(90deg)}
.dtree-name{font-weight:700;font-size:17px}
.dtree-m{color:var(--muted);font-size:14px;display:flex;gap:4px 14px;flex-wrap:wrap;margin-top:2px}
.dtree-r{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:2px;max-width:260px}
.dtree-hint{font-size:13px;font-weight:700;color:var(--violet);background:var(--violet-soft);padding:4px 10px;border-radius:99px;white-space:nowrap}
.dtree-kids{display:none;padding:0 18px 16px 52px}
.dtree.open .dtree-kids{display:block}
.dtree-kid{position:relative;display:flex;gap:14px;justify-content:space-between;align-items:center;margin-top:10px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none}
.dtree-kid::before{content:'';position:absolute;left:-22px;top:-12px;height:calc(50% + 12px);width:18px;border-left:2px solid var(--violet);border-bottom:2px solid var(--violet);border-bottom-left-radius:10px}
.dtree-kid:not(:last-child)::after{content:'';position:absolute;left:-22px;top:50%;bottom:-12px;border-left:2px solid var(--violet)}
.dtree-kid:hover{border-color:var(--accent);background:var(--accent-soft)}
.dtree-kid.aqui{border:2px solid var(--accent);background:var(--accent-soft)}
.dtree-kid.arch{opacity:.75}
.dtree-t{font-weight:700}
.dtree.mini{border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}
.dtree.mini .dtree-root{border-radius:0;padding:10px 14px}
.dtree.mini .dtree-name{font-size:15px} .dtree.mini .dtree-m{font-size:13px}
.dtree.mini .dtree-kids{padding:0 14px 12px 44px}
.results .dtree-kid{display:flex;padding:8px 12px;border:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:8px}
.results .dtree-kid .dtree-r{display:none}
.results .dtree-kid, .results .dtree-kid *{text-decoration:none!important}
@media (max-width:700px){ .dtree-root .dtree-r{display:none} .dtree-kid{flex-direction:column;align-items:flex-start} .dtree-r{align-items:flex-start;text-align:left} .dtree-kids{padding-left:40px} }
.results a:hover,.results a.sel{background:var(--accent-soft)}
.view{flex:1;overflow:auto;padding:28px;display:flex;flex-direction:column;gap:24px}
.demo{font-size:13px;background:var(--violet-soft);color:var(--violet);padding:6px 28px}

input[type=text],input[type=password],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.ok:hover{filter:brightness(1.08);color:#fff}
.btn.big{padding:14px 22px;font-size:17px;border-radius:12px}
.btn.sm{padding:6px 11px;font-size:14px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--danger)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-solid:hover{filter:brightness(1.08);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.sub{color:var(--muted);font-size:15px}

/* accesos grandes del inicio */
.action{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:20px;cursor:pointer;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .12s, border-color .12s}
.action:hover{border-color:var(--accent);transform:translateY(-2px)}
.action b{font-size:18px}
.action span{color:var(--muted);font-size:14px}
.ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center}
.ico.a{background:var(--accent-soft);color:var(--accent)} .ico.r{background:var(--danger-soft);color:var(--danger)} .ico.v{background:var(--violet-soft);color:var(--violet)} .ico.g{background:var(--ok-soft);color:var(--ok)} .ico.y{background:var(--warn-soft);color:var(--warn)}

/* tareas */
.task{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--sunken);border-left:5px solid var(--line)}
.task.late{border-color:var(--danger);background:var(--danger-soft)}
.task.soon{border-color:var(--warn)}
.task.okk{border-color:var(--ok)}
.task .txt{flex:1;min-width:0}
.task .txt a{color:var(--ink);text-decoration:none;font-weight:700}
.task .txt a:hover{text-decoration:underline}
.when{font-weight:700;font-size:14px;white-space:nowrap}
.when.late{color:var(--danger)} .when.soon{color:var(--warn)} .when.okk{color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap;background:var(--sunken);color:var(--muted);border:1px solid var(--line)}
.pill.red{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.pill.yel{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.grn{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.empty{text-align:center;padding:26px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ico{margin-bottom:4px}

/* filtros tipo chip */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:22px;padding:8px 16px;cursor:pointer;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.chipbtn:hover{border-color:var(--accent)}
.chipbtn.on{background:var(--violet);border-color:var(--violet);color:#fff}
.chipbtn .badge{background:rgba(127,127,127,.18);color:inherit}

/* lista de amparos como tarjetas */
.cases{display:flex;flex-direction:column;gap:10px}
.case{display:grid;grid-template-columns:6px 1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px 14px 0;cursor:pointer;box-shadow:var(--shadow)}
.case:hover{border-color:var(--accent)}
.case .bar{align-self:stretch;border-radius:0 4px 4px 0;background:var(--line)}
.case .bar.late{background:var(--danger)} .case .bar.soon{background:var(--warn)} .case .bar.okk{background:var(--ok)}
.case .name{font-weight:700;font-size:17px}
.case .meta{color:var(--muted);font-size:14px;display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:2px}
.case .right{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}

/* expediente */
.next{background:linear-gradient(0deg,var(--surface),var(--surface));border:2px solid var(--accent);border-radius:var(--r);padding:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.next.late{border-color:var(--danger);background:var(--danger-soft)}
.next .txt{flex:1;min-width:240px}
.next .lbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.next h2{font-size:22px;margin:4px 0}
.steps{display:flex;gap:0;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:110px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:0;padding:4px;position:relative;color:var(--muted);font-size:13px;font-weight:600;text-align:center}
.step::before{content:"";position:absolute;top:17px;left:-50%;right:50%;height:3px;background:var(--line);z-index:0}
.step:first-child::before{display:none}
.step .dot{width:34px;height:34px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;z-index:1;font-weight:800;color:var(--faint)}
.step.done{color:var(--ink)} .step.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .step.done::before{background:var(--accent)}
.step.cur{color:var(--accent)} .step.cur .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)} .step.cur::before{background:var(--accent)}
.step:hover .dot{border-color:var(--accent)}
.step.caut-no{color:var(--danger)} .step.caut-no .dot{background:var(--danger);border-color:var(--danger);color:#fff;box-shadow:none}
.step.caut-si{color:var(--ok)} .step.caut-si .dot{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:none}
.step.cur.caut-si .dot,.step.cur.caut-no .dot{box-shadow:0 0 0 5px var(--sunken)}
.legend{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{border:0;background:none;padding:9px 14px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;display:inline-flex;gap:8px;align-items:center}
.tabs button:hover{background:var(--sunken);color:var(--ink)}
.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.modchecks{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px} .modchk{display:inline-flex !important;flex-direction:row !important;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer;background:var(--surface)} .modchk input{width:18px;height:18px;flex:none;margin:0}
.gcard{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.gcard-h{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:14px 16px;cursor:pointer;color:inherit;font:inherit}
.gcard-h:hover{background:var(--sunken)} .gcard-h .chev{transition:transform .15s;display:inline-flex} .gcard.open .gcard-h .chev{transform:rotate(90deg)}
.gcard-b{display:flex;flex-direction:column;gap:10px;padding:4px 16px 16px 44px;line-height:1.5} .gcard-b ol{margin:4px 0 0 18px;padding:0}
.glbl{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fact{background:var(--sunken);border-radius:12px;padding:12px 14px}
.fact span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.fact b{font-weight:600}
.ag-fab{position:fixed;right:22px;bottom:22px;z-index:9;width:62px;height:62px;border-radius:50%;border:0;background:linear-gradient(135deg,#3E8352,#1D4529);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 24px rgba(29,69,41,.4);transition:transform .15s}
.ag-fab:hover{transform:scale(1.06)} .ag-fab svg{width:28px;height:28px}
.ag-fab:not(.on)::before{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(62,131,82,.5);animation:agPulse 2.4s infinite}
@keyframes agPulse{0%{transform:scale(.95);opacity:1}70%{transform:scale(1.25);opacity:0}100%{opacity:0}}
.ag-fab-badge{position:absolute;top:-2px;right:-4px;background:#C9963F;color:#fff;font-size:11px;font-weight:800;padding:2px 6px;border-radius:99px;border:2px solid #fff}
.ag-panel{position:fixed;right:22px;bottom:96px;z-index:9;width:410px;max-width:calc(100vw - 32px);height:620px;max-height:calc(100vh - 130px);background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 50px rgba(46,37,32,.25);display:flex;flex-direction:column;overflow:hidden;animation:agIn .18s ease-out}
@keyframes agIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ag-head{display:flex;gap:10px;align-items:center;padding:14px 14px 14px 16px;background:linear-gradient(135deg,#2F6B3F,#1D4529);color:#fff}

function applyModel(m, e){

  r(/[“"«]([^"”»\n]{3,200}?\s+c\s*\/\s*[^"”»\n]{3,200}?\s+s\s*\/\s*[^"”»\n]{2,140})[”"»]/g, `"${d.autos}"`, 'los autos');

  if(viejo && nuevoApellido){ const ap = viejo.trim().split(/\s+/)[0]; if(ap.length>2 && ap.toLowerCase()!==nuevoApellido.toLowerCase()){ const re = new RegExp('\\b'+ap.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[aeiou]/gi, c=>`[${c}${'áéíóú'['aeiou'.indexOf(c.toLowerCase())]}]`)+'\\b','gi'); r(re, titleCase(nuevoApellido), 'el apellido del asociado anterior'); } }

  if(d.dni) r(/D\.?\s?N\.?\s?I\.?\s*(?:N\s*[°º.]*\s*)?:?\s*\d{1,2}\.?\d{3}\.?\d{3}/gi, `DNI ${d.dni}`, 'el DNI');

  return {texto:t, hechos};

    r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); }); },
  async tx(store, mode, fn){ const db = await this.open(); return new Promise((res,rej)=>{ const t = db.transaction(store, mode); const st = t.objectStore(store); const out = fn(st); t.oncomplete = () => res(out instanceof IDBRequest ? out.result : out); t.onerror = () => rej(t.error); }); },
  get(k){ return this.tx('kv','readonly', st=>st.get(k)); },

  const known = new Set(base.exps.map(e=>String(e.numero||'').trim().toLowerCase()).concat(base.borrados));

  base.agSaber = (base.agSaber||[]).filter(x=>!agB.has(x.id)); (otro.agSaber||[]).forEach(x=>{ if(!agB.has(x.id) && !base.agSaber.some(y=>y.id===x.id)) base.agSaber.push(x); });

function binStr(u8){ let s = ''; for(let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000)); return s; }
function strBytes(s){ const u = new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i] = s.charCodeAt(i) & 255; return u; }
function decCharset(bytes, cs){ try{ return new TextDecoder((cs||'utf-8').toLowerCase().replace(/^(us-ascii|ascii)$/,'utf-8')).decode(bytes); }catch(e){ return new TextDecoder('utf-8').decode(bytes); } }
function qpDec(s){ return s.replace(/=\r?\n/g,'').replace(/=([0-9A-F]{2})/gi,(m,x)=>String.fromCharCode(parseInt(x,16))); }
function mimeWords(s){ return String(s||'').replace(/=\?([^?]+)\?([BQ])\?([^?]*)\?=\s*/gi,(m,cs,enc,t)=>{ try{ const bin = enc.toUpperCase()==='B' ? atob(t) : qpDec(t.replace(/_/g,' ')); return decCharset(strBytes(bin), cs); }catch(e){ return t; } }).trim(); }
function mimeHeaders(block){ const H = {}; block.replace(/\r?\n[ \t]+/g,' ').split(/\r?\n/).forEach(l=>{ const i = l.indexOf(':'); if(i>0){ const k = l.slice(0,i).trim().toLowerCase(); if(!(k in H)) H[k] = l.slice(i+1).trim(); } }); return H; }
const hParam = (v, p) => { const m = String(v||'').match(new RegExp(p+'\\*?=\\s*(?:"([^"]*)"|([^;\\s]+))','i')); if(!m) return ''; let v2 = m[1]!=null?m[1]:m[2]; if(/^[\w-]+''/.test(v2)){ v2 = v2.replace(/^[\w-]+''/,''); try{ v2 = decodeURIComponent(v2); }catch(e){} } return v2; };
function htmlATexto(h){ return String(h||'').replace(/<(style|script|head)[\s\S]*?<\/\1>/gi,' ').replace(/<br\s*\/?>|<\/(p|div|tr|li|h\d)>/gi,'\n').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#(\d+);/g,(m,n)=>String.fromCharCode(+n)).replace(/[ \t]+/g,' ').replace(/\n\s*\n\s*\n+/g,'\n\n').trim(); }
function mimeParte(raw, out){
  const cut = raw.search(/\r?\n\r?\n/); const head = cut<0 ? raw : raw.slice(0,cut); let body = cut<0 ? '' : raw.slice(cut).replace(/^\r?\n\r?\n/,'');
  const H = mimeHeaders(head); const ct = H['content-type'] || 'text/plain'; const tipo = ct.split(';')[0].trim().toLowerCase();
  if(!out.h) out.h = H;
  if(tipo.startsWith('multipart/')){ const b = hParam(ct,'boundary'); if(!b) return; body.split('--'+b).slice(1).forEach(p=>{ if(/^--/.test(p)) return; mimeParte(p.replace(/^\r?\n/,''), out); }); return; }
  const te = (H['content-transfer-encoding']||'').toLowerCase();
  let bin = te==='base64' ? (()=>{ try{ return atob(body.replace(/[^A-Za-z0-9+/=]/g,'')); }catch(e){ return ''; } })() : te==='quoted-printable' ? qpDec(body) : body;
  const disp = H['content-disposition']||''; const nombre = mimeWords(hParam(disp,'filename') || hParam(ct,'name'));
  if(tipo==='message/rfc822'){ out.adj.push(new File([strBytes(bin)], (nombre||'mail adjunto')+'.eml', {type:'message/rfc822'})); return; }
  if(!nombre && /^text\/(plain|html)/.test(tipo) && !/attachment/i.test(disp)){ const t = decCharset(strBytes(bin), hParam(ct,'charset')); if(tipo==='text/plain'){ if(!out.txt) out.txt = t; } else if(!out.html) out.html = t; return; }
  const bytes = strBytes(bin);
  if(/^image\//.test(tipo) && (H['content-id'] || /inline/i.test(disp)) && bytes.length < 40000) return; // logos y firmas
  if(bytes.length) out.adj.push(new File([bytes], nombre || ('adjunto.'+(tipo.split('/')[1]||'bin')), {type:tipo}));
}
async function leerEml(file){

async function expandirArchivos(files, progress){
  const out = [];
  for(const f of files){
    try{
      if(esMail(f)){
        progress && progress(`Abriendo el mail ${f.name}…`);
        const m = /\.msg$/i.test(f.name) || f.type==='application/vnd.ms-outlook' ? await leerMsg(f) : await leerEml(f);
        const info = {asunto:m.asunto, de:m.de, fecha:m.fecha, cuerpo:m.cuerpo.slice(0,20000), archivo:f.name};
        const sub = await expandirArchivos(m.adjuntos, progress);
        if(sub.length) sub.forEach(s=>out.push({file:s.file, mail:s.mail||info}));
        else out.push({file:new File([`Mail: ${m.asunto}\nDe: ${m.de}\nFecha: ${m.fecha||''}\n\n${m.cuerpo}`], (m.asunto||'mail').replace(/[\\/:*?"<>|]+/g,' ').slice(0,80)+'.txt', {type:'text/plain'}), mail:info, esCuerpo:true});
        continue;

        await loadScript(JSZIP_URL); const z = await JSZip.loadAsync(await f.arrayBuffer()); const hijos = [];

      }
    }catch(err){ console.warn('No se pudo abrir', f.name, err); }
    out.push({file:f});

async function upSave(){

    : /cedula|resolucion/.test(bt0) && /autos?\s+para\s+sentencia|llamamiento\s+de\s+autos/i.test(tx) ? 'Autos para sentencia'
    : /cedula|resolucion/.test(bt0) && /conc[eé]d[eé]se\s+(el\s+)?recurso/i.test(tx) ? 'Concede apelación'

    : /cedula|resolucion/.test(bt0) && /c[oó]rrase\s+traslado/i.test(tx) ? 'Traslado'
    : tipo.l;
  e.movimientos.push({fecha:u.fecha||iso(today()), tipo:{actora:'Escrito de la actora', juzgado:tipo.mov==='Interno'?'Resolución':tipo.mov, demandada:tipo.mov==='Interno'?'Interno':'Escrito propio'}[u.parte] || tipo.mov, parte:u.parte, titulo, fid, ...(tipo.propia?{cat:tipo.id}:{}), desc:u.desc || `Se incorpora ${tipo.l.toLowerCase()}.`, user:S.user});
  if(it.text){ const nf = flagsFromText(it.text); e.flags = e.flags || {}; for(const k in nf) if(nf[k]) e.flags[k] = true; }
  const hechos = [`documento guardado como ${tipo.l.toLowerCase()}`];
  if(ac.cautelar.on && !e.cautelar){ e.cautelar = true; hechos.push('medida cautelar registrada'); }
  if(ac.etapa.on && ac.etapa.val!==e.estado){ const old = e.estado; e.estado = ac.etapa.val; if(e.estado==='Cautelar otorgada') e.cautelar = true; audit('Cambió la etapa', e.numero, `${old} → ${e.estado} (por ${it.file.name})`); hechos.push(`etapa: ${e.estado}`); }
  ac.cumplir.filter(c=>c.on).forEach(c=>{ const p = e.plazos[c.idx]; if(p && !p.hecho){ p.hecho = true; audit('Marcó como hecho', e.numero, `${p.desc} (por ${it.file.name})`); hechos.push(`cumplido: ${p.desc}`); } });
  ac.plazos.filter(p=>p.on && p.desc && p.vence).forEach(p=>{ e.plazos.push({desc:p.desc, vence:p.vence, hecho:false, ...(p.regla?{regla:p.regla}:{})}); audit('Agendó un plazo', e.numero, `${p.desc} (${fmt(p.vence)}), por ${it.file.name}`); hechos.push(`plazo: ${p.desc} (${fmt(p.vence)})`); });
  save(); audit('Subió un documento', e.numero, `${it.file.name} · ${hechos.join(' · ')}`);
  if(u.i < u.queue.length-1){ u.i++; upStart(); toast('Guardado. Seguimos con el próximo documento.'); }
  else { UP = null; closeModal(); ui.tab = 'novedades'; render(); toast(`Expediente actualizado: ${hechos.join(' · ')}.`); }
}

const PREVIEW = {};   // archivos del asistente que todavía no se guardaron
async function saveFileBlob(file, text){ const fid = randId(8); try{ await IDB.putFile(fid, {blob:file, name:file.name, type:file.type||'', text:text||'', fecha:new Date().toISOString()}); return fid; }catch(e){ return null; } }
function fileKind(name, type){ name = (name||'').toLowerCase(); type = type||''; if(type==='application/pdf' || name.endsWith('.pdf')) return 'pdf'; if(type.startsWith('image/') || /\.(png|jpe?g|gif|webp|bmp)$/.test(name)) return 'img'; if(name.endsWith('.docx')) return 'docx'; if(type.startsWith('text/') || name.endsWith('.txt')) return 'txt'; return 'otro'; }
let VIEW = null;
async function openViewer(src){
  // src: {fid} de un documento guardado, o {preview:i} de un archivo del asistente
  let rec = null, meta = src.meta || {};
  if(src.preview!==undefined){ const p = PREVIEW[src.preview]; if(p) rec = {blob:p.file, name:p.file.name, type:p.file.type, text:p.text||''}; }
  else if(src.fid){ try{ rec = await IDB.getFile(src.fid); }catch(e){} }

function closeViewer(){ if(VIEW && VIEW.url) URL.revokeObjectURL(VIEW.url); VIEW = null; $('#modal').classList.remove('wide'); }

const PARTE_DE_TIPO = {'Escrito de la actora':'actora','Escrito propio':'demandada','Notificación':'juzgado','Resolución':'juzgado','Interno':'demandada'};
const PARTE_DE_BASE = {cedula:'juzgado', resolucion:'juzgado', cautelar:'juzgado', sentencia:'juzgado', propio:'demandada', cumplimiento:'demandada', actora:'actora', prueba:'actora', otro:'juzgado'};

function fixExp(x){
  if(ESTADO_ALIAS[x.estado]) x.estado = ESTADO_ALIAS[x.estado];
  if(!ESTADOS.includes(x.estado)) x.estado = 'Demanda';
  (x.movimientos||[]).forEach(m=>{ if(!m.parte) m.parte = PARTE_DE_TIPO[m.tipo] || 'juzgado'; });
  (x.docs||[]).forEach(d=>{ if(!d.parte) d.parte = parteDeDoc(d.tipo); });

}
function movTitulo(m){ return m.titulo || ({'Escrito de la actora':'Escrito de la actora','Escrito propio':'Escrito presentado','Notificación':'Notificación del juzgado','Resolución':'Resolución del juzgado','Interno':'Nota interna'}[m.tipo] || m.tipo); }

  const items = (e.movimientos||[]).map((m,i)=>({...m, i, parte:m.parte||PARTE_DE_TIPO[m.tipo]||'juzgado', ord:i+1}));
  if(!items.some(x=>x.parte==='actora' && /demanda/i.test(movTitulo(x)))){
    const di = (e.docs||[]).findIndex(d=>/demanda/i.test(d.tipo+' '+d.nombre));

// Busca amparos guardados por versiones anteriores u otras pestañas que no estén en los datos actuales y los suma.
function rescatar(){
  const known = new Set(S.exps.map(e=>String(e.numero||'').trim().toLowerCase()));
  const found = [];
  let keys = []; try{ keys = Object.keys(localStorage).filter(k=>k.startsWith('fojas-') && k!==KEY); }catch(e){}
  for(const k of keys){
    const d = readKey(k); if(!d || !Array.isArray(d.exps)) continue;
    for(const e of d.exps){
      const num = String(e.numero||'').trim().toLowerCase();
      if(!num || known.has(num) || isBorrado(num)) continue;
      const x = migExp({...e, id:S.nextId++}, S.users); S.exps.push(x); known.add(num); found.push(x);
      (d.audit||[]).length; // el historial viejo no se mezcla para no romper la cadena de huellas
    }
  }
  if(found.length){ save(); found.forEach(x=>audit('Recuperó un amparo', x.numero, `${x.afiliado}: estaba guardado por una versión anterior de Fojas`, {user:'sistema'})); }
  return found;
}

  d.modules = {...base.modules, ...(d.modules||{})};

  if(!d.ejemploDni){ d.ejemploDni = true; const bor = new Set(d.borrados||[]); ejemplosDni(d.nextId).forEach(x=>{ const n = x.numero.toLowerCase(); if(!bor.has(n) && !d.exps.some(e=>String(e.numero).toLowerCase()===n)){ d.exps.push(migExp(x, d.users)); } }); d.nextId = Math.max(...d.exps.map(e=>+e.id||0)) + 1; }
  if(!d.pwInicial){ d.pwInicial = true; const propias = new Set((d.audit||[]).filter(a=>a.accion==='Cambió su contraseña').map(a=>a.detalle));
    for(const u of d.users){ if(propias.has(u.id)) continue; u.salt = randId(16); u.hash = await hashPass(u.id, u.salt); u.mustChange = true; } }
  if(!d.modAdm){ d.modAdm = true; d.modules = d.modules || {}; d.modules.administrativos = true; }

  d.schema = SCHEMA; d.user = null;

}

// ---------- auditoría encadenada (SHA-256) ----------
async function sha(text){
  if(window.crypto && crypto.subtle){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  let h = 0; for(const c of text){ h = (h*31 + c.charCodeAt(0))|0; } return 'nocrypto'+(h>>>0).toString(16);
}
const entryBody = e => JSON.stringify([e.n, e.ts, e.user, e.accion, e.objeto, e.detalle, e.prev]);
let chain = Promise.resolve();
function audit(accion, objeto, detalle, opts={}){
  const who = opts.user || S.user || 'sistema';
  chain = chain.then(async () => {
    const prev = S.audit.length ? S.audit[S.audit.length-1].hash : 'GENESIS';
    const e = {n:S.audit.length+1, ts:opts.ts || new Date().toISOString(), user:who, accion, objeto, detalle, prev};
    e.hash = await sha(entryBody(e));
    S.audit.push(e); save();
  });
  return chain;
}
async function verifyChain(){
  let prev = 'GENESIS';
  for(const e of S.audit){
    if(e.prev !== prev) return {ok:false, n:e.n};
    if(await sha(entryBody(e)) !== e.hash) return {ok:false, n:e.n};
    prev = e.hash;
  }
  return {ok:true};
}

function randId(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function tempPass(){ const c = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'; let s=''; const a = new Uint8Array(10); crypto.getRandomValues(a); a.forEach(x=>s+=c[x%c.length]); return s+'7'; }
async function hashPass(pass, salt){
  if(!(window.crypto && crypto.subtle)) return sha(salt+':'+pass);
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:new TextEncoder().encode(salt), iterations:150000, hash:'SHA-256'}, k, 256);
  return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

// ---------- cifrado de respaldo (AES-GCM + PBKDF2) ----------
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function deriveKey(pass, salt){
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'}, k, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encrypt(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return 'FOJAS1.' + b64(salt) + '.' + b64(iv) + '.' + b64(ct);
}
async function decrypt(text, pass){
  const [tag, s, i, c] = text.trim().split('.');
  if(tag !== 'FOJAS1') throw new Error('formato');
  const key = await deriveKey(pass, unb64(s));
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(i)}, key, unb64(c));
  return JSON.parse(new TextDecoder().decode(pt));
}

function vAmparos(){
  const all = S.exps;
  const F = {
    todos:{l:'En curso', f:e=>e.estado!=='Archivado'},
    urgentes:{l:'Urgentes', f:e=>{const p=nextPlazo(e); return p && daysTo(p.vence)<=3;}},
    cautelar:{l:'Con cautelar', f:e=>e.cautelar && e.estado!=='Archivado'},
    salud:{l:'De salud', f:e=>!esAdm(e) && e.estado!=='Archivado'},
    adm:{l:'Administrativos', f:e=>esAdm(e) && e.estado!=='Archivado'},
    mios:{l:'Míos', f:e=>e.abogado===S.user && e.estado!=='Archivado'},
    ...(isLeader()?{equipo:{l:'De mi equipo', f:e=>myPeople().includes(e.abogado) && e.estado!=='Archivado'}}:{}),
    archivados:{l:'Archivados', f:e=>e.estado==='Archivado'}
  };
  if(!F[ui.filtro]) ui.filtro='todos';
  const list = ordenar(all.filter(F[ui.filtro].f), ui.orden);
  return `
  <div class="head"><div><h1>Amparos</h1><p class="sub">Tocá cualquier amparo para ver todo lo que tiene. ${ui.orden==='urg'?'Los más urgentes aparecen primero.':'Están en orden alfabético por afiliado.'}</p></div>
    <div class="row"><button class="btn big" data-act="ximportar">${ic('upload')} Importar / migrar</button><button class="btn pri big" data-act="nuevo">${ic('plus')} Nuevo expediente</button></div></div>
  <div class="row" style="justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div class="chips">${Object.entries(F).map(([k,v])=>`<button class="chipbtn ${ui.filtro===k?'on':''}" data-filtro="${k}">${v.l} <span class="badge">${all.filter(v.f).length}</span></button>`).join('')}</div>
    <div class="row small" style="gap:6px;align-items:center"><span class="muted">Ordenar:</span><button class="chipbtn ${ui.orden!=='urg'?'on':''}" data-act="orden" data-v="alfa">A → Z</button><button class="chipbtn ${ui.orden==='urg'?'on':''}" data-act="orden" data-v="urg">Más urgente</button></div></div>
  <div class="cases">${(()=>{ const vistos = new Set(); return list.map(e=>{ if(vistos.has(e.id)) return ''; const k = dniKey(e.dni); const g = k.length>=6 ? list.filter(x=>dniKey(x.dni)===k) : [e]; g.forEach(x=>vistos.add(x.id)); if(g.length>1) return dniTree(g, {ctx:'a', total:mismoDni(e).length});
    const p=nextPlazo(e); const n=p?daysTo(p.vence):null; const u=p?urg(n):''; return `
    <div class="case" data-go="expediente-${e.id}" tabindex="0" role="link">
      <div class="bar ${u}"></div>
      <div><div class="name">${esc(e.afiliado)}</div>
        <div class="meta"><span>${esc(e.prestacion)}</span><span class="mono">${esc(e.numero)}</span><span>A cargo de ${esc(userName(e.abogado).split(' ')[0])}</span></div>
        <div class="row" style="margin-top:8px"><span class="pill">${esc(e.estado)}</span>${e.cautelar?'<span class="pill acc">Con cautelar</span>':''}${e.riesgo==='alto'?'<span class="pill red">Riesgo alto</span>':''}</div></div>
      <div class="right">${p?`<div class="when ${u}">${whenText(n)}</div><div class="small muted" style="max-width:240px">${esc(p.desc)}</div>`:'<span class="pill grn">Sin pendientes</span>'}</div>
    </div>`;}).join(''); })() || `<div class="card empty"><div class="ico g">${ic('folder','lg')}</div><b>No hay amparos en esta lista</b><span>Probá con otro filtro de arriba.</span></div>`}
  </div>`;
}

function vInicioSinAmparos(){

  ${adm?`<section><h2 style="margin-bottom:12px">¿Qué querés hacer?</h2><div class="grid g4">
    <button class="action" data-act="trnuevo" data-clase="reclamo"><div class="ico a">${ic('plus','lg')}</div><b>Nuevo reclamo</b><span>SSS, Defensa del Consumidor, COPREC…</span></button>
    <button class="action" data-act="trnuevo" data-clase="obligacion"><div class="ico v">${ic('cal','lg')}</div><b>Agendar una obligación</b><span>Presentaciones de la empresa.</span></button>
    <a class="action" href="#administrativos" data-admtab="guia"><div class="ico g">${ic('book','lg')}</div><b>Guía de trámites</b><span>Qué, cuándo y cómo.</span></a>
    <a class="action" href="#vencimientos"><div class="ico r">${ic('cal','lg')}</div><b>Ver qué vence</b><span>Ordenado por fecha.</span></a></div></section>

    ${urg.length?`<div class="cases">${urg.slice(0,6).map(x=>trTaskRow(x.t,x.p,x.i)).join('')}</div>`:`<div class="empty"><div class="ico g">${ic('check','lg')}</div><b>No hay nada urgente</b><span>Nada vence en los próximos 3 días.</span></div>`}</section>`

function vVencimientos(){
  const plazos = allPlazos();
  const groups = [
    ['Vencidos','late',p=>daysTo(p.vence)<0],
    ['Hoy y mañana','soon',p=>{const n=daysTo(p.vence); return n>=0 && n<=1;}],
    ['Esta semana','soon',p=>{const n=daysTo(p.vence); return n>=2 && n<=7;}],
    ['Más adelante','okk',p=>daysTo(p.vence)>7]
  ];
  return `
  <div><h1>Vencimientos</h1><p class="sub">Todo lo que hay que presentar o cumplir, ordenado por fecha. Cuando lo hagas, tocá "Hecho".</p></div>
  <details class="card" style="gap:8px"><summary style="cursor:pointer;font-weight:700">${ic('cal','sm')} Próximos feriados y días inhábiles que tenemos en cuenta</summary>
    <div class="list">${upcomingHolidays(10).map(([d,m])=>`<div class="li"><span>${esc(m)}</span><span class="small muted">${fmtLargo(d)}</span></div>`).join('')}</div>
    <p class="small muted">Feriados nacionales según la Ley 27.399 y el Decreto 614/2025; días no laborables con fines turísticos de 2026 según la Resolución 164/2025. Los de 2027 todavía no fueron publicados. La feria judicial de enero se descuenta solo si la elegís al cargar el plazo.</p></details>
  ${groups.map(([t,c,f])=>{ const l = plazos.filter(f); if(!l.length) return ''; return `
    <section class="card"><div class="row"><h2>${t}</h2><span class="badge ${c==='late'?'red':''}">${l.length}</span></div>
      <div class="cases">${l.map(p=>taskRow(p)).join('')}</div></section>`; }).join('') || (vencAdm() ? '' : `<div class="card empty"><div class="ico g">${ic('check','lg')}</div><b>No hay vencimientos pendientes</b></div>`)}
  ${vencAdm()}`;
}

function iaText(kind, e){
  const movs = [...e.movimientos].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const p = nextPlazo(e);
  if(kind==='resumen') return `RESUMEN DEL CASO\n\n${esAdm(e) ? `${e.afiliado} presentó un amparo administrativo por ${e.prestacion.toLowerCase()}: pide ${PIDE_ADM[e.prestacion]||'lo que surge de la demanda'}.${admResumen(e)?` (${admResumen(e)})`:''}` : `${e.afiliado} presentó un amparo para que se le cubra: ${e.prestacion.toLowerCase()}.`} Tramita en el ${e.juzgado} desde el ${fmt(e.inicio)}.\n\nHoy está en la etapa: ${e.estado}.${e.cautelar?' El juez ya ordenó una medida cautelar, así que hay que cumplir la cobertura mientras dura el juicio.':' No hay medida cautelar.'}\n\nLo que pasó hasta ahora:\n${movs.map(m=>`• ${fmt(m.fecha)}: ${m.desc}`).join('\n')}\n${p?`\nLo próximo: ${p.desc} (${whenText(daysTo(p.vence)).toLowerCase()}, ${fmt(p.vence)}).`:''}`;
  if(kind==='paso'){
    const n = p?daysTo(p.vence):null;
    let s = `PRÓXIMOS PASOS\n\n`;
    if(p && n<0) s += `1. URGENTE: "${p.desc}" venció el ${fmt(p.vence)}. Confirmá si se cumplió. Si no, presentalo hoy y avisá al abogado a cargo por el riesgo de multas (astreintes).\n`;
    else if(p) s += `1. Preparar "${p.desc}" antes del ${fmt(p.vence)}.\n`;
    if(e.cautelar) s += `2. Pedirle a Auditoría Médica la constancia de que la prestación se entregó, y presentarla en el juzgado (escrito "Acreditar cumplimiento de cautelar").\n`;
    if(e.estado==='Contestación de demanda') s += `2. Pedir al área técnica el legajo del afiliado y armar el "Informe del art. 8".\n`;
    if(e.estado==='Sentencia') s += `2. Leer la sentencia y decidir con el abogado a cargo si se apela, dentro del plazo.\n`;
    s += `3. Cuando esté hecho, tocá "Ya lo hice" y cargá la novedad, así todo el equipo lo ve.`;
    return s;
  }
  const pts = (e.riesgo==='alto'?3:e.riesgo==='medio'?2:1) + (e.cautelar?1:0) + (p && daysTo(p.vence)<0 ? 2 : 0);
  return `¿QUÉ TAN RIESGOSO ES?\n\nNivel: ${pts>=4?'ALTO':pts>=3?'MEDIO':'BAJO'} (${pts} de 6 puntos)\n\nPuntos a cuidar:\n• Qué se reclama: ${e.prestacion}.${/oncol|Discapacidad|domiciliaria/.test(e.prestacion)?' En estos temas los jueces suelen darle la razón al afiliado.':''}\n• Medida cautelar: ${e.cautelar?'sí. Si no se cumple, puede haber multas.':'no.'}\n• Plazos vencidos: ${e.plazos.filter(x=>!x.hecho && daysTo(x.vence)<0).length}.\n• Monto en juego: ${money(e.monto)}.\n\n${pts>=4?'Recomendación: que el abogado a cargo lo revise hoy.':'Recomendación: seguimiento normal.'}`;
}

async function addModels(files){
  files = [...files]; if(!files.length) return;
  S.modelos = S.modelos || []; const box = $('#mprog');
  for(const f of files){
    let r = {text:''}; try{ r = await readFile(f, (t)=>{ if(box) box.textContent = `${f.name}: ${t}`; }); }catch(err){}
    const texto = (r.text||'').replace(/\[P[aá]gina \d+\]\n?/g,'').replace(/\n{3,}/g,'\n\n').trim();
    if(!texto){ toast(`No pudimos leer ${f.name}`); continue; }
    const m = {id:randId(6), nombre:f.name.replace(/\.[a-z0-9]+$/i,''), categoria:guessCategoria(texto), texto:texto.slice(0,150000), fecha:iso(today()), autor:S.user};
    S.modelos.push(m); audit('Subió un modelo','Modelos',`${m.nombre} (${m.categoria})`);
  }
  save(); render(); toast(files.length===1?'Modelo guardado':'Modelos guardados');
}

}

function ueRead(){ if(!UE) return; const g = id => $(id); if(g('#ueNom')) UE.nombre = g('#ueNom').value; if(g('#ueId') && !g('#ueId').disabled) UE.nuevoId = g('#ueId').value; if(g('#ueRol')) UE.rol = g('#ueRol').value; if(g('.modchecks') && UE.rol!=='Administrador') UE.modulos = modLeer('ueMod'); if(g('#ueP1')) UE.p1 = g('#ueP1').value; if(g('#ueP2')) UE.p2 = g('#ueP2').value; if(g('#ueCambiar')) UE.cambiar = g('#ueCambiar').checked; }
async function ueSave(){
  ueRead(); const u = S.users.find(x=>x.id===UE.id); const yo = u.id===S.user; const err = t => { UE.err = t; drawUserEdit(); };
  const nombre = UE.nombre.trim().replace(/\s+/g,' '), nid = UE.nuevoId.trim().toLowerCase();
  if(nombre.length < 3) return err('Escribí el nombre y apellido.');
  if(!/^[a-z0-9._-]{3,30}$/.test(nid)) return err('El usuario tiene que tener entre 3 y 30 caracteres: letras minúsculas, números, punto, guion o guion bajo, sin espacios.');
  if(nid !== u.id && S.users.some(x=>x.id===nid)) return err('Ya hay alguien con ese usuario. Probá con otro.');
  if(u.rol==='Administrador' && UE.rol!=='Administrador' && !S.users.some(x=>x.id!==u.id && x.activo && x.rol==='Administrador')) return err('Tiene que quedar al menos un administrador activo. Nombrá a otra persona administradora antes de cambiarle el rol.');
  let nuevaPass = null;
  if(UE.pw==='nueva'){ if(!passOk(UE.p1)) return err('La contraseña no cumple los requisitos. ' + PASS_REGLA); if(UE.p1 !== UE.p2) return err('Las dos contraseñas no son iguales.'); nuevaPass = UE.p1; }
  if(UE.pw==='ini') nuevaPass = nid;
  if(UE.pw==='no' && nid !== u.id && u.mustChange && !yo){ nuevaPass = nid; UE.pw = 'ini'; }
  const cambios = [];
  if(nombre !== u.nombre){ cambios.push(`nombre: ${u.nombre} → ${nombre}`); u.nombre = nombre; }
  if(UE.rol !== u.rol){ cambios.push(`rol: ${u.rol} → ${UE.rol}`); u.rol = UE.rol; }
  if(UE.rol!=='Administrador'){ const antes = modsDe(u).join(','), nuevos = (UE.modulos||[]); if(antes !== modsOrg().filter(id=>nuevos.includes(id)).join(',') || !Array.isArray(u.modulos)){ if(antes !== modsOrg().filter(id=>nuevos.includes(id)).join(',')) cambios.push(`módulos: ${antes||'ninguno'} → ${nuevos.join(',')||'ninguno'}`); u.modulos = [...nuevos]; } }
  if(nid !== u.id){ const old = u.id; cambios.push(`usuario: ${old} → ${nid}`); u.id = nid;
    S.exps.forEach(e=>{ if(e.abogado===old) e.abogado = nid; (e.movimientos||[]).forEach(m=>{ if(m.user===old) m.user = nid; }); });
    (S.teams||[]).forEach(t=>{ if(t.jefe===old) t.jefe = nid; t.miembros = t.miembros.map(m=>m===old?nid:m); });
    (S.modelos||[]).forEach(m=>{ if(m.autor===old) m.autor = nid; }); trs().forEach(t=>{ if(t.abogado===old) t.abogado = nid; (t.movimientos||[]).forEach(m=>{ if(m.user===old) m.user = nid; }); }); (S.docCats||[]).forEach(c=>{ if(c.autor===old) c.autor = nid; });
    if(S.lock && S.lock[old]){ S.lock[nid] = S.lock[old]; delete S.lock[old]; } if(S.toured && S.toured[old]){ S.toured[nid] = S.toured[old]; delete S.toured[old]; } }
  if(nuevaPass){ u.salt = randId(16); u.hash = await hashPass(nuevaPass, u.salt); u.mustChange = !yo; if(S.lock) delete S.lock[u.id]; cambios.push(UE.pw==='ini'?'contraseña restablecida (igual al usuario)':'contraseña nueva'); }
  if(!cambios.length){ UE = null; closeModal(); toast('No hubo cambios'); return; }

  UE = null; closeModal(); await chain; render();
}
function eliminarUsuario(u){
  if(!isAdmin() || u.id===S.user) return;
  if(u.rol==='Administrador' && !S.users.some(x=>x.id!==u.id && x.activo && x.rol==='Administrador')){ ui.userMsg = {ok:false, t:'No se puede eliminar al único administrador. Nombrá a otra persona administradora primero.'}; render(); return; }
  const exps = S.exps.filter(e=>e.abogado===u.id), lidera = (S.teams||[]).filter(t=>t.jefe===u.id);
  const otros = S.users.filter(x=>x.id!==u.id && x.activo && x.rol!=='Administrador');
  const def = (lidera[0] && lidera[0].miembros.find(m=>m!==u.id)) || ((S.teams||[]).find(t=>t.miembros.includes(u.id))||{}).jefe || (otros[0]||{}).id || '';
  const necesita = exps.length || lidera.length;
  if(necesita && !otros.length){ ui.userMsg = {ok:false, t:`${u.nombre} tiene expedientes o un equipo a cargo y no hay otra persona a quien pasárselos. Agregá a alguien primero.`}; render(); return; }
  askConfirm({titulo:`¿Eliminar a ${u.nombre}?`, boton:'Sí, eliminar usuario',
    texto:`Ya no va a poder entrar a Fojas. Lo que hizo queda en el historial.${necesita?`<br><br>${exps.length?`Tiene <b>${exps.length} expediente${exps.length>1?'s':''}</b> a cargo`:''}${exps.length&&lidera.length?' y ':''}${lidera.length?`es jefa/e del equipo <b>${lidera.map(t=>esc(t.nombre)).join(', ')}</b>`:''}. ¿A quién ${exps.length+lidera.length>1?'se los':'se lo'} pasamos?<select id="delA" style="margin-top:8px">${otros.map(x=>`<option value="${x.id}" ${x.id===def?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select>`:''}`,
    antes:()=>{ const s = $('#delA'); return s ? s.value : null; },
    run:(a)=>{
      const snap = {user:JSON.parse(JSON.stringify(u)), idx:S.users.indexOf(u), teams:JSON.parse(JSON.stringify(S.teams||[])), exps:exps.map(e=>e.id), lock:(S.lock||{})[u.id]};
      exps.forEach(e=>{ e.abogado = a; });
      (S.teams||[]).forEach(t=>{ if(t.jefe===u.id){ t.jefe = a; t.miembros = t.miembros.filter(m=>m!==a); } t.miembros = t.miembros.filter(m=>m!==u.id); });
      S.users = S.users.filter(x=>x.id!==u.id); if(S.lock) delete S.lock[u.id];
      save(); audit('Eliminó un usuario','Usuarios', `${u.id} (${u.nombre})${a&&necesita?` · sus expedientes${lidera.length?' y su equipo':''} pasan a ${userName(a)}`:''}`);
      ui.userMsg = null; render();
      toast(`Se eliminó a ${u.nombre}.`, ()=>{ S.users.splice(Math.min(snap.idx, S.users.length), 0, snap.user); S.teams = snap.teams; S.exps.forEach(e=>{ if(snap.exps.includes(e.id)) e.abogado = snap.user.id; }); if(snap.lock) S.lock[snap.user.id] = snap.lock; save(); audit('Restauró un usuario','Usuarios', snap.user.id); render(); });
    }});
}

function matchJuzgado(text){
  const t = normTxt(text); const phrases = [];
  let i = t.indexOf('juzgado'); while(i>=0 && phrases.length<30){ phrases.push(t.slice(i, i+200)); i = t.indexOf('juzgado', i+7); }
  let best = null, bestScore = 0;
  for(const j of JZ_INDEX){
    for(const p of phrases){
      if(!j.toks.every(w=>new RegExp('\\b'+w+'\\b').test(p))) continue;
      const pn = (p.match(/\bn (\d+)/)||[])[1]||null;
      if(j.num && pn!==j.num) continue;
      if(!j.num && pn && !/federal de primera instancia de|criminal de rogatorias/.test(normTxt(j.n)) && JZ_INDEX.some(o=>o.num===pn && o.toks.join()===j.toks.join())) continue;
      const score = j.toks.length*2 + (j.num?3:0);
      if(score>bestScore){ bestScore = score; best = j.n; }
    }
  }
  return best;
}
function matchSecretaria(text){
  const m = String(text||'').replace(/\s+/g,' ').match(/Secretar[ií]a\s*(?:N\s*[°ºo*”"'´.]*|Nro\.?|n[uú]mero)?\s*(\d{1,2}\b|(?:en lo\s+)?(?:Civil|Penal|Criminal|Laboral|Fiscal|Previsional|Electoral|Tributaria|de Ejecuci[oó]n)[^,.;\n]{0,40}|[A-D]\b|[UÚ]nica)/i);
  if(!m) return '';
  return /^\d/.test(m[1]) ? `N° ${m[1]}` : m[1].trim().replace(/^en lo\s+/i,'');
}

const LIB = {

const loaded = {};
function loadScript(src){ return loaded[src] = loaded[src] || new Promise((res,rej)=>{ const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = ()=>{ delete loaded[src]; rej(new Error('No se pudo cargar el lector')); }; document.head.appendChild(s); }); }
async function makeOcr(progress){
  await loadScript(LIB.tess);
  let label = 'Leyendo la imagen…';
  const worker = await Tesseract.createWorker('spa', 1, {workerPath:LIB.tessWorker, corePath:LIB.tessCore, langPath:LIB.tessLang,
    logger:m=>{ if(m.status==='recognizing text') progress(label, m.progress); else if(/load/.test(m.status)) progress('Preparando el lector de imágenes (la primera vez tarda un poco)…', m.progress||0); }});
  return {read: async (img, lbl) => { label = lbl || label; const {data:{text}} = await worker.recognize(img); return text; }, end: () => worker.terminate()};
}
async function ocr(img, progress){ const o = await makeOcr(progress); try{ return await o.read(img); } finally { await o.end(); } }
// Devuelve {text, paginas, conImagen}: lee TODAS las páginas; las que no tienen texto (escaneadas o fotos) se leen como imagen.
async function readFile(file, progress){
  const name = file.name.toLowerCase();
  if(file.type==='application/pdf' || name.endsWith('.pdf')){
    await loadScript(LIB.pdf);
    pdfjsLib.GlobalWorkerOptions.workerSrc = LIB.pdfWorker;
    progress('Abriendo el PDF…', .02);
    const doc = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
    const N = doc.numPages; let text = '', conImagen = 0, o = null;
    try{
      for(let i=1;i<=N;i++){
        const pg = await doc.getPage(i);
        const c = await pg.getTextContent();
        let pt = c.items.map(it=>it.str + (it.hasEOL?'\n':' ')).join('');
        if(pt.replace(/\s/g,'').length < 40){
          // página escaneada o con fotos: se lee como imagen
          if(!o) o = await makeOcr((t,p)=>progress(`Página ${i} de ${N} (imagen): ${t}`, (i-1+p)/N));
          const vp = pg.getViewport({scale:2});
          const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
          await pg.render({canvasContext:cv.getContext('2d'), viewport:vp}).promise;
          pt = await o.read(cv, `Leyendo la página ${i} de ${N} (es una imagen)…`);
          cv.width = cv.height = 0; conImagen++;
        }
        text += `\n[Página ${i}]\n` + pt + '\n';
        progress(`Leída la página ${i} de ${N}${conImagen?` · ${conImagen} como imagen`:''}`, i/N);
        pg.cleanup();
      }
    } finally { if(o) await o.end(); }
    return {text, paginas:N, conImagen};
  }
  if(file.type.startsWith('image/')) return {text: await ocr(file, progress), paginas:1, conImagen:1};
  if(name.endsWith('.docx')){ await loadScript(LIB.mammoth); progress('Leyendo el Word…', .5); const r = await mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()}); return {text:r.value, paginas:null, conImagen:0}; }
  if(/\.html?$/.test(name) || file.type==='text/html') return {text: htmlATexto(await file.text()), paginas:null, conImagen:0};
  if(name.endsWith('.rtf')) return {text: (await file.text()).replace(/\\par[d]?/g,'\n').replace(/\{\*?\\[^{}]+}|[{}]|\\[a-z]+-?\d* ?/gi,'').trim(), paginas:null, conImagen:0};
  if(file.type.startsWith('text/') || /\.(txt|csv|xml|json|md)$/.test(name)) return {text: await file.text(), paginas:null, conImagen:0};
  if(/\.(xlsx?|ods)$/.test(name)){ try{ await loadScript(XLSX_URL); const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), {type:'array'}); return {text: wb.SheetNames.map(n=>XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n'), paginas:null, conImagen:0}; }catch(e){} }
  try{ const t = binarioATexto(await file.arrayBuffer()); if(t && t.replace(/\s/g,'').length > 40) return {text:t, paginas:null, conImagen:0}; }catch(e){}
  return {text:'', paginas:null, conImagen:0};
}

function scorePrestaciones(text){
  const t = String(text||'');
  const out = PREST_KW.map(([name, kws])=>[name, kws.reduce((a,[re,w])=>a + ((t.match(new RegExp(re.source, 'gi'))||[]).length * w), 0)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);

  const spec = out.filter(x=>!/^Medicamentos$|^Cobertura integral$/.test(x[0]));

function buildSumario(o){

  if(o.cautelar) partes.push('El juzgado hizo lugar a la medida cautelar y ordenó otorgar la cobertura mientras tramita el proceso.'); }

function motivoInhabil(isoDate, opts={}){
  const d = new Date(isoDate+'T12:00:00'), w = d.getDay();

// Calcula el vencimiento. modo: 'habiles' | 'corridos' | 'horas' | 'fecha'
function calcPlazo(r){
  const desde = r.desde || iso(today());
  const opts = {feria:!!r.feria, noLaborables:r.noLaborables!==false};
  const skipped = []; let d = new Date(desde+'T12:00:00'); let aviso = '';
  if(r.modo==='fecha') { const m = motivoInhabil(r.fecha, opts); return {vence:r.fecha, skipped, aviso: m ? `Esa fecha es inhábil (${m}).` : ''}; }

    let k = 0; const n = Math.max(1, +r.cant||1);
    while(k<n){ d.setDate(d.getDate()+1); const id = isoOf(d), m = motivoInhabil(id, opts); if(m){ if(!/^(sábado|domingo)$/.test(m)) skipped.push({fecha:id, motivo:m}); } else k++; }

  const dias = r.modo==='horas' ? Math.max(1, Math.ceil((+r.cant||24)/24)) : Math.max(1, +r.cant||1);
  d.setDate(d.getDate()+dias);
  let id = isoOf(d), m = motivoInhabil(id, opts);
  if(m){ const orig = id; while(motivoInhabil(id, opts)){ d.setDate(d.getDate()+1); id = isoOf(d); } aviso = `El ${fmt(orig)} es inhábil (${m}): lo pasamos al primer día hábil siguiente. Verificá el criterio del juzgado.`; }

}

// Quién se presenta en la demanda: "NOMBRE APELLIDO, D.N.I. ..., por derecho propio / en representación ... vengo a promover"
function presentante(one){
  const m = String(one||'').match(/(?:^|[.:;]\s*|Juez:?\s*|Juez\/a:?\s*)([A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑa-záéíóúñ'’\- ]{2,50}?(?:,\s*[A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑa-záéíóúñ'’\- ]{2,40})?),?\s+(?:D\.?\s?N\.?\s?I\.?|DNI)[^;]{0,160}?(?:por\s+derecho\s+propio|en\s+(?:nombre\s+y\s+)?representaci[oó]n|vengo\s+a|promuev|interpong|me\s+presento)/);

  let n = m[1].trim().replace(/\s+/g,' ');
  if(/^(se[ñn]or|juez|demanda|promueve|objeto)/i.test(n)) return null;
  if(!n.includes(',')){ const w = n.split(' '); if(w.length>=2){ n = `${w[w.length-1]}, ${w.slice(0,-1).join(' ')}`; } }
  return titleCase(n);
}
function limpiarActor(s){ return titleCase(String(s||'').replace(/^(?:en\s+)?(?:los\s+)?(?:autos\s+)?(?:caratulados\s*:?)?\s*/i,'').replace(/^(?:del?\s+)?(?:Sr\.?|Sra\.?)\s+/i,'').replace(/^[“"«'\s]+/,'').trim()); }
function autosCandidatos(raw, docsInfo){
  const docs = (docsInfo && docsInfo.length) ? docsInfo : [{text:raw, tipo:''}];
  const emp = normTxt(cfg().empresa).split(' ').filter(w=>w.length>3 && !['asociacion','civil','sociedad','anonima'].includes(w));
  const RE = /([A-ZÁÉÍÓÚÑa-záéíóúñ][A-ZÁÉÍÓÚÑa-záéíóúñ.,'() ]{2,120}?)\s+[cC]\s*\/\s*([^"”»\n]{3,160}?)\s+[sS]\s*\/\s*([A-ZÁÉÍÓÚÑa-záéíóúñ][^"”»\n]{2,120})/g;
  const map = new Map();
  docs.forEach(doc=>{
    const t = String(doc.text||'').replace(/[ \t\r\f]+/g,' ');
    let m; RE.lastIndex = 0;
    while((m = RE.exec(t))){
      const antes = t.slice(Math.max(0, m.index-90), m.index), despues = t.slice(m.index + m[0].length, m.index + m[0].length + 70);
      let actorRaw = m[1].replace(/^.*?(?:autos\s+caratulados|en\s+(?:los\s+)?autos|autos\s*:|caratulad[oa]s?\s*:?)\s*[“"«']*/i,'').replace(/^[“"«'\s]+/,'');
      // si el texto anterior es largo, quedarse con la última frase (el nombre suele estar en mayúsculas o después de comillas)
      const q = actorRaw.split(/[“"«]|\s{2,}|\.\s+(?=[A-ZÁÉÍÓÚÑ][a-záéíóúñ])/); actorRaw = q[q.length-1];
      const actor = limpiarActor(actorRaw.replace(/\s*\((?:en\s+)?(?:rep|representaci)[^)]*\)/i,'').replace(/\s+(?:en\s+(?:nombre\s+y\s+)?representaci[oó]n|por\s+s[ií]\s+y\s+en).*$/i,''));
      if(!actor || actor.length < 3 || /^(autos|en|los|que)$/i.test(actor)) continue;
      const demRaw = m[2].trim();
      const dem = titleCase(demRaw).replace(/\bS\.?\s?a\.?(?=\s|$)/g,'S.A.').replace(/\bS\.?r\.?l\.?(?=\s|$)/gi,'S.R.L.');
      const obj = m[3].replace(/\s*(?:\(?\s*Expte?\.?|Expediente|N[°º]\s*\d|\/\/|Fallos|Sala\b).*$/i,'').replace(/[.,;:\s”"»]+$/,'').trim();
      let score = 0;
      if(/autos\s+caratulados|en\s+(los\s+)?autos|autos\s*:|caratulad/i.test(antes)) score += 5;
      if(emp.length && emp.some(w=>normTxt(demRaw).includes(w))) score += 6;
      if(/c[eé]dula|oficio|resoluci/i.test(doc.tipo||'')) score += 4; else if(/demanda/i.test(doc.tipo||'')) score += 1;
      if(/(fallos|csjn|c\.\s?s\.\s?j\.\s?n|cnccf|cnciv|cncont|c[aá]m(?:ara)?\.?\s|sala\s+[ivx\d]|in\s+re|cfr\.|conf\.|ver\s+causa|causa\s|precedente|jurisprudencia|fallo|sentencia\s+de|resuelto\s+en)/i.test(antes)) score -= 8;
      if(/^[^a-z]{0,6}(?:\(|,)?\s*(?:sala|cnccf|csjn|fallos|del?\s+\d{1,2}\/\d{1,2}\/\d{2,4}|\d{1,2}\/\d{1,2}\/\d{2,4}|\(\d{4}\)|causa)/i.test(despues)) score -= 6;
      const autos = `${limpiarActor(actorRaw)} c/ ${dem} s/ ${obj.toLowerCase()}`;
      const key = normTxt(actor);
      const prev = map.get(key);
      if(prev){ prev.count++; prev.score = Math.max(prev.score, score) + 2; }
      else map.set(key, {autos, actor:actor.replace(/\s*\(.*\)\s*$/,'').trim(), score, count:1});
    }
  });
  // la persona con DNI mencionado en la demanda o la cédula suma puntos
  const all = docs.map(d=>d.text||'').join(' ');
  map.forEach(c=>{ const ap = normTxt(c.actor.split(',')[0]).split(' ')[0]; const low = normTxt(all); const k = low.indexOf(ap); if(k>=0 && /\bd n i\b|\bdni\b/.test(low.slice(k, k+160))) c.score += 4; });
  return [...map.values()].sort((a,b)=>b.score-a.score || b.count-a.count);
}

const NUMS = {un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,quince:15,veinte:20,treinta:30,veinticuatro:24,'cuarenta y ocho':48,'setenta y dos':72,'noventa y seis':96};
const ORD = {primer:1,primero:1,segundo:2,tercer:3,tercero:3,cuarto:4,quinto:5,sexto:6,septimo:7,'séptimo':7,octavo:8,noveno:9,decimo:10,'décimo':10};
const toNum = s => { if(!s) return null; s = s.trim().toLowerCase(); if(/^\d+$/.test(s)) return +s; return NUMS[s] || null; };
function extractPlazos(text, hayCautelar){
  const one = String(text||'').replace(/\[P[aá]gina \d+\]/g,' ').replace(/\s+/g,' ');
  const frases = one.split(/(?<=[.;])\s+(?=[A-ZÁÉÍÓÚÑ"“(])/);
  const out = [], vistos = new Set();
  const RE = /(?:plazo|t[eé]rmino|dentro)\b[^.;:]{0,60}?\b(\d{1,3}|cuarenta y ocho|setenta y dos|noventa y seis|veinticuatro|[a-záéíóú]{2,12})\s*(?:\(\s*(\d{1,3}|[a-záéíóú ]{2,20})\s*\)\s*)?(d[ií]as?(?:\s+h[aá]biles|\s+corridos)?|horas|hs\.?)/gi;
  const REORD = /dentro\s+del?\s+(primer|segundo|tercer|cuarto|quinto|sexto|s[eé]ptimo|octavo|noveno|d[eé]cimo)\s+d[ií]a/gi;
  for(const fr of frases){
    const cands = [];
    let m; RE.lastIndex = 0; while((m = RE.exec(fr))){ const n = toNum(m[1]) || toNum(m[2]); if(n) cands.push({n, unidad:m[3].toLowerCase(), txt:m[0]}); }
    REORD.lastIndex = 0; while((m = REORD.exec(fr))){ const n = ORD[m[1].toLowerCase()] || ORD[m[1].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')]; if(n) cands.push({n, unidad:'días', txt:m[0]}); }
    if(!cands.length) continue;
    let tipo = /[aá]br\w*\s+a\s+prueba|per[ií]odo\s+de\s+prueba|apertura\s+a\s+prueba/i.test(fr) ? 'prueba'
      : /informe|art(?:[ií]culo|\.)?\s*8\b|circunstanciado/i.test(fr) ? 'informe'
      : /cautelar|precautoria|innovar/i.test(fr) || (hayCautelar && /otorg|cobertura|provea|suministr|autoric|entreg/i.test(fr)) ? 'cautelar'
      : /int[ií]m/i.test(fr) ? 'intimacion' : /traslado|contest/i.test(fr) ? 'traslado' : 'otro';
    if(tipo==='cautelar' && !hayCautelar) tipo = 'intimacion';
    if(vistos.has(tipo)) continue; vistos.add(tipo);
    const c0 = cands[0];
    const modo = /hora|hs/.test(c0.unidad) ? 'horas' : /corrid/.test(c0.unidad) ? 'corridos' : 'habiles';
    const regla = {modo, cant:c0.n, desde:iso(today())};
    const calc = calcPlazo(regla);
    const desc = {cautelar:'Cumplir medida cautelar', informe:'Presentar informe art. 8 Ley 16.986', intimacion:'Cumplir intimación', traslado:'Contestar traslado', prueba:'Producir la prueba ofrecida (período de prueba)', otro:'Cumplir lo ordenado por el juzgado'}[tipo];
    const cita = fr.length > 170 ? '…' + fr.slice(Math.max(0, fr.indexOf(c0.txt) - 70), fr.indexOf(c0.txt) + c0.txt.length + 40).trim() + '…' : fr.trim();
    const como = modo==='horas' ? `${c0.n} horas corridas` : modo==='corridos' ? `${c0.n} días corridos` : `${c0.n} días hábiles judiciales, desde el día siguiente a la notificación y salteando fines de semana y feriados nacionales`;
    out.push({tipo, desc, regla, vence:calc.vence, nota:`El documento dice: «${cita}». Lo contamos como ${como}, desde hoy. Si te notificaron otro día, cambiá la fecha.${calc.aviso?' '+calc.aviso:''}`});
  }
  return out;
}

  const f = {};
  // número de expediente
  let m = one.match(/\b(CCF|CIV|COM|CAF|CNT|CSS|FSM|FLP|FRO|FCB|FMZ|FTU|FMP|FCR|FRE|FPO|FBB|FGR|FCT|FSA|FPA|FLP)\s*0*(\d{1,6})\s*\/\s*(\d{4})/i);
  if(m) f.numero = `${m[1].toUpperCase()} ${m[2]}/${m[3]}`;
  else if((m = one.match(/Exp(?:ediente|te)?\.?\s*(?:N[°ºo]\.?|Nro\.?|n[uú]mero)?\s*:?\s*([\d.]{1,9}\s*\/\s*\d{4})/i))) f.numero = 'Expte. ' + m[1].replace(/\s/g,'');
  // autos y asociado: se buscan TODOS los "X c/ Y s/ Z" y se elige el del caso, descartando jurisprudencia citada
  const cands = autosCandidatos(raw, docsInfo);
  const pres = presentante(one);
  let b = null;
  if(pres){ const ap = normTxt(pres.split(',')[0]); b = cands.find(c=>normTxt(c.actor).includes(ap)) || null; }
  if(!b && cands.length && cands[0].score >= 0) b = cands[0];
  if(b){ f.autos = b.autos; f.afiliado = b.actor; }
  else if(pres){ f.afiliado = pres; f.autos = `${pres} c/ ${titleCase(cfg().empresa).replace(/\bS\.?\s?a\.?(?=\s|$)/g,'S.A.')} s/ amparo de salud`; f.autosArmados = true; }
  else if(cands.length){ b = cands[0]; f.autos = b.autos; f.afiliado = b.actor; f.autosDudoso = true; }
  f.autosAlternativos = cands.filter(c=>c!==b).slice(0,4).map(c=>({autos:c.autos, actor:c.actor}));
  if(b && cands.some(c=>c!==b && c.score >= b.score - 2)) f.autosDudoso = true;
  // DNI: el más cercano al nombre del asociado; si no, el primero
  { const dnis = [...one.matchAll(/D\.?\s?N\.?\s?I\.?\s*(?:N\s*[°ºo*”"'´.]*|Nro\.?)?\s*:?\s*(\d{1,2})[.\s]?(\d{3})[.\s]?(\d{3})\b/gi)];
    if(dnis.length){ let pick = dnis[0];
      if(f.afiliado){ const ap = normTxt(f.afiliado.split(',')[0]).split(' ')[0]; const low = normTxt(one); let best = 1e9;
        dnis.forEach(dm=>{ const pos = normTxt(one.slice(0, dm.index)).length; const k = low.lastIndexOf(ap, pos); if(k>=0 && pos-k < best){ best = pos-k; pick = dm; } }); }
      f.dni = `${pick[1]}.${pick[2]}.${pick[3]}`; } }
  // juzgado y secretaría
  const jzm = matchJuzgado(one);
  if(jzm) f.juzgado = jzm;
  else if((m = one.match(/(Juzgado\s+[^.;\n]{10,140}?)(?=,|\.|;|\s+Secretar|$)/i))) { f.juzgado = m[1].trim(); f.juzgadoLibre = true; }
  const sec = matchSecretaria(one); if(sec) f.secretaria = sec;
  if(f.juzgado && isCCF(f.juzgado) && sec){ const n = +((sec.match(/\d+/)||[])[0]||0); if(n && !ccfSecretarias(f.juzgado).includes(n)) f.secretariaDudosa = true; }
  // prestación: se puntúa cada tipo según cuántas veces aparecen sus palabras
  const scored = scorePrestaciones(one);
  if(scored.length){ f.prestacion = scored[0][0]; f.otrasPrestaciones = scored.slice(1).filter(x=>x[1] >= Math.max(2, scored[0][1]*0.4)).slice(0,2).map(x=>x[0]); }
  { const adm = scoreAdm(one), topP = scored.length ? scored[0][1] : 0;
    const sumA = adm.reduce((s,x)=>s+x[1],0);
    if(adm.length && (sumA>=2 || topP===0) && sumA >= topP*0.8){ f.tipoAmp = 'administrativo'; f.prestacion = adm[0][0]; f.otrasPrestaciones = adm.slice(1).filter(x=>x[1]>=Math.max(2, adm[0][1]*0.4)).slice(0,2).map(x=>x[0]); f.adm = admDatos(one); }
    else f.tipoAmp = 'prestacional'; }
  // qué pide exactamente
  m = one.match(/cobertura\s+(?:integral\s+|total\s+)?(?:del?\s+(?:cien\s+por\s+ciento\s+)?\(?100\s*%?\)?\s*)?(?:de(?:l)?\s+(?:la\s+|los\s+|las\s+)?)?([^.;]{6,180})/i);
  if(m) f.detalle = m[1].trim().replace(/\s*,?\s+(?:conforme|seg[uú]n|en los t[eé]rminos|dentro|en el plazo|bajo apercibimiento|a fin de|para que|hasta tanto)\b.*$/i,'').replace(/[,\s]+$/,'');
  // cautelar y etapa
  const ordena = /(hacer|hace|h[aá]gase|h[aá]cese)\s+lugar|ord[eé]n(ase|a|ar)|decr[eé]tase|int[ií]m(ase|ar|a)/i.test(one);
  if(/medida cautelar|medida precautoria|prohibici[oó]n de innovar|medida innovativa/i.test(one) && ordena) f.cautelar = true;
  const informe = /art(?:[ií]culo|\.)?\s*8|informe circunstanciado|informe previsto/i.test(one);
  if(f.cautelar) f.estado = 'Cautelar otorgada'; else if(informe) f.estado = 'Contestación de demanda'; else if(/int[ií]m|traslado/i.test(one)) f.estado = 'Demanda';
  // plazos que da el juzgado
  const pl = extractPlazos(t, f.cautelar);
  const orden = ['cautelar','informe','intimacion','traslado','prueba','otro'];
  pl.sort((a,b)=>orden.indexOf(a.tipo)-orden.indexOf(b.tipo));
  if(pl.length){ const p = pl[0]; f.plazoDesc = p.desc; f.plazoFecha = p.vence; f.plazoRegla = p.regla; f.plazoNota = p.nota; f.extra = pl.slice(1).map(x=>({desc:x.desc, vence:x.vence, hecho:false, regla:x.regla, nota:x.nota})); }
  else if(f.cautelar){ f.plazoDesc = 'Cumplir medida cautelar'; }
  else if(informe){ f.plazoDesc = 'Presentar informe art. 8 Ley 16.986'; }
  // si hay cautelar e informe pero el oficio no dice el plazo del informe, se propone uno para revisar
  if(f.cautelar && informe && !pl.some(x=>x.tipo==='informe')){ const r = {modo:'habiles', cant:5, desde:iso(today())}; (f.extra = f.extra||[]).push({desc:'Presentar informe art. 8 Ley 16.986', vence:calcPlazo(r).vence, hecho:false, regla:r, nota:'El documento no dice el plazo del informe: propusimos 5 días hábiles. Revisalo.'}); }
  return f;
}

// ---------- clasificación de documentos ----------
const DOC_TYPES = ['Demanda','Cédula de notificación','Oficio','Resolución','Prescripción médica','Historia clínica','Certificado de discapacidad (CUD)','Presupuesto','Carta documento','Prueba documental','Otro documento'];
function classifyDoc(text, name){
  const t = (text||'') + ' ' + (name||'');
  if(/c[eé]dula\s+de\s+notificaci/i.test(t)) return 'Cédula de notificación';
  if(/(promuev|inicio|interpong|deduzc|vengo a (promover|interponer|iniciar)).{0,60}amparo|\bPETITORIO\b|acci[oó]n de amparo contra/i.test(t)) return 'Demanda';
  if(/\boficio\b/i.test(t) && /(s[ií]rvase|tengo el agrado|me dirijo|a fin de)/i.test(t)) return 'Oficio';
  if(/\bRESUELVO\b|SE RESUELVE|resuelvo\s*:/i.test(t)) return 'Resolución';
  if(/certificado\s+[uú]nico\s+de\s+discapacidad|\bCUD\b/i.test(t)) return 'Certificado de discapacidad (CUD)';
  if(/historia\s+cl[ií]nica|epicrisis|resumen\s+de\s+(la\s+)?historia/i.test(t)) return 'Historia clínica';
  if(/prescrip|receta|\bRp\s*[\/.]|indicaci[oó]n\s+m[eé]dica|indico\s+(el\s+)?tratamiento/i.test(t)) return 'Prescripción médica';
  if(/presupuesto/i.test(t)) return 'Presupuesto';
  if(/carta\s+documento/i.test(t)) return 'Carta documento';
  if(/demanda/i.test(name||'')) return 'Demanda';
  if(/oficio/i.test(name||'')) return 'Oficio';
  if(/c[eé]dula/i.test(name||'')) return 'Cédula de notificación';
  if(/prueba|anexo|document/i.test(name||'')) return 'Prueba documental';
  return 'Otro documento';
}
function flagsFromText(t){
  return {
    prescripcion:/prescrip|receta|\bRp\s*[\/.]|indicaci[oó]n\s+m[eé]dica/i.test(t),
    hc:/historia\s+cl[ií]nica|epicrisis/i.test(t),
    cud:/certificado\s+[uú]nico\s+de\s+discapacidad|\bCUD\b/i.test(t),
    reclamoPrevio:/carta\s+documento|reclam[oó]\s+(ante|a)\s+(la\s+)?(demandada|prepaga|empresa)|negativa|rechaz[oó]\s+(la\s+)?(cobertura|solicitud)|deneg[oó]/i.test(t),
    importado:/importad|del\s+exterior|extranjer/i.test(t),
    offlabel:/off[\s-]?label|fuera\s+de\s+prospecto|no\s+aprobad[oa]\s+por\s+(la\s+)?ANMAT|uso\s+compasivo|experimental/i.test(t),
    fueraCartilla:/fuera\s+de\s+cartilla|no\s+(es\s+)?prestador|prestador\s+no\s+contratado|de\s+su\s+elecci[oó]n|no\s+pertenece\s+a\s+la\s+cartilla/i.test(t),
    menor:/menor\s+de\s+edad|por\s+su\s+hij[oa]|en\s+representaci[oó]n\s+de\s+su\s+hij|\bmenor\b/i.test(t),
    marca:/\b(marca|exclusivamente|no\s+sustituible|no\s+reemplazar)\b/i.test(t)
  };
}
function caseFlags(e){
  const f = {...(e.flags||{})};
  (e.docs||[]).forEach(d=>{ const t = d.tipo+' '+d.nombre;
    if(/Prescripci|prescrip|receta/i.test(t)) f.prescripcion = true;
    if(/Historia|historia/i.test(t)) f.hc = true;
    if(/CUD|discapacidad/i.test(t)) f.cud = true;
    if(/Carta documento|negativa|reclamo/i.test(t)) f.reclamoPrevio = true;
    if(/Demanda|demanda/i.test(t)) f.demanda = true; });
  if(/por su hij/i.test(e.afiliado||'')) f.menor = true;
  return f;
}

        <div><div class="slbl">Normativa</div><div class="row" style="gap:6px">${x.normas.map(n=>`<span class="pill law">${ic('file','sm')} ${esc(n)}</span>`).join('')}</div></div>
        ${real && x.plazo ? `<div class="splazo">${ic('cal')}<div style="flex:1">${p?`<b>Vence el ${fmtLargo(p.vence)}</b><div class="small muted">${esc(p.desc)}${p.regla?` · ${esc(reglaTexto(p.regla))}`:''}</div>`:`<b>Todavía no hay un plazo agendado para esto</b><div class="small muted">Te proponemos: ${esc(x.plazo.desc)} (${x.plazo.regla.cant} ${x.plazo.regla.modo==='horas'?'horas':'días hábiles'}).</div>`}</div>

  return groups.filter(([k])=>s[k].length).map(([k,i,c,t])=>`<div class="sgroup"><div class="row"><div class="ico ${c}" style="width:36px;height:36px">${ic(i,'sm')}</div><h3>${t}</h3><span class="badge">${s[k].length}</span></div>${s[k].map((x,j)=>item(x,k,j)).join('')}</div>`).join('')

    if(per) return R(null, {inf:informeLista(`Informe de ${userName(per)}`, 'Expedientes a su cargo', expsVis().filter(e=>e.abogado===per))});
    if(/equipo/.test(t)){ const tm = teamOf(); const ids = tm ? [tm.jefe, ...tm.miembros] : S.users.map(u=>u.id); return R(null, {inf:informeLista(tm?`Informe del equipo ${tm.nombre}`:'Informe de equipos', 'Todos los expedientes del equipo', expsVis().filter(e=>ids.includes(e.abogado)))}); }
    if(/cautelar/.test(t)) return R(null, {inf:informeLista('Informe de expedientes con cautelar', 'Medidas cautelares vigentes', expsVis().filter(e=>e.cautelar))});
    const rz = t.split(' ').filter(w=>w.length>=5 && !/informe|armame|generame|reporte/.test(w)).map(w=>w.slice(0,6));
    const prI = PRESTACIONES.filter(p=>p!=='Otra' && normTxt(p).split(/[ (/.]+/).some(w=>w.length>=5 && rz.some(r=>w.startsWith(r))));
    if(prI.length) return R(null, {inf:informeLista(`Informe de reclamos: ${prI.join(' / ')}`, 'Por tipo de reclamo', expsVis().filter(e=>prI.includes(e.prestacion)))});
    return R(null, {inf:informeLista('Informe general de amparos', 'Todos los expedientes', expsVis())});
  }

  if(exps.length>1 && !/\b(cuantos|cuantas|todos|lista)\b/.test(t)){
    return R(`Encontré ${exps.length} expedientes${dniKey(exps[0].dni).length>=6 && exps.every(e=>dniKey(e.dni)===dniKey(exps[0].dni))?` del DNI ${exps[0].dni}`:''}:\n${exps.sort(alfa).map(e=>'• '+agExpCorto(e)).join('\n')}\n\n¿Sobre cuál querés saber más?`, {elegir:exps.map(e=>({l:`${e.prestacion} · ${e.numero}`, q:`resumen ${e.numero}`}))});
  }
  if(exps.length===1){
    const e = exps[0], ir = {ir:'expediente-'+e.id, irL:'Abrir expediente'};

    }
    if(/\briesgo\b/.test(t)) return R(iaText('riesgo', e), ir);
    if(/\b(plazo|plazos|vence|vencen|vencimiento|cuando)\b/.test(t)){ const p = pending(e); return R(p.length?`Plazos pendientes de **${e.afiliado}** (${e.numero}):\n${p.map(x=>`• ${x.desc}: ${agVence(x).toLowerCase()}`).join('\n')}`:`**${e.afiliado}** (${e.numero}) no tiene plazos pendientes.`, ir); }

    if(/\b(quien|a cargo|abogad|lleva|responsable)\b/.test(t)) return R(`**${e.afiliado}** (${e.numero}) está a cargo de **${userName(e.abogado)}**.`, ir);
    if(/\b(juzgado|secretaria|tribunal|juez)\b/.test(t)) return R(`Tramita ante el **${e.juzgado||'juzgado sin cargar'}**${e.secretaria?`, Secretaría ${e.secretaria}`:''}.`, ir);
    if(/\bcautelar\b/.test(t)) return R(e.cautelar?`**Sí**, ${e.afiliado} tiene medida cautelar. Si no se cumple puede haber multas (astreintes).`:`**No**, ${e.afiliado} no tiene medida cautelar.`, ir);
    if(/\b(linea|historia|movimiento|movimientos|novedad|novedades|que paso|paso hasta|actuaciones)\b/.test(t)) return R(`Línea de tiempo de **${e.afiliado}** (${e.numero}):\n${lineaItems(e).map(x=>`• ${fmt(x.fecha)} · ${parteNom(x.parte)} · ${movTitulo(x)}${x.desc?': '+x.desc:''}`).join('\n')}`, ir);
    if(/\b(dni|documento de identidad)\b/.test(t)) return R(`El DNI de **${e.afiliado}** es ${e.dni}.`, ir);
    return R(iaText('resumen', e), {...ir, chips:[`¿Qué tengo que hacer en ${e.numero}?`, `Riesgo de ${e.numero}`, `Informe de ${e.numero}`]});

  if(/\b(vence|vencen|vencimiento|vencimientos|vencido|vencidos|urgente|urgentes|hoy|manana|semana|plazos)\b/.test(t)){

  }
  const raices = t.split(' ').filter(w=>w.length>=5).map(w=>w.slice(0,6));
  const prs = PRESTACIONES.filter(p=>p!=='Otra' && normTxt(p).split(/[ (/.]+/).some(w=>w.length>=5 && raices.some(r=>w.startsWith(r))));
  const pr = prs.length ? prs : null;
  const est = ESTADOS.find(s=>t.includes(normTxt(s))) || (/\barchivad/.test(t)?'Archivado':null);
  const quiereLista = /\b(cuantos|cuantas|cantidad|lista|listame|mostrame|cuales|que expedientes|expedientes|casos|amparos)\b/.test(t);
  if(quiereLista && (pr || est || per || /cautelar|riesgo alto|en curso|todos/.test(t))){

  }

async function agClaude(q){
  const k = agKey(); if(!k || !k.key) return null;
  const hist = agMsgs().filter(m=>m.texto && !m.inf).slice(-10).map(m=>({role:m.de==='yo'?'user':'assistant', content:m.texto}));
  if(!hist.length || hist[hist.length-1].content!==q) hist.push({role:'user', content:q});
  while(hist.length && hist[0].role!=='user') hist.shift();
  const r = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', headers:{'content-type':'application/json','x-api-key':k.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:k.model||'claude-sonnet-5-5', max_tokens:1200, system:agContexto(), messages:hist})});
  const j = await r.json(); if(!r.ok) throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
  return (j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n').trim();
}

function agSaber(){ return Array.isArray(S.agSaber) ? S.agSaber : (S.agSaber = []); }
function agPend(){ return Array.isArray(S.agPend) ? S.agPend : (S.agPend = []); }
function agCorpus(){ return [...AYUDA.map(a=>({tipo:'ayuda', t:a.t, k:a.k.join(' '), r:a.r, ir:a.ir})), ...GLOSARIO.map(g=>({tipo:'glosario', t:g.t, k:g.k, r:g.r})), ...agSaber().map(s=>({tipo:'saber', t:s.q, k:'', r:s.r, s})), ...guiaTodas().map(g=>({tipo:'guia', t:g.t, k:[g.cat, orgById(g.org).c, orgById(g.org).l, 'tramite organismo obligacion'].join(' '), r:`${g.que} A quién alcanza: ${g.quien} Cuándo: ${g.cuando}${(g.como||[]).length?' Cómo: '+g.como.join(' '):''} Norma: ${g.norma||'—'}.${g.link?' Link oficial: '+g.link:''}`, ir:'administrativos'})), ...ORGS.filter(o=>o.id!=='otro').map(o=>({tipo:'org', t:o.l, k:o.c+' organismo', r:o.que+(o.plazoNota?' '+o.plazoNota:''), ir:'administrativos'}))]; }
function agKB(q){
  const qt = [...new Set(agTok(q))]; if(!qt.length) return [];
  const docs = agCorpus().map(d=>({d, head:new Set(agTok(d.t+' '+d.k)), body:new Set(agTok(d.r))})); const N = docs.length, idf = {};
  qt.forEach(w=>{ const df = docs.filter(x=>x.head.has(w)||x.body.has(w)).length; idf[w] = df ? Math.log(1 + (N+1)/(df+0.5)) : 1.2; });
  const tot = qt.reduce((a,w)=>a+idf[w],0);
  return docs.map(x=>{ let s = 0; qt.forEach(w=>{ if(x.head.has(w)) s += idf[w]; else if(x.body.has(w)) s += idf[w]*0.6; }); let sc = s/tot;
    if(x.d.tipo==='saber'){ const qs = new Set(agTok(x.d.t)); const inter = qt.filter(w=>qs.has(w)).length; sc = Math.max(sc, inter/Math.sqrt(qt.length*Math.max(1,qs.size))) * 1.1; }
    return {d:x.d, sc}; }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);
}
function agBuscarSaber(q){
  const qt = agTok(q); if(!qt.length) return null; let best = null;
  agSaber().forEach(s=>{ const sc = Math.max(agSim(qt, agTok(s.q)), agSim(qt, agTok(s.q + ' ' + s.r)) * 0.85); if(sc > (best?best.sc:0)) best = {s, sc}; });
  return best && best.sc >= 0.5 ? best : null;
}
function agBuscarGlosario(q){
  const qt = agTok(q); if(!qt.length) return [];
  return GLOSARIO.map(g=>({g, sc: Math.max(agSim(qt, agTok(g.t+' '+g.k)), agSim(qt, agTok(g.t+' '+g.k+' '+g.r))*0.8)})).filter(x=>x.sc>=0.34).sort((a,b)=>b.sc-a.sc);
}
function agBuscarDatos(q){
  const qt = agTok(q).filter(w=>!/^(exped|ampar|afili|cuale|tiene|tengo|lista|mostr)$/.test(w)); if(!qt.length) return [];
  return expsVis().map(e=>{ const blob = [e.afiliado, e.dni, e.prestacion, e.juzgado, e.estado, e.caratula, e.sumario, e.riesgo, userName(e.abogado), ...(e.plazos||[]).map(p=>p.desc), ...(e.movimientos||[]).map(m=>(m.titulo||'')+' '+(m.desc||'')), ...(e.docs||[]).map(d=>d.nombre+' '+(d.tipo||''))].join(' ');
    const dt = new Set(agTok(blob)); const hits = qt.filter(w=>dt.has(w)).length; return {e, sc: hits/qt.length, hits}; })
    .filter(x=>x.hits>=1 && x.sc>=0.75).sort((a,b)=>b.sc-a.sc || alfa(a.e,b.e)).slice(0,6);
}
function agAnotarPendiente(q){ const t = normTxt(q).trim(); if(!t) return; const p = agPend(); if(!p.some(x=>normTxt(x.q)===t)){ p.push({id:randId(8), q:String(q).trim(), user:S.user, fecha:iso(today()), veces:1}); } else p.find(x=>normTxt(x.q)===t).veces++; save(); }
function agAprender(q, r, origen){
  const s = {id:randId(8), q:String(q).trim(), r:String(r).trim(), autor:S.user, fecha:iso(today()), usos:0, origen:origen||'enseñado'};
