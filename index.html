<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fojas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: menú lateral con íconos grandes + área de trabajo con tarjetas amplias; lo urgente siempre arriba y en color */
:root{
  /* Paleta: fondo blanco, verdes (bosque, oliva, salvia) y marrones (nogal, tierra, arena) */
  --bg:#FFFFFF; --surface:#FFFFFF; --sunken:#F7F4EF; --line:#E6DED3;
  --ink:#2E2520; --muted:#6F6157; --faint:#A39586;
  --accent:#2F6B3F; --accent-ink:#FFFFFF; --accent-soft:#E5F0E3;
  --danger:#B23A2B; --danger-soft:#FBE7E2; --warn:#9A6A1E; --warn-soft:#FAF0DC; --ok:#5E8A3A; --ok-soft:#EEF4E4;
  --violet:#8B5E3C; --violet-soft:#F4EADF;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px; --shadow:0 1px 2px rgba(60,40,20,.05), 0 4px 14px rgba(60,40,20,.06); color-scheme:light;
}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800} h2{font-size:20px;font-weight:700} h3{font-size:17px;font-weight:700}
a{color:var(--accent)}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.92em}
.muted{color:var(--muted)} .small{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:18px;height:18px}
svg.i.lg{width:30px;height:30px}

.app{display:grid;grid-template-columns:250px 1fr;height:100%}
.side{background:#FBF9F5;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:18px 14px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--violet);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:19px}
.brand b{font-size:21px;font-weight:800}
.navlabel{font-size:13px;font-weight:600;color:var(--faint);padding:16px 12px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;border:0;background:none;cursor:pointer;text-align:left;width:100%}
.nav a:hover,.nav button:hover{background:var(--sunken)}
.nav a.on{background:var(--accent);color:var(--accent-ink)}
.nav .badge{margin-left:auto}
.badge{font-size:13px;font-weight:700;min-width:24px;text-align:center;padding:1px 8px;border-radius:12px;background:var(--sunken);color:var(--muted)}
.badge.red{background:var(--danger);color:#fff}
.nav a.on .badge{background:rgba(255,255,255,.25);color:inherit}
.side .foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;margin-left:auto}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--violet-soft);color:var(--violet);display:grid;place-items:center;font-weight:800}
.who div{line-height:1.2} .who span{font-size:13px;color:var(--muted)}
.search{position:relative;flex:1;min-width:220px;max-width:520px}
.search input[type=search]{width:100%;padding:11px 14px 11px 44px;border-radius:12px;border:1px solid var(--line);background:var(--sunken)}
.search > svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:5;overflow:hidden}
.results a{display:block;padding:10px 14px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.results a:last-child{border-bottom:0}
.results a:hover,.results a.sel{background:var(--accent-soft)}
.view{flex:1;overflow:auto;padding:28px;display:flex;flex-direction:column;gap:24px}
.demo{font-size:13px;background:var(--violet-soft);color:var(--violet);padding:6px 28px}

input[type=text],input[type=password],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.ok:hover{filter:brightness(1.08);color:#fff}
.btn.big{padding:14px 22px;font-size:17px;border-radius:12px}
.btn.sm{padding:6px 11px;font-size:14px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.sub{color:var(--muted);font-size:15px}

/* accesos grandes del inicio */
.action{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:20px;cursor:pointer;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .12s, border-color .12s}
.action:hover{border-color:var(--accent);transform:translateY(-2px)}
.action b{font-size:18px}
.action span{color:var(--muted);font-size:14px}
.ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center}
.ico.a{background:var(--accent-soft);color:var(--accent)} .ico.r{background:var(--danger-soft);color:var(--danger)} .ico.v{background:var(--violet-soft);color:var(--violet)} .ico.g{background:var(--ok-soft);color:var(--ok)} .ico.y{background:var(--warn-soft);color:var(--warn)}

/* tareas */
.task{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--sunken);border-left:5px solid var(--line)}
.task.late{border-color:var(--danger);background:var(--danger-soft)}
.task.soon{border-color:var(--warn)}
.task.okk{border-color:var(--ok)}
.task .txt{flex:1;min-width:0}
.task .txt a{color:var(--ink);text-decoration:none;font-weight:700}
.task .txt a:hover{text-decoration:underline}
.when{font-weight:700;font-size:14px;white-space:nowrap}
.when.late{color:var(--danger)} .when.soon{color:var(--warn)} .when.okk{color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap;background:var(--sunken);color:var(--muted);border:1px solid var(--line)}
.pill.red{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.pill.yel{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.grn{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.empty{text-align:center;padding:26px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ico{margin-bottom:4px}

/* filtros tipo chip */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:22px;padding:8px 16px;cursor:pointer;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.chipbtn:hover{border-color:var(--accent)}
.chipbtn.on{background:var(--violet);border-color:var(--violet);color:#fff}
.chipbtn .badge{background:rgba(127,127,127,.18);color:inherit}

/* lista de amparos como tarjetas */
.cases{display:flex;flex-direction:column;gap:10px}
.case{display:grid;grid-template-columns:6px 1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px 14px 0;cursor:pointer;box-shadow:var(--shadow)}
.case:hover{border-color:var(--accent)}
.case .bar{align-self:stretch;border-radius:0 4px 4px 0;background:var(--line)}
.case .bar.late{background:var(--danger)} .case .bar.soon{background:var(--warn)} .case .bar.okk{background:var(--ok)}
.case .name{font-weight:700;font-size:17px}
.case .meta{color:var(--muted);font-size:14px;display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:2px}
.case .right{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}

/* expediente */
.next{background:linear-gradient(0deg,var(--surface),var(--surface));border:2px solid var(--accent);border-radius:var(--r);padding:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.next.late{border-color:var(--danger);background:var(--danger-soft)}
.next .txt{flex:1;min-width:240px}
.next .lbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.next h2{font-size:22px;margin:4px 0}
.steps{display:flex;gap:0;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:110px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:0;padding:4px;position:relative;color:var(--muted);font-size:13px;font-weight:600;text-align:center}
.step::before{content:"";position:absolute;top:17px;left:-50%;right:50%;height:3px;background:var(--line);z-index:0}
.step:first-child::before{display:none}
.step .dot{width:34px;height:34px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;z-index:1;font-weight:800;color:var(--faint)}
.step.done{color:var(--ink)} .step.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .step.done::before{background:var(--accent)}
.step.cur{color:var(--accent)} .step.cur .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)} .step.cur::before{background:var(--accent)}
.step:hover .dot{border-color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{border:0;background:none;padding:9px 14px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;display:inline-flex;gap:8px;align-items:center}
.tabs button:hover{background:var(--sunken);color:var(--ink)}
.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fact{background:var(--sunken);border-radius:12px;padding:12px 14px}
.fact span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.fact b{font-weight:600}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.doc{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.ia{background:var(--violet-soft);border-radius:14px;padding:18px;white-space:pre-wrap;line-height:1.6}
.notice{padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.notice.bad{background:var(--danger-soft);color:var(--danger)}
.notice.good{background:var(--ok-soft);color:var(--ok)}
.hash{font-family:var(--f-mono);font-size:12px;color:var(--faint);word-break:break-all}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:200px 1fr 40px;gap:12px;align-items:center}
.barrow .track{height:18px;background:var(--sunken);border-radius:6px;overflow:hidden}
.barrow .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--ok));border-radius:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;font-weight:700;color:var(--muted);background:var(--sunken)}
tr:last-child td{border-bottom:0}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
.mod.active{border-color:var(--accent);box-shadow:inset 0 4px 0 var(--accent), var(--shadow)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form label,.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
.form .full{grid-column:1/-1}
.hint{font-weight:400;font-size:13px;color:var(--faint)}

/* modal y asistente de carga */
.overlay{position:fixed;inset:0;background:rgba(8,20,24,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:10}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:18px;width:min(640px,100%);padding:26px;display:flex;flex-direction:column;gap:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.wsteps{display:flex;gap:8px}
.wsteps span{flex:1;height:6px;border-radius:4px;background:var(--line)}
.wsteps span.on{background:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font-weight:600}
.opt:hover{border-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.tour{text-align:center;align-items:center}
.tour .ico{width:72px;height:72px;border-radius:20px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)} .dots i.on{background:var(--accent);width:22px;border-radius:4px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;z-index:20;display:flex;gap:14px;align-items:center;font-weight:600}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--accent-soft);font-weight:800;cursor:pointer;text-decoration:underline}

/* ingreso */
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.login .pitch{background:linear-gradient(160deg,#2F6B3F 0%,#24502F 60%,#5A3E2B 100%);color:var(--accent-ink);padding:56px;display:flex;flex-direction:column;gap:22px;justify-content:center}
.login .pitch h1{font-size:38px;line-height:1.15;max-width:16ch}
.login .pitch .feat{display:flex;gap:12px;align-items:center;font-size:17px}
.login .pitch .feat svg{opacity:.9}
.login .box{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--bg)}
.login .box .card{width:min(420px,100%);padding:30px}

/* esquema del equipo */
.org{display:flex;flex-direction:column;align-items:center;padding:8px 0}
.orgcard{display:flex;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;min-width:250px;box-shadow:var(--shadow);font:inherit;color:inherit}
.orgcard:hover{border-color:var(--accent)}
.orgcard.boss{border-color:var(--accent);background:var(--accent-soft)}
.kids{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;position:relative;padding-top:44px;margin-top:0}
.kids::before{content:"";position:absolute;top:0;left:50%;width:2px;height:22px;background:var(--violet)}
.kid{position:relative;display:flex}
.kid::before{content:"";position:absolute;top:-22px;left:50%;width:2px;height:22px;background:var(--violet)}
.kid::after{content:"";position:absolute;top:-22px;height:2px;background:var(--violet);left:-14px;right:-14px}
.kid:first-child::after{left:50%} .kid:last-child::after{right:50%} .kid:only-child::after{display:none}
.members{display:flex;flex-direction:column;gap:12px}
.member{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.member[open]{border-color:var(--accent)}
.member summary{list-style:none;display:flex;gap:14px;align-items:center;padding:16px 18px;cursor:pointer;flex-wrap:wrap}
.member summary::-webkit-details-marker{display:none}
.member summary:hover{background:var(--sunken)}
.member .chev{transition:transform .15s;color:var(--muted)}
.member[open] .chev{transform:rotate(90deg)}
.panel{background:var(--sunken);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{display:flex;gap:8px;align-items:center;font-size:15px}
.mini{background:var(--surface);border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.mini a{color:var(--ink);text-decoration:none} .mini a:hover{text-decoration:underline}

@media (max-width:860px){
  .kids{flex-direction:column;align-items:center;gap:14px} .kid::after{display:none}
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
  .side .navlabel,.brand b,.nav a span.lbl,.nav button span.lbl{display:none}
  .brand{padding:0 6px}
  .nav{flex-direction:row}
  .side .foot{margin:0;padding:0;border:0;display:flex}
  .view{padding:18px}
  .top{padding:10px 16px}
  .who div{display:none}
  .form{grid-template-columns:1fr}
  .login{grid-template-columns:1fr}
  .login .pitch{padding:32px}
  .barrow{grid-template-columns:120px 1fr 32px}
  .case{grid-template-columns:6px 1fr}
  .case .right{grid-column:2;align-items:flex-start;text-align:left}
  .tl{grid-template-columns:1fr;gap:4px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
// ---------- íconos ----------
const IC = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',

// ---------- auditoría encadenada (SHA-256) ----------
async function sha(text){
  if(window.crypto && crypto.subtle){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  let h = 0; for(const c of text){ h = (h*31 + c.charCodeAt(0))|0; } return 'nocrypto'+(h>>>0).toString(16);
}
const entryBody = e => JSON.stringify([e.n, e.ts, e.user, e.accion, e.objeto, e.detalle, e.prev]);
let chain = Promise.resolve();
function audit(accion, objeto, detalle, opts={}){
  const who = opts.user || S.user || 'sistema';
  chain = chain.then(async () => {
    const prev = S.audit.length ? S.audit[S.audit.length-1].hash : 'GENESIS';
    const e = {n:S.audit.length+1, ts:opts.ts || new Date().toISOString(), user:who, accion, objeto, detalle, prev};
    e.hash = await sha(entryBody(e));
    S.audit.push(e); save();
  });
  return chain;
}
async function verifyChain(){
  let prev = 'GENESIS';
  for(const e of S.audit){
    if(e.prev !== prev) return {ok:false, n:e.n};
    if(await sha(entryBody(e)) !== e.hash) return {ok:false, n:e.n};
    prev = e.hash;
  }
  return {ok:true};
}

// ---------- cifrado de respaldo (AES-GCM + PBKDF2) ----------
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function deriveKey(pass, salt){
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'}, k, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encrypt(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return 'FOJAS1.' + b64(salt) + '.' + b64(iv) + '.' + b64(ct);
}
async function decrypt(text, pass){
  const [tag, s, i, c] = text.trim().split('.');
  if(tag !== 'FOJAS1') throw new Error('formato');
  const key = await deriveKey(pass, unb64(s));
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(i)}, key, unb64(c));
  return JSON.parse(new TextDecoder().decode(pt));
}

function iaText(kind, e){
  const movs = [...e.movimientos].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const p = nextPlazo(e);
  if(kind==='resumen') return `RESUMEN DEL CASO\n\n${e.afiliado} presentó un amparo para que se le cubra: ${e.prestacion.toLowerCase()}. Tramita en el ${e.juzgado} desde el ${fmt(e.inicio)}.\n\nHoy está en la etapa: ${e.estado}.${e.cautelar?' El juez ya ordenó una medida cautelar, así que hay que cumplir la cobertura mientras dura el juicio.':' No hay medida cautelar.'}\n\nLo que pasó hasta ahora:\n${movs.map(m=>`• ${fmt(m.fecha)}: ${m.desc}`).join('\n')}\n${p?`\nLo próximo: ${p.desc} (${whenText(daysTo(p.vence)).toLowerCase()}, ${fmt(p.vence)}).`:''}`;
  if(kind==='paso'){
    const n = p?daysTo(p.vence):null;
    let s = `PRÓXIMOS PASOS\n\n`;
    if(p && n<0) s += `1. URGENTE: "${p.desc}" venció el ${fmt(p.vence)}. Confirmá si se cumplió. Si no, presentalo hoy y avisá al abogado a cargo por el riesgo de multas (astreintes).\n`;
    else if(p) s += `1. Preparar "${p.desc}" antes del ${fmt(p.vence)}.\n`;
    if(e.cautelar) s += `2. Pedirle a Auditoría Médica la constancia de que la prestación se entregó, y presentarla en el juzgado (escrito "Acreditar cumplimiento de cautelar").\n`;
    if(e.estado==='Informe art. 8 pendiente') s += `2. Pedir al área técnica el legajo del afiliado y armar el "Informe del art. 8".\n`;
    if(e.estado==='Sentencia') s += `2. Leer la sentencia y decidir con el abogado a cargo si se apela, dentro del plazo.\n`;
    s += `3. Cuando esté hecho, tocá "Ya lo hice" y cargá la novedad, así todo el equipo lo ve.`;
    return s;
  }
  const pts = (e.riesgo==='alto'?3:e.riesgo==='medio'?2:1) + (e.cautelar?1:0) + (p && daysTo(p.vence)<0 ? 2 : 0);
  return `¿QUÉ TAN RIESGOSO ES?\n\nNivel: ${pts>=4?'ALTO':pts>=3?'MEDIO':'BAJO'} (${pts} de 6 puntos)\n\nPuntos a cuidar:\n• Qué se reclama: ${e.prestacion}.${/oncol|Discapacidad|domiciliaria/.test(e.prestacion)?' En estos temas los jueces suelen darle la razón al afiliado.':''}\n• Medida cautelar: ${e.cautelar?'sí. Si no se cumple, puede haber multas.':'no.'}\n• Plazos vencidos: ${e.plazos.filter(x=>!x.hecho && daysTo(x.vence)<0).length}.\n• Monto en juego: ${money(e.monto)}.\n\n${pts>=4?'Recomendación: que el abogado a cargo lo revise hoy.':'Recomendación: seguimiento normal.'}`;
}

function count(arr, key){ const m = {}; arr.forEach(x=>{ m[x[key]] = (m[x[key]]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
function bars(title, rows){
  const max = Math.max(1, ...rows.map(r=>r[1]));
  return `<section class="card"><h2>${title}</h2><div class="bars">${rows.map(([k,v])=>`<div class="barrow"><span class="small">${esc(k)}</span><div class="track"><div class="fill" style="width:${v/max*100}%"></div></div><b class="mono">${v}</b></div>`).join('')}</div></section>`;
}

  if(s===2) body = `

  if(s===4) body = `
    <div class="facts">
      <div class="fact"><span>Afiliado</span><b>${esc(W.afiliado)}</b></div>
      <div class="fact"><span>Qué reclama</span><b>${esc(W.prestacion)}</b></div>
      <div class="fact"><span>Expediente</span><b class="mono">${esc(W.numero)}</b></div>
      <div class="fact"><span>Juzgado</span><b>${esc(W.juzgado)}</b></div>
      <div class="fact"><span>Etapa</span><b>${esc(W.estado)}</b></div>
      <div class="fact"><span>Cautelar</span><b>${W.cautelar?'Sí':'No'}</b></div>
      ${W.plazoDesc?`<div class="fact"><span>Primer plazo</span><b>${esc(W.plazoDesc)}</b><div class="small muted">${fmt(W.plazoFecha)}</div></div>`:''}

function wRead(){
  const v = id => { const el = $('#'+id); return el ? el.value.trim() : null; };

  if(v('wPd')!==null) W.plazoDesc = v('wPd'); if(v('wPv')!==null) W.plazoFecha = v('wPv');

function wCheck(){
  if(W.step===1 && !W.afiliado) return 'Escribí el nombre del afiliado para seguir.';
  if(W.step===2){ if(!W.prestacion) return 'Elegí qué reclama.'; if(!W.numero) return 'Escribí el número de expediente.'; if(S.exps.some(x=>x.numero.toLowerCase()===W.numero.toLowerCase())) return 'Ya hay un amparo cargado con ese número.'; if(!W.juzgado) return 'Escribí el juzgado.'; }
  return '';
}

// ---------- render ----------
function render(){
  if(!logged()){ $('#root').innerHTML = vIngreso(); document.title='Fojas · Ingresar'; return; }
  document.title='Fojas';
  const r = route();
  const views = {equipo:vEquipo, inicio:vInicio, amparos:vAmparos, vencimientos:vVencimientos, escritos:vEscritos, informes:vInformes, historial:vHistorial, modulos:vModulos, respaldo:vRespaldo, usuarios:vUsuarios};
  const html = r.name==='expediente' ? vExpediente(r.id) : (views[r.name]||vInicio)();
  const scroll = $('#view') ? $('#view').scrollTop : 0;
  $('#root').innerHTML = shell(html);
  $('#view').scrollTop = scroll;
}
async function rerenderAfterAudit(){ await chain; render(); }

function markDone(e, i){
  const p = e.plazos[i]; if(!p || p.hecho) return;
  p.hecho = true; save(); audit('Marcó como hecho', e.numero, p.desc); render();
  toast(`Listo: "${p.desc}" quedó como hecho.`, () => { p.hecho = false; save(); audit('Deshizo "hecho"', e.numero, p.desc); render(); });
}

// ---------- eventos ----------
document.addEventListener('click', async ev => {
  if(!ev.target.closest('.search')) { if(ui.results){ ui.results=false; const r=$('.results'); if(r) r.remove(); } }
  const om = ev.target.closest('[data-openmember]');
  if(om){ ui.open[om.dataset.openmember] = true; if(route().name!=='equipo'){ ui.scrollTo = om.dataset.openmember; return; } render(); const d = document.querySelector(`[data-member="${om.dataset.openmember}"]`); if(d) d.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  const t = ev.target.closest('[data-act],[data-tab],[data-go],[data-ia],[data-filtro],[data-riesgo],[data-estado],[data-tour],[data-tpl],[data-tplexp],[data-w],[data-wnav],[data-quick]');
  if(!t) return;
  const r = route(); const e = r.name==='expediente' ? expById(r.id) : null;
  const d = t.dataset;
  if(d.tour!==undefined){ openTour(+d.tour); return; }
  if(d.go){ location.hash = d.go; return; }
  if(d.tab){ ui.tab = d.tab; render(); return; }
  if(d.filtro){ ui.filtro = d.filtro; render(); return; }
  if(d.riesgo && e){ const old=e.riesgo; if(old===d.riesgo) return; e.riesgo = d.riesgo; save(); audit('Cambió el riesgo', e.numero, `${old} → ${d.riesgo}`); render(); toast('Riesgo actualizado'); return; }
  if(d.estado!==undefined && e){ const nuevo = ESTADOS[+d.estado], old = e.estado; if(nuevo===old) return; e.estado = nuevo; save(); audit('Cambió la etapa', e.numero, `${old} → ${nuevo}`); render();
    toast(`Etapa cambiada a "${nuevo}".`, ()=>{ e.estado = old; save(); audit('Deshizo cambio de etapa', e.numero, `${nuevo} → ${old}`); render(); }); return; }
  if(d.ia && e){ ui.ia = iaText(d.ia, e); audit('Usó el asistente', e.numero, {resumen:'Resumen del caso', paso:'Próximos pasos', riesgo:'Evaluación de riesgo'}[d.ia]); render(); return; }
  if(d.tpl){ ui.tpl = d.tpl; ui.tplText=''; render(); return; }
  if(d.tplexp){ ui.tplExp = +d.tplexp; ui.tplText=''; render(); return; }
  if(d.quick){ $('#plV').value = dPlus(+d.quick); document.querySelectorAll('[data-quick]').forEach(b=>b.classList.toggle('on', b===t)); return; }
  if(d.w){ wRead(); const k = d.w; if(k==='cautelar') W.cautelar = d.v==='1'; else if(k==='plazoDias'){ W.plazoDias = +d.v; W.plazoFecha = dPlus(+d.v); } else W[k] = d.v; drawWizard(); return; }
  if(d.wnav){ wRead(); if(+d.wnav>0){ const err = wCheck(); if(err){ $('#wErr').innerHTML = `<div class="notice bad">${esc(err)}</div>`; return; } } W.step += +d.wnav; drawWizard(); return; }
  const a = d.act;
  if(a==='close') closeModal();
  if(a==='newteam' && isAdmin()){ S.teams.push({id:'t'+Date.now(), nombre:'Nuevo equipo', jefe:staff()[0].id, miembros:[]}); save(); audit('Creó un equipo','Equipos','Nuevo equipo'); await chain; render(); }
  if(a==='delteam' && isAdmin()){ const tm = S.teams.find(x=>x.id===d.team); const i = S.teams.indexOf(tm); S.teams.splice(i,1); save(); audit('Eliminó un equipo','Equipos',tm.nombre); render();
    toast(`Equipo "${tm.nombre}" eliminado.`, ()=>{ S.teams.splice(i,0,tm); save(); audit('Restauró un equipo','Equipos',tm.nombre); render(); }); }
  if(a==='tour') openTour(0);
  if(a==='logout') logout();
  if(a==='pwd') openPwd(false);
  if(a==='nuevo') openNuevo();
  if(a==='wcreate'){
    const x = {id:S.nextId++, numero:W.numero, afiliado:W.afiliado, nroAf:W.nroAf||'—', prestacion:W.prestacion, juzgado:W.juzgado, estado:W.estado, riesgo:/oncol|Discapacidad|domiciliaria/.test(W.prestacion)||W.cautelar?'alto':'medio', abogado:S.user, inicio:iso(today()), monto:0, cautelar:W.cautelar, plazos:[], movimientos:[{fecha:iso(today()), tipo:'Interno', desc:'Se cargó el amparo en Fojas.', user:S.user}], docs:[]};
    x.caratula = `${x.afiliado} c/ Salud Integral Demo S.A. s/ amparo de salud`;
    if(W.plazoDesc) x.plazos.push({desc:W.plazoDesc, vence:W.plazoFecha, hecho:false});
    S.exps.push(x); save(); closeModal(); audit('Cargó un amparo nuevo', x.numero, x.prestacion); location.hash = 'expediente-'+x.id; toast('¡Amparo cargado!');
  }
  if(a==='done'){ const x = expById(d.e); if(x) markDone(x, +d.i); }
  if(a==='writefor'){ ui.tpl = null; ui.tplExp = +d.e; ui.tplText=''; location.hash='escritos'; }
  if(a==='addmov'){ ui.addMov = true; render(); setTimeout(()=>$('#mvD').focus(),20); }
  if(a==='cancelmov'){ ui.addMov = false; render(); }
  if(a==='addplazo'){ ui.addPlazo = true; ui.tab='plazos'; render(); setTimeout(()=>{ const f=$('#plD'); if(f) f.focus(); },20); }
  if(a==='cancelplazo'){ ui.addPlazo = false; render(); }
  if(a==='copyia') copy(ui.ia);
  if(a==='tplback1'){ ui.tpl=null; ui.tplText=''; render(); }
  if(a==='tplback2'){ ui.tplExp=null; ui.tplText=''; render(); }
  if(a==='tplreset'){ ui.tpl=null; ui.tplExp=null; ui.tplText=''; render(); }
  if(a==='tplcopy'){ copy($('#tplText').value); audit('Copió un escrito', expById(ui.tplExp).numero, TEMPLATES.find(q=>q.id===ui.tpl).nombre); }
  if(a==='tplsave'){ const x = expById(ui.tplExp); const tpl = TEMPLATES.find(q=>q.id===ui.tpl);
    x.docs.push({nombre:`${tpl.nombre}.docx`, tipo:'Escrito propio', fecha:iso(today()), size:`${Math.max(1,Math.round($('#tplText').value.length/1000))} KB`});
    x.movimientos.push({fecha:iso(today()), tipo:'Escrito propio', desc:`Se preparó el escrito: ${tpl.nombre}.`, user:S.user}); save();
    audit('Preparó un escrito', x.numero, tpl.nombre); toast('Guardado en los documentos del amparo'); }
  if(a==='csv'){ const rows = [['numero','afiliado','prestacion','juzgado','etapa','riesgo','a_cargo','proximo_plazo','vence']].concat(S.exps.map(x=>{const p=nextPlazo(x);return [x.numero,x.afiliado,x.prestacion,x.juzgado,x.estado,x.riesgo,userName(x.abogado),p?p.desc:'',p?fmt(p.vence):''];}));
    copy(rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n')); audit('Exportó informe', 'Informes', 'Planilla de amparos'); }
  if(a==='verify'){ await chain; ui.verify = await verifyChain(); render(); }
  if(a==='tamper'){ await chain; if(S.audit.length>2){ const i = Math.floor(S.audit.length/2); S.audit[i].detalle += ' (editado a escondidas)'; save(); ui.verify = await verifyChain(); render(); } }
  if(a==='backup'){ const pass = $('#bkPass').value; if(pass.length<8){ ui.backupMsg={ok:false,t:'La contraseña tiene que tener al menos 8 caracteres.'}; render(); return; }
    try{ ui.backupOut = await encrypt({exps:S.exps, modules:S.modules, audit:S.audit, nextId:S.nextId}, pass); ui.backupMsg={ok:true,t:`Copia lista: ${S.exps.length} amparos y ${S.audit.length} registros del historial. Copiala y guardala en un lugar seguro.`}; audit('Generó una copia de seguridad','Copias','Copia cifrada'); }
    catch(x){ ui.backupMsg={ok:false,t:'Este navegador no permitió cifrar la copia.'}; } await chain; render(); }
  if(a==='restore'){ const pass = $('#bkPass').value, txt = $('#bkOut').value;
    try{ const dd = await decrypt(txt, pass); Object.assign(S, {exps:dd.exps, modules:dd.modules, audit:dd.audit, nextId:dd.nextId}); ui.backupOut = txt; ui.backupMsg={ok:true,t:`Copia recuperada: ${dd.exps.length} amparos.`}; save(); audit('Recuperó una copia de seguridad','Copias','Desde copia cifrada'); }
    catch(x){ ui.backupMsg={ok:false,t:'No pudimos recuperarla. Revisá que la copia esté completa y que la contraseña sea la misma que usaste.'}; } await chain; render(); }
  if(a==='copybk') copy($('#bkOut').value);
  if(a==='csvsample'){ $('#csvIn').value = SAMPLE_CSV; }
  if(a==='csvimport'){ const lines = $('#csvIn').value.trim().split(/\r?\n/).filter(Boolean);
    if(lines.length<2){ ui.csvMsg={ok:false,t:'Pegá la planilla con la fila de títulos y al menos un expediente.'}; render(); return; }
    const head = lines[0].split(';').map(h=>h.trim().toLowerCase()); const need = ['numero','afiliado','prestacion','juzgado','estado'];
    const miss = need.filter(n=>!head.includes(n)); if(miss.length){ ui.csvMsg={ok:false,t:'A la planilla le faltan estas columnas: '+miss.join(', ')}; render(); return; }
    let ok=0, dup=0;
    lines.slice(1).forEach(l=>{ const c = l.split(';'); const g = k => (c[head.indexOf(k)]||'').trim();
      if(!g('numero')) return; if(S.exps.some(x=>x.numero===g('numero'))){ dup++; return; }
      S.exps.push({id:S.nextId++, numero:g('numero'), caratula:`${g('afiliado')} c/ Salud Integral Demo S.A. s/ amparo de salud`, afiliado:g('afiliado'), nroAf:'—', prestacion:g('prestacion')||'Otra', juzgado:g('juzgado'), estado:ESTADOS.includes(g('estado'))?g('estado'):'Intimación recibida', riesgo:'medio', abogado:S.user, inicio:iso(today()), monto:0, cautelar:false, plazos:[], movimientos:[{fecha:iso(today()), tipo:'Interno', desc:'Expediente traído desde otro sistema.', user:S.user}], docs:[]}); ok++; });
    save(); if(ok) audit('Trajo expedientes','Migración',`${ok} expediente(s) desde planilla`);
    ui.csvMsg={ok:ok>0, t:`Listo: se trajeron ${ok} expediente(s).${dup?` ${dup} ya estaban cargados y no se repitieron.`:''}`}; await chain; render(); }
  if((a==='ureset'||a==='utoggle'||a==='uunlock') && isAdmin()){ const u = S.users.find(x=>x.id===d.u);
    if(a==='ureset'){ const p = tempPass(); u.salt = randId(16); u.hash = await hashPass(p, u.salt); u.mustChange = true; delete S.lock[u.id]; save(); audit('Dio una contraseña nueva','Usuarios',u.id);
      ui.userMsg={ok:true, html:`Contraseña provisoria para <b>${esc(u.nombre)}</b>: <span class="mono">${esc(p)}</span>. Pasásela en persona o por un canal seguro; no se vuelve a mostrar.`}; }
    if(a==='utoggle'){ u.activo = !u.activo; save(); audit(u.activo?'Activó un usuario':'Desactivó un usuario','Usuarios',u.id); ui.userMsg={ok:true,t:`${u.nombre} ${u.activo?'ya puede entrar':'ya no puede entrar'}.`}; }
    if(a==='uunlock'){ delete S.lock[u.id]; save(); audit('Desbloqueó un usuario','Usuarios',u.id); ui.userMsg={ok:true,t:`${u.nombre} ya puede volver a intentar.`}; }
    await chain; render(); }
});

document.addEventListener('keydown', ev => {
  if(ev.key==='Enter' && ev.target.matches('[data-go]')) location.hash = ev.target.dataset.go;
  if(ev.key==='Escape' && $('#overlay').classList.contains('show') && !$('#overlay').dataset.forced) closeModal();
  if(ev.target.id==='gsearch'){
    const links = [...document.querySelectorAll('.results a')];
    if(ev.key==='Enter' && links.length){ ev.preventDefault(); location.hash = links[0].getAttribute('href').slice(1); ui.q=''; }
    if(ev.key==='Escape'){ ui.q=''; ui.results=false; render(); }
  }
  if(ev.key==='Enter' && $('#overlay').classList.contains('show') && W && ev.target.matches('#modal input[type=text]')){ ev.preventDefault(); const b = $('[data-wnav="1"]') || $('[data-act=wcreate]'); if(b) b.click(); }
});
$('#overlay').addEventListener('click', ev => { if(ev.target.id==='overlay' && !$('#overlay').dataset.forced) closeModal(); });

document.addEventListener('change', async ev => {
  const t = ev.target; const r = route(); const e = r.name==='expediente' ? expById(r.id) : null;
  if(t.id==='fileIn' && e) addFiles(e, t.files);
  if(t.dataset && t.dataset.reassign && t.value){ const x = expById(t.dataset.reassign); if(!x || !canManage(x) || t.value===x.abogado) return; const old = x.abogado; x.abogado = t.value; save();
    audit('Reasignó un amparo', x.numero, `De ${userName(old)} a ${userName(t.value)}`); render();
    toast(`${x.afiliado} ahora está a cargo de ${userName(t.value)}.`, ()=>{ x.abogado = old; save(); audit('Deshizo reasignación', x.numero, `Vuelve a ${userName(old)}`); render(); }); }
  if(t.dataset && t.dataset.mod){ S.modules[t.dataset.mod] = t.checked; save(); const m = MODULES.find(x=>x.id===t.dataset.mod); audit(t.checked?'Activó un módulo':'Apagó un módulo', m.nombre, 'Configuración'); render(); toast(t.checked?`${m.nombre} activado: ya aparece en el menú`:`${m.nombre} apagado`); }
});
function addFiles(e, files){
  [...files].forEach(f=>{ e.docs.push({nombre:f.name, tipo:'Documento', fecha:iso(today()), size: f.size>1e6?(f.size/1e6).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(f.size/1000))+' KB'}); audit('Subió un documento', e.numero, f.name); });
  save(); render(); toast(files.length===1?'Documento agregado':`${files.length} documentos agregados`);
}
document.addEventListener('toggle', ev => { const d = ev.target; if(d.matches && d.matches('details[data-member]')) ui.open[d.dataset.member] = d.open; }, true);
document.addEventListener('dragover', ev => { const dz = ev.target.closest('#drop'); if(dz){ ev.preventDefault(); dz.classList.add('over'); } });
document.addEventListener('dragleave', ev => { const dz = ev.target.closest('#drop'); if(dz) dz.classList.remove('over'); });
document.addEventListener('drop', ev => { const dz = ev.target.closest('#drop'); if(dz){ ev.preventDefault(); const e = expById(route().id); if(e) addFiles(e, ev.dataTransfer.files); } });

document.addEventListener('input', ev => {
  const t = ev.target;
  if(t.id==='gsearch'){ ui.q = t.value; ui.results = true; const box = $('.search'); const old = box.querySelector('.results'); if(old) old.remove(); box.insertAdjacentHTML('beforeend', searchResults()); }
  if(t.id==='tplText'){ ui.tplText = t.value; const f = (t.value.match(/\[[^\]]+\]/g)||[]).length; const n = $('#faltan'); if(n){ n.className = 'notice '+(f?'':'good'); n.innerHTML = `${ic(f?'pen':'check')}<div>${f?`${f===1?'Te queda':'Te quedan'} <b>${f}</b> ${f===1?'parte':'partes'} para escribir vos: están entre [CORCHETES].`:'¡Listo! No quedan partes por completar.'}</div>`; } }
  if(t.id==='bkPass') ui.bkPass = t.value;
  if(t.id==='bkOut') ui.backupOut = t.value;
});
document.addEventListener('submit', async ev => {
  ev.preventDefault();
  const id = ev.target.id; const r = route(); const e = r.name==='expediente' ? expById(r.id) : null;
  if(id==='loginForm'){
    const org = $('#lgOrg').value.trim().toLowerCase(), uid = $('#lgUser').value.trim().toLowerCase(), pass = $('#lgPass').value;
    ui.lastOrg = org; S.lock = S.lock || {};
    const fail = t => { ui.loginMsg = {ok:false, t}; render(); setTimeout(()=>{ const f = $('#lgUser'); if(f){ f.value = uid; $('#lgPass').focus(); } }, 0); };
    if(org !== ORG) return fail('No encontramos esa organización. Revisá cómo está escrita.');
    const l = S.lock[uid];
    if(l && l.until > Date.now()) return fail(`Por seguridad, este usuario está bloqueado unos minutos. Probá de nuevo en ${Math.ceil((l.until-Date.now())/60000)} min o pedile al administrador que lo desbloquee.`);
    $('#lgBtn').disabled = true; $('#lgBtn').textContent = 'Ingresando…';
    const u = S.users.find(x=>x.id===uid);
    const ok = u && u.activo && (await hashPass(pass, u.salt)) === u.hash;
    if(!ok){
      const rec = S.lock[uid] = {fails:((l && l.until && l.until <= Date.now()) ? 0 : (l?l.fails:0)) + 1, until:0};
      if(rec.fails >= 5){ rec.until = Date.now() + 5*60000; rec.fails = 0; }
      save(); audit('Intento de ingreso fallido','Sistema', `Usuario "${uid}"`, {user: uid || 'desconocido'});
      return fail(rec.until ? 'Hubo demasiados intentos. Por seguridad, el usuario quedó bloqueado 5 minutos.' : `El usuario o la contraseña no son correctos. Te quedan ${5-rec.fails} ${5-rec.fails===1?'intento':'intentos'}.`);
    }
    delete S.lock[uid]; S.user = uid; setSession({user:uid, at:Date.now()}); lastActivity = Date.now(); ui.loginMsg = null;
    const firstTime = !(S.toured||{})[uid]; S.toured = S.toured || {}; S.toured[uid] = true; save();
    audit('Inició sesión','Sistema', u.nombre);
    location.hash = 'inicio'; render();
    if(u.mustChange) openPwd(true); else if(firstTime) openTour(0);
  }
  if(id==='pwdForm'){
    const u = me(), msg = t => { $('#pwMsg').innerHTML = `<div class="notice bad">${esc(t)}</div>`; };
    const o = $('#pwOld').value, n = $('#pwNew').value, r2 = $('#pwRep').value;
    if((await hashPass(o, u.salt)) !== u.hash) return msg('La contraseña actual no es correcta.');
    if(!passOk(n)) return msg('La nueva contraseña tiene que tener al menos 8 caracteres, con letras y números.');
    if(n !== r2) return msg('Las dos contraseñas nuevas no son iguales.');
    if(n === o) return msg('Elegí una contraseña distinta de la actual.');
    const wasForced = u.mustChange;
    u.salt = randId(16); u.hash = await hashPass(n, u.salt); u.mustChange = false; save();
    audit('Cambió su contraseña','Usuarios',u.id); closeModal(); toast('Contraseña actualizada');
    if(wasForced) openTour(0);
  }
  if(id==='movForm' && e){ const m = {fecha:$('#mvF').value, tipo:$('#mvT').value, desc:$('#mvD').value.trim(), user:S.user}; if(!m.desc) return; e.movimientos.push(m); save(); ui.addMov=false; audit('Cargó una novedad', e.numero, `${m.tipo}: ${m.desc}`); render(); toast('Novedad guardada'); }
  if(id==='plForm' && e){ const p = {desc:$('#plD').value.trim(), vence:$('#plV').value, hecho:false}; if(!p.desc||!p.vence) return; e.plazos.push(p); save(); ui.addPlazo=false; audit('Agregó un plazo', e.numero, `${p.desc} (${fmt(p.vence)})`); render(); toast('Plazo guardado'); }
  if(ev.target.classList.contains('teamform') && isAdmin()){
    const f = ev.target, tm = S.teams.find(x=>x.id===f.dataset.team);
    const jefe = f.jefe.value, miembros = [...f.querySelectorAll('input[name=m]:checked')].map(i=>i.value).filter(m=>m!==jefe);
    const taken = miembros.filter(m=>S.teams.some(o=>o.id!==tm.id && o.miembros.includes(m)));
    if(taken.length){ toast(`${taken.map(userName).join(', ')} ya está en otro equipo. Sacalo de ahí primero.`); return; }
    tm.nombre = f.nombre.value.trim() || tm.nombre; tm.jefe = jefe; tm.miembros = miembros; save();
    audit('Actualizó un equipo','Equipos',`${tm.nombre}: jefa/e ${userName(jefe)}, ${miembros.length} analista(s)`); await chain; render(); toast('Equipo guardado');
  }
  if(id==='userForm' && isAdmin()){
    const uid = $('#nuId').value.trim().toLowerCase();
    if(S.users.some(x=>x.id===uid)){ ui.userMsg={ok:false,t:'Ya hay alguien con ese usuario. Probá con otro.'}; render(); return; }
    const p = tempPass(); S.users.push(await makeUser({id:uid, nombre:$('#nuNom').value.trim(), rol:$('#nuRol').value}, p, true)); save();
    audit('Agregó un usuario','Usuarios', `${uid} (${$('#nuRol').value})`);
    ui.userMsg={ok:true, html:`Listo. <b>${esc(uid)}</b> ya puede entrar con la contraseña provisoria <span class="mono">${esc(p)}</span>. Pasásela en persona o por un canal seguro; no se vuelve a mostrar.`}; await chain; render();
  }
});

// ---------- arranque ----------
(async function init(){
  S = load();
  if(!S || !S.exps || !S.users){ S = await fresh(); save(); await seedAudit(); }
  S.lock = S.lock || {}; S.toured = S.toured || {}; S.teams = S.teams || [];
  render();
  const u = getSession() && me(); if(u && u.mustChange) openPwd(true);
})();
</script>
</body>
</html>
