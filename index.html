<html lang="es">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral fija (núcleo + módulos) y área de trabajo; tablas densas, estado codificado en chips y franjas */
:root{
  --bg:#F3F5F6; --surface:#FFFFFF; --sunken:#E9EDEF; --line:#D5DCE0;
  --ink:#1A2328; --muted:#5B6870; --faint:#8A969D;
  --accent:#1F5866; --accent-ink:#FFFFFF; --accent-soft:#DCEAED;
  --danger:#B3261E; --danger-soft:#F8E1DF; --warn:#8A5A00; --warn-soft:#F7ECD3; --ok:#2E6B3F; --ok-soft:#DFF0E3;
  --f-display:"IBM Plex Serif", Georgia, serif; --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12181B; --surface:#1A2226; --sunken:#151C1F; --line:#2B373D;
  --ink:#E4EAED; --muted:#9AA8AF; --faint:#6E7C83;
  --accent:#6FB3C2; --accent-ink:#0D1A1E; --accent-soft:#1E3A41;
  --danger:#F08A80; --danger-soft:#3A1E1C; --warn:#E5B85C; --warn-soft:#352A14; --ok:#7CC48E; --ok-soft:#1B3222; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12181B; --surface:#1A2226; --sunken:#151C1F; --line:#2B373D;
  --ink:#E4EAED; --muted:#9AA8AF; --faint:#6E7C83;
  --accent:#6FB3C2; --accent-ink:#0D1A1E; --accent-soft:#1E3A41;
  --danger:#F08A80; --danger-soft:#3A1E1C; --warn:#E5B85C; --warn-soft:#352A14; --ok:#7CC48E; --ok-soft:#1B3222; color-scheme:dark;
}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:24px} h2{font-size:18px} h3{font-size:15px;font-family:var(--f-body)}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:232px 1fr;height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:16px 12px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand .mark{width:30px;height:30px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:600}
.brand b{font-family:var(--f-display);font-size:18px}
.navlabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:12px 8px 4px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none}
.nav a:hover{background:var(--sunken)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a.off{color:var(--faint)}
.badge{font-size:11px;padding:1px 7px;border-radius:10px;background:var(--sunken);color:var(--muted)}
.nav a.on .badge{background:var(--surface)}
.side .foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);display:grid;gap:6px}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tenant{display:flex;flex-direction:column;line-height:1.2}
.tenant span{font-size:11px;color:var(--muted)}
.search{flex:1;min-width:180px;max-width:420px;margin-left:auto}
.search input{width:100%}
.view{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:20px}
.demo{font-size:12px;background:var(--warn-soft);color:var(--warn);padding:6px 24px;border-bottom:1px solid var(--line)}

input[type=text],input[type=password],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
textarea{width:100%;resize:vertical}
.btn{text-decoration:none;display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.gtpl{grid-template-columns:minmax(260px,1fr) 2fr}
@media (max-width:820px){.gtpl{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kpi b{font-size:28px;font-family:var(--f-display);font-variant-numeric:tabular-nums;line-height:1}
.kpi.alert{border-left:4px solid var(--danger)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--muted);background:var(--sunken)}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunken)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.chip.alto{background:var(--danger-soft);color:var(--danger)}
.chip.medio{background:var(--warn-soft);color:var(--warn)}
.chip.bajo{background:var(--ok-soft);color:var(--ok)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.due{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.due.late{color:var(--danger);font-weight:600}
.due.soon{color:var(--warn);font-weight:600}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.stripe{border-left:3px solid var(--line);padding-left:10px}
.stripe.late{border-color:var(--danger)} .stripe.soon{border-color:var(--warn)} .stripe.okk{border-color:var(--ok)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button.on{border-color:var(--accent);color:var(--ink);font-weight:600}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px}
.dl dt{color:var(--muted)} .dl dd{margin:0}
.ia{background:var(--sunken);border:1px dashed var(--accent);border-radius:var(--r);padding:12px;white-space:pre-wrap}
.hash{font-family:var(--f-mono);font-size:11px;color:var(--faint);word-break:break-all}
.bar{display:grid;grid-template-columns:180px 1fr 36px;gap:10px;align-items:center}
.bar .track{height:14px;background:var(--sunken);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent)}
.mod{position:relative}
.mod.active{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.notice{padding:10px 12px;border-radius:6px;background:var(--accent-soft);color:var(--ink)}
.notice.bad{background:var(--danger-soft);color:var(--danger)}
.notice.good{background:var(--ok-soft);color:var(--ok)}
.overlay{position:fixed;inset:0;background:rgba(10,15,18,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:10}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:10px;border:1px solid var(--line);width:min(620px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form .full{grid-column:1/-1}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}

/* Ingreso */
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.login .pitch{background:var(--accent);color:var(--accent-ink);padding:48px;display:flex;flex-direction:column;gap:20px;justify-content:center}
.login .pitch h1{font-size:34px;line-height:1.15;max-width:18ch}
.login .pitch ul{margin:0;padding-left:18px;display:grid;gap:6px;max-width:48ch}
.login .box{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--bg)}
.login .box .card{width:min(380px,100%)}
.login label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line);gap:2px}
  .side .navlabel,.side .foot,.brand b{display:none}
  .brand{padding:0 6px}
  .nav{display:flex;gap:2px}
  .nav a{white-space:nowrap}
  .view{padding:16px}
  .top{padding:10px 16px}
  .form{grid-template-columns:1fr}
  .login{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr}
  .bar{grid-template-columns:110px 1fr 30px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };

const dPlus = n => { const d = today(); d.setDate(d.getDate()+n); return iso(d); };

// ---------- auditoría encadenada (SHA-256) ----------
async function sha(text){
  if(window.crypto && crypto.subtle){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  let h = 0; for(const c of text){ h = (h*31 + c.charCodeAt(0))|0; } return 'nocrypto'+(h>>>0).toString(16);
}
const entryBody = e => JSON.stringify([e.n, e.ts, e.user, e.accion, e.objeto, e.detalle, e.prev]);
let chain = Promise.resolve();
function audit(accion, objeto, detalle, opts={}){
  chain = chain.then(async () => {
    const prev = S.audit.length ? S.audit[S.audit.length-1].hash : 'GENESIS';
    const e = {n:S.audit.length+1, ts:opts.ts || new Date().toISOString(), user:opts.user || S.user, accion, objeto, detalle, prev};
    e.hash = await sha(entryBody(e));
    S.audit.push(e); save();
    if(route().name==='auditoria' || route().name==='inicio') render();
  });
  return chain;
}
async function verifyChain(){
  let prev = 'GENESIS';
  for(const e of S.audit){
    if(e.prev !== prev) return {ok:false, n:e.n};
    const h = await sha(entryBody(e));
    if(h !== e.hash) return {ok:false, n:e.n};
    prev = e.hash;
  }
  return {ok:true};
}
async function seedAudit(){
  const base = Date.now() - 3*86400000;
  const items = [
    ['admin','Activó módulo','Amparos de salud','Plan inicial del cliente'],
    ['lbrunelli','Importó expedientes','Migración','7 expedientes desde planilla CSV'],
    ['rperez','Cargó movimiento','CCF 5021/2026','Notificación: intimación 48 hs'],
    ['jgomez','Subió documento','CCF 4512/2026','Dictamen auditoría médica.pdf'],
    ['lbrunelli','Consultó expediente','CCF 3977/2026','Vista de detalle']
  ];
  for(let i=0;i<items.length;i++){ const [u,a,o,d] = items[i]; await audit(a,o,d,{user:u, ts:new Date(base + i*5400000).toISOString()}); }
}

// ---------- contraseñas y sesión ----------
function randId(n){ const a = new Uint8Array(n); (window.crypto||{}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_,i)=>a[i]=Math.random()*256|0); return [...a].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function tempPass(){ const c = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'; let s=''; const a = new Uint8Array(10); crypto.getRandomValues(a); a.forEach(x=>s+=c[x%c.length]); return s+'7'; }
async function hashPass(pass, salt){
  if(!(window.crypto && crypto.subtle)) return sha(salt+':'+pass);
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:new TextEncoder().encode(salt), iterations:150000, hash:'SHA-256'}, k, 256);
  return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

// ---------- cifrado de respaldo (AES-GCM + PBKDF2) ----------
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function deriveKey(pass, salt){
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'}, k, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encrypt(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return 'FOJAS1.' + b64(salt) + '.' + b64(iv) + '.' + b64(ct);
}
async function decrypt(text, pass){
  const [tag, s, i, c] = text.trim().split('.');
  if(tag !== 'FOJAS1') throw new Error('formato');
  const key = await deriveKey(pass, unb64(s));
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(i)}, key, unb64(c));
  return JSON.parse(new TextDecoder().decode(pt));
}

function iaText(kind, e){
  const movs = [...e.movimientos].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const p = nextPlazo(e);
  if(kind==='resumen') return `RESUMEN · ${e.numero}\n\n${e.afiliado} (afiliado ${e.nroAf}) promovió acción de amparo reclamando ${e.prestacion.toLowerCase()} ante el ${e.juzgado}. Inicio: ${fmt(e.inicio)}.\n\nEstado actual: ${e.estado}.${e.cautelar?' Hay medida cautelar otorgada y vigente.':' No hay medida cautelar dictada.'}\n\nMovimientos relevantes:\n${movs.map(m=>`• ${fmt(m.fecha)} — ${m.desc}`).join('\n')}\n\nDocumentos en el expediente: ${e.docs.length ? e.docs.map(d=>d.nombre).join(', ') : 'ninguno cargado'}.\n${p?`\nPróximo vencimiento: ${p.desc} (${fmt(p.vence)}, ${dueText(daysTo(p.vence))}).`:''}`;
  if(kind==='paso'){
    const n = p?daysTo(p.vence):null;
    let s = `PRÓXIMO PASO SUGERIDO · ${e.numero}\n\n`;
    if(p && n<0) s += `1. Urgente: el plazo "${p.desc}" está vencido desde el ${fmt(p.vence)}. Verificar si se cumplió y, si no, presentar de inmediato y evaluar el riesgo de astreintes.\n`;
    else if(p) s += `1. Preparar "${p.desc}" antes del ${fmt(p.vence)} (${dueText(n)}).\n`;
    if(e.cautelar) s += `2. Confirmar con Auditoría Médica la entrega efectiva de la prestación y acreditar el cumplimiento en autos (plantilla "Acredita cumplimiento de medida cautelar").\n`;
    if(e.estado==='Informe art. 8 pendiente') s += `2. Pedir al área técnica el legajo completo del afiliado y usar la plantilla "Presenta informe art. 8 Ley 16.986".\n`;
    if(e.estado==='Sentencia') s += `2. Analizar la sentencia y decidir sobre la apelación dentro del plazo.\n`;
    s += `3. Registrar el resultado como movimiento para mantener la huella del expediente completa.`;
    return s;
  }
  const pts = (e.riesgo==='alto'?3:e.riesgo==='medio'?2:1) + (e.cautelar?1:0) + (p && daysTo(p.vence)<0 ? 2 : 0);
  return `EVALUACIÓN DE RIESGO · ${e.numero}\n\nRiesgo asignado: ${e.riesgo.toUpperCase()}\nIndicadores:\n• Prestación: ${e.prestacion}${/oncol|Discapacidad|domiciliaria/.test(e.prestacion)?' (tiende a resolverse a favor del afiliado en jurisprudencia de la materia)':''}\n• Medida cautelar: ${e.cautelar?'sí, con riesgo de sanciones si no se cumple':'no'}\n• Plazos vencidos: ${e.plazos.filter(x=>!x.hecho && daysTo(x.vence)<0).length}\n• Monto estimado: ${money(e.monto)}\n\nPuntaje orientativo: ${pts}/6. ${pts>=4?'Se recomienda revisión del abogado a cargo hoy.':'Seguimiento habitual.'}`;
}

function bars(title, rows){

}

document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-act],[data-tab],[data-go],[data-ia],[data-tplfor],#reset');
  if(!t) return;
  const r = route(); const e = r.name==='expediente' ? expById(r.id) : null;
  if(t.id==='reset'){ ev.preventDefault(); setSession(null); S = await fresh(); ui.verify=null; save(); await seedAudit(); ui.loginMsg={ok:true,t:'Datos de ejemplo restablecidos. Volvé a ingresar.'}; location.hash='inicio'; render(); return; }
  if(t.dataset.tplfor){ ui.tplExp = +t.dataset.tplfor; ui.tplText=''; return; }
  if(t.dataset.go){ location.hash = t.dataset.go; return; }
  if(t.dataset.tab){ ui.tab = t.dataset.tab; render(); return; }
  if(t.dataset.ia && e){ ui.ia = iaText(t.dataset.ia, e); audit('Usó asistente IA', e.numero, {resumen:'Resumen del expediente', paso:'Sugerencia de próximo paso', riesgo:'Evaluación de riesgo'}[t.dataset.ia]); render(); return; }
  const a = t.dataset.act;
  if(a==='nuevo') openNuevo();
  if(a==='close') closeModal();
  if(a==='logout') logout();
  if(a==='pwd') openPwd(false);
  if((a==='ureset'||a==='utoggle'||a==='uunlock') && isAdmin()){ const u = S.users.find(x=>x.id===t.dataset.u);
    if(a==='ureset'){ const p = tempPass(); u.salt = randId(16); u.hash = await hashPass(p, u.salt); u.mustChange = true; delete S.lock[u.id]; save(); audit('Restableció contraseña','Usuarios',u.id);
      ui.userMsg={ok:true, html:`Contraseña provisoria de <b>${esc(u.id)}</b>: <span class="mono">${esc(p)}</span>. Pasásela por un canal seguro: no se vuelve a mostrar.`}; }
    if(a==='utoggle'){ u.activo = !u.activo; save(); audit(u.activo?'Activó usuario':'Desactivó usuario','Usuarios',u.id); ui.userMsg={ok:true,t:`${u.nombre}: ${u.activo?'activado':'desactivado'}.`}; }
    if(a==='uunlock'){ delete S.lock[u.id]; save(); audit('Desbloqueó usuario','Usuarios',u.id); ui.userMsg={ok:true,t:`${u.nombre}: desbloqueado.`}; }
    render(); }
  if(a==='clearf'){ ui.q=ui.fEstado=ui.fRiesgo=ui.fAbog=''; render(); }
  if(a==='copyia') copy(ui.ia);
  if(a==='cumplir' && e){ const p = e.plazos[+t.dataset.i]; p.hecho = true; save(); audit('Marcó plazo cumplido', e.numero, p.desc); render(); toast('Plazo marcado como cumplido'); }
  if(a==='tplreset'){ ui.tplText=''; render(); }
  if(a==='tplcopy') copy($('#tplText').value);
  if(a==='tplsave'){ const x = expById(ui.tplExp) || S.exps[0]; const tpl = TEMPLATES.find(q=>q.id===ui.tpl);
    x.docs.push({nombre:`${tpl.nombre}.docx`, tipo:'Escrito propio', fecha:iso(today()), size:`${Math.max(1,Math.round($('#tplText').value.length/1000))} KB`});
    x.movimientos.push({fecha:iso(today()), tipo:'Escrito propio', desc:`Se genera borrador: ${tpl.nombre}.`, user:S.user}); save();
    audit('Generó escrito', x.numero, tpl.nombre); toast('Escrito guardado en Documentos del expediente'); }
  if(a==='csv'){ const rows = [['numero','afiliado','prestacion','juzgado','estado','riesgo','responsable','proximo_plazo','vence']].concat(S.exps.map(x=>{const p=nextPlazo(x);return [x.numero,x.afiliado,x.prestacion,x.juzgado,x.estado,x.riesgo,userName(x.abogado),p?p.desc:'',p?p.vence:''];}));
    copy(rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n')); audit('Exportó informe', 'Informes', 'Planilla CSV de amparos'); }
  if(a==='verify'){ await chain; ui.verify = await verifyChain(); render(); }
  if(a==='tamper'){ await chain; if(S.audit.length>2){ const i = Math.floor(S.audit.length/2); S.audit[i].detalle += ' (editado a mano)'; save(); ui.verify = await verifyChain(); render(); toast('Se modificó un registro sin pasar por la app'); } }
  if(a==='backup'){ const pass = $('#bkPass').value; if(pass.length<8){ ui.backupMsg={ok:false,t:'La contraseña tiene que tener al menos 8 caracteres.'}; render(); return; }
    try{ ui.backupOut = await encrypt({exps:S.exps, modules:S.modules, audit:S.audit, nextId:S.nextId}, pass); ui.backupMsg={ok:true,t:`Copia cifrada generada (${S.exps.length} expedientes, ${S.audit.length} registros de auditoría).`}; audit('Generó copia de seguridad','Respaldo','Copia cifrada AES-256'); }
    catch(x){ ui.backupMsg={ok:false,t:'Este navegador no permite cifrar acá. Probá abriendo la página directamente.'}; } render(); }
  if(a==='restore'){ const pass = $('#bkPass').value, txt = $('#bkOut').value;
    try{ const d = await decrypt(txt, pass); Object.assign(S, {exps:d.exps, modules:d.modules, audit:d.audit, nextId:d.nextId}); ui.backupOut = txt; ui.backupMsg={ok:true,t:`Copia restaurada: ${d.exps.length} expedientes.`}; save(); audit('Restauró copia de seguridad','Respaldo','Desde copia cifrada'); }
    catch(x){ ui.backupMsg={ok:false,t:'No se pudo restaurar: revisá que el texto esté completo y que la contraseña sea la misma.'}; } render(); }
  if(a==='copybk') copy($('#bkOut').value);
  if(a==='csvsample'){ $('#csvIn').value = SAMPLE_CSV; }
  if(a==='csvimport'){ const lines = $('#csvIn').value.trim().split(/\r?\n/).filter(Boolean);
    if(lines.length<2){ ui.csvMsg={ok:false,t:'Pegá la planilla con la fila de títulos y al menos un expediente.'}; render(); return; }
    const head = lines[0].split(';').map(h=>h.trim().toLowerCase()); const need = ['numero','afiliado','prestacion','juzgado','estado'];
    const miss = need.filter(n=>!head.includes(n)); if(miss.length){ ui.csvMsg={ok:false,t:'Faltan columnas: '+miss.join(', ')}; render(); return; }
    let ok=0, dup=0;
    lines.slice(1).forEach(l=>{ const c = l.split(';'); const g = k => (c[head.indexOf(k)]||'').trim();
      if(!g('numero')) return; if(S.exps.some(x=>x.numero===g('numero'))){ dup++; return; }
      S.exps.push({id:S.nextId++, numero:g('numero'), caratula:`${g('afiliado')} c/ Salud Integral Demo S.A. s/ amparo de salud`, afiliado:g('afiliado'), nroAf:'—', prestacion:g('prestacion')||'Otra', juzgado:g('juzgado'), estado:ESTADOS.includes(g('estado'))?g('estado'):'Intimación recibida', riesgo:'medio', abogado:S.user, inicio:iso(today()), monto:0, cautelar:false, plazos:[], movimientos:[{fecha:iso(today()), tipo:'Interno', desc:'Expediente migrado desde otro sistema.', user:S.user}], docs:[]}); ok++; });
    save(); if(ok) audit('Importó expedientes','Migración',`${ok} expediente(s) desde planilla CSV`);
    ui.csvMsg={ok:ok>0, t:`Importados: ${ok}.${dup?` Omitidos por estar repetidos: ${dup}.`:''}`}; render(); }
});

document.addEventListener('keydown', ev => {
  if(ev.key==='Enter' && ev.target.matches('tr[data-go]')) location.hash = ev.target.dataset.go;
  if(ev.key==='Escape' && !$('#overlay').dataset.forced) closeModal();
});
$('#overlay').addEventListener('click', ev => { if(ev.target.id==='overlay' && !$('#overlay').dataset.forced) closeModal(); });

document.addEventListener('change', ev => {
  const t = ev.target; const r = route(); const e = r.name==='expediente' ? expById(r.id) : null;
  if(t.id==='fEstado'){ ui.fEstado=t.value; render(); } if(t.id==='fRiesgo'){ ui.fRiesgo=t.value; render(); } if(t.id==='fAbog'){ ui.fAbog=t.value; render(); }
  if(t.id==='estSel' && e){ const old = e.estado; e.estado = t.value; save(); audit('Cambió estado', e.numero, `${old} → ${t.value}`); render(); }
  if(t.id==='riSel' && e){ const old = e.riesgo; e.riesgo = t.value; save(); audit('Cambió riesgo', e.numero, `${old} → ${t.value}`); render(); }
  if(t.id==='fileIn' && e){ const tipo = $('#docTipo').value; [...t.files].forEach(f=>{ e.docs.push({nombre:f.name, tipo, fecha:iso(today()), size: f.size>1e6?(f.size/1e6).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(f.size/1000))+' KB'}); audit('Subió documento', e.numero, f.name); }); save(); render(); }
  if(t.name==='tpl'){ ui.tpl = t.value; ui.tplText=''; render(); }
  if(t.id==='tplExp'){ ui.tplExp = +t.value; ui.tplText=''; render(); }
  if(t.dataset && t.dataset.mod){ S.modules[t.dataset.mod] = t.checked; save(); const m = MODULES.find(x=>x.id===t.dataset.mod); audit(t.checked?'Activó módulo':'Desactivó módulo', m.nombre, 'Configuración del cliente'); render(); toast(t.checked?`${m.nombre} activado`:`${m.nombre} desactivado`); }
});
document.addEventListener('input', ev => {
  if(ev.target.id==='gsearch'){ ui.q = ev.target.value; if(route().name!=='amparos'){ location.hash='amparos'; } else { const pos = ev.target.selectionStart; render(); const s = $('#gsearch'); s.focus(); s.setSelectionRange(pos,pos); } }
  if(ev.target.id==='tplText') ui.tplText = ev.target.value;
  if(ev.target.id==='bkPass') ui.bkPass = ev.target.value;
  if(ev.target.id==='bkOut') ui.backupOut = ev.target.value;
});
document.addEventListener('submit', async ev => {
  ev.preventDefault();
  const id = ev.target.id; const r = route(); const e = r.name==='expediente' ? expById(r.id) : null;
  if(id==='loginForm'){
    const org = $('#lgOrg').value.trim().toLowerCase(), uid = $('#lgUser').value.trim().toLowerCase(), pass = $('#lgPass').value;
    ui.lastOrg = org; S.lock = S.lock || {};
    const fail = t => { ui.loginMsg = {ok:false, t}; render(); setTimeout(()=>{ const f = $('#lgUser'); if(f){ f.value = uid; $('#lgPass').focus(); } }, 0); };
    if(org !== ORG) return fail('No existe esa organización. Revisá cómo está escrita.');
    const l = S.lock[uid];
    if(l && l.until > Date.now()) return fail(`Usuario bloqueado por intentos fallidos. Probá de nuevo en ${Math.ceil((l.until-Date.now())/60000)} min o pedile al administrador que lo desbloquee.`);
    $('#lgBtn').disabled = true;
    const u = S.users.find(x=>x.id===uid);
    const ok = u && u.activo && (await hashPass(pass, u.salt)) === u.hash;
    if(!ok){
      const rec = S.lock[uid] = {fails:((l && l.until && l.until <= Date.now()) ? 0 : (l?l.fails:0)) + 1, until:0};
      if(rec.fails >= 5){ rec.until = Date.now() + 5*60000; rec.fails = 0; }
      save(); audit('Intento de ingreso fallido','Sistema', `Usuario "${uid}"`, {user: uid || 'desconocido'});
      return fail(rec.until ? 'Demasiados intentos. El usuario quedó bloqueado 5 minutos.' : `Usuario o contraseña incorrectos. Te quedan ${5-rec.fails} intento(s).`);
    }
    delete S.lock[uid]; S.user = uid; setSession({user:uid, at:Date.now()}); lastActivity = Date.now(); ui.loginMsg = null; save();
    audit('Inició sesión','Sistema', u.nombre);
    if(!location.hash) location.hash = 'inicio';
    render(); if(u.mustChange) openPwd(true);
  }
  if(id==='pwdForm'){
    const u = me(), msg = t => { $('#pwMsg').innerHTML = `<div class="notice bad">${esc(t)}</div>`; };
    const o = $('#pwOld').value, n = $('#pwNew').value, r2 = $('#pwRep').value;
    if((await hashPass(o, u.salt)) !== u.hash) return msg('La contraseña actual no es correcta.');
    if(!passOk(n)) return msg('La nueva contraseña tiene que tener al menos 8 caracteres, con letras y números.');
    if(n !== r2) return msg('Las contraseñas nuevas no coinciden.');
    if(n === o) return msg('La nueva contraseña tiene que ser distinta de la actual.');
    u.salt = randId(16); u.hash = await hashPass(n, u.salt); u.mustChange = false; save();
    audit('Cambió su contraseña','Usuarios',u.id); closeModal(); toast('Contraseña actualizada');
  }
  if(id==='userForm' && isAdmin()){
    const uid = $('#nuId').value.trim().toLowerCase();
    if(S.users.some(x=>x.id===uid)){ ui.userMsg={ok:false,t:'Ya existe un usuario con ese nombre.'}; render(); return; }
    const p = tempPass(); S.users.push(await makeUser({id:uid, nombre:$('#nuNom').value.trim(), rol:$('#nuRol').value}, p, true)); save();
    audit('Creó usuario','Usuarios', `${uid} (${$('#nuRol').value})`);
    ui.userMsg={ok:true, html:`Usuario <b>${esc(uid)}</b> creado. Contraseña provisoria: <span class="mono">${esc(p)}</span>. Pasásela por un canal seguro: no se vuelve a mostrar.`}; render();
  }
  if(id==='movForm' && e){ const m = {fecha:$('#mvF').value, tipo:$('#mvT').value, desc:$('#mvD').value.trim(), user:S.user}; if(!m.desc) return; e.movimientos.push(m); save(); audit('Cargó movimiento', e.numero, `${m.tipo}: ${m.desc}`); render(); toast('Movimiento agregado'); }
  if(id==='plForm' && e){ const p = {desc:$('#plD').value.trim(), vence:$('#plV').value, hecho:false}; if(!p.desc||!p.vence) return; e.plazos.push(p); save(); audit('Agregó plazo', e.numero, `${p.desc} (${fmt(p.vence)})`); render(); toast('Plazo agregado'); }
  if(id==='newForm'){
    const num = $('#nNum').value.trim(); if(S.exps.some(x=>x.numero===num)){ toast('Ya existe un expediente con ese número'); return; }
    const x = {id:S.nextId++, numero:num, afiliado:$('#nAf').value.trim(), nroAf:$('#nNro').value.trim()||'—', prestacion:$('#nPr').value, juzgado:$('#nJz').value.trim(), estado:$('#nEs').value, riesgo:$('#nRi').value, abogado:$('#nAb').value, inicio:iso(today()), monto:+($('#nMo').value.replace(/\D/g,''))||0, cautelar:$('#nCa').checked, plazos:[], movimientos:[{fecha:iso(today()), tipo:'Interno', desc:'Alta del expediente.', user:S.user}], docs:[]};
    x.caratula = `${x.afiliado} c/ Salud Integral Demo S.A. s/ amparo de salud`;
    if($('#nPd').value.trim()) x.plazos.push({desc:$('#nPd').value.trim(), vence:$('#nPv').value, hecho:false});
    S.exps.push(x); save(); closeModal(); audit('Creó expediente', x.numero, x.prestacion); location.hash = 'expediente-'+x.id; toast('Expediente creado');
  }
});

// ---------- arranque ----------
(async function init(){
  S = load();
  if(!S || !S.exps || !S.users){ S = await fresh(); save(); await seedAudit(); }
  S.lock = S.lock || {};
  render();
  const u = getSession() && me(); if(u && u.mustChange) openPwd(true);
})();
</script>
</body>
