<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fojas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: menú lateral con íconos grandes + área de trabajo con tarjetas amplias; lo urgente siempre arriba y en color */
:root{
  /* Paleta: fondo blanco, verdes (bosque, oliva, salvia) y marrones (nogal, tierra, arena) */
  --bg:#FFFFFF; --surface:#FFFFFF; --sunken:#F7F4EF; --line:#E6DED3;
  --ink:#2E2520; --muted:#6F6157; --faint:#A39586;
  --accent:#2F6B3F; --accent-ink:#FFFFFF; --accent-soft:#E5F0E3;
  --danger:#B23A2B; --danger-soft:#FBE7E2; --warn:#9A6A1E; --warn-soft:#FAF0DC; --ok:#5E8A3A; --ok-soft:#EEF4E4;
  --violet:#8B5E3C; --violet-soft:#F4EADF;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px; --shadow:0 1px 2px rgba(60,40,20,.05), 0 4px 14px rgba(60,40,20,.06); color-scheme:light;
}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800} h2{font-size:20px;font-weight:700} h3{font-size:17px;font-weight:700}
a{color:var(--accent)}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.92em}
.muted{color:var(--muted)} .small{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:18px;height:18px}
svg.i.lg{width:30px;height:30px}

.app{display:grid;grid-template-columns:250px 1fr;height:100%}
.side{background:#FBF9F5;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:18px 14px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--violet);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:19px}
.brand b{font-size:21px;font-weight:800}
.navlabel{font-size:13px;font-weight:600;color:var(--faint);padding:16px 12px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;border:0;background:none;cursor:pointer;text-align:left;width:100%}
.nav a:hover,.nav button:hover{background:var(--sunken)}
.nav a.on{background:var(--accent);color:var(--accent-ink)}
.nav .badge{margin-left:auto}
.badge{font-size:13px;font-weight:700;min-width:24px;text-align:center;padding:1px 8px;border-radius:12px;background:var(--sunken);color:var(--muted)}
.badge.red{background:var(--danger);color:#fff}
.nav a.on .badge{background:rgba(255,255,255,.25);color:inherit}
.side .foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;margin-left:auto}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--violet-soft);color:var(--violet);display:grid;place-items:center;font-weight:800}
.who div{line-height:1.2} .who span{font-size:13px;color:var(--muted)}
.search{position:relative;flex:1;min-width:220px;max-width:520px}
.search input[type=search]{width:100%;padding:11px 14px 11px 44px;border-radius:12px;border:1px solid var(--line);background:var(--sunken)}
.search > svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:5;overflow:hidden}
.results a{display:block;padding:10px 14px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.results a:last-child{border-bottom:0}
.results a:hover,.results a.sel{background:var(--accent-soft)}
.view{flex:1;overflow:auto;padding:28px;display:flex;flex-direction:column;gap:24px}
.demo{font-size:13px;background:var(--violet-soft);color:var(--violet);padding:6px 28px}

input[type=text],input[type=password],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.ok:hover{filter:brightness(1.08);color:#fff}
.btn.big{padding:14px 22px;font-size:17px;border-radius:12px}
.btn.sm{padding:6px 11px;font-size:14px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.sub{color:var(--muted);font-size:15px}

/* accesos grandes del inicio */
.action{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:20px;cursor:pointer;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .12s, border-color .12s}
.action:hover{border-color:var(--accent);transform:translateY(-2px)}
.action b{font-size:18px}
.action span{color:var(--muted);font-size:14px}
.ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center}
.ico.a{background:var(--accent-soft);color:var(--accent)} .ico.r{background:var(--danger-soft);color:var(--danger)} .ico.v{background:var(--violet-soft);color:var(--violet)} .ico.g{background:var(--ok-soft);color:var(--ok)} .ico.y{background:var(--warn-soft);color:var(--warn)}

/* tareas */
.task{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--sunken);border-left:5px solid var(--line)}
.task.late{border-color:var(--danger);background:var(--danger-soft)}
.task.soon{border-color:var(--warn)}
.task.okk{border-color:var(--ok)}
.task .txt{flex:1;min-width:0}
.task .txt a{color:var(--ink);text-decoration:none;font-weight:700}
.task .txt a:hover{text-decoration:underline}
.when{font-weight:700;font-size:14px;white-space:nowrap}
.when.late{color:var(--danger)} .when.soon{color:var(--warn)} .when.okk{color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap;background:var(--sunken);color:var(--muted);border:1px solid var(--line)}
.pill.red{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.pill.yel{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.grn{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.empty{text-align:center;padding:26px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ico{margin-bottom:4px}

/* filtros tipo chip */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:22px;padding:8px 16px;cursor:pointer;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.chipbtn:hover{border-color:var(--accent)}
.chipbtn.on{background:var(--violet);border-color:var(--violet);color:#fff}
.chipbtn .badge{background:rgba(127,127,127,.18);color:inherit}

/* lista de amparos como tarjetas */
.cases{display:flex;flex-direction:column;gap:10px}
.case{display:grid;grid-template-columns:6px 1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px 14px 0;cursor:pointer;box-shadow:var(--shadow)}
.case:hover{border-color:var(--accent)}
.case .bar{align-self:stretch;border-radius:0 4px 4px 0;background:var(--line)}
.case .bar.late{background:var(--danger)} .case .bar.soon{background:var(--warn)} .case .bar.okk{background:var(--ok)}
.case .name{font-weight:700;font-size:17px}
.case .meta{color:var(--muted);font-size:14px;display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:2px}
.case .right{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}

/* expediente */
.next{background:linear-gradient(0deg,var(--surface),var(--surface));border:2px solid var(--accent);border-radius:var(--r);padding:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.next.late{border-color:var(--danger);background:var(--danger-soft)}
.next .txt{flex:1;min-width:240px}
.next .lbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.next h2{font-size:22px;margin:4px 0}
.steps{display:flex;gap:0;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:110px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:0;padding:4px;position:relative;color:var(--muted);font-size:13px;font-weight:600;text-align:center}
.step::before{content:"";position:absolute;top:17px;left:-50%;right:50%;height:3px;background:var(--line);z-index:0}
.step:first-child::before{display:none}
.step .dot{width:34px;height:34px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;z-index:1;font-weight:800;color:var(--faint)}
.step.done{color:var(--ink)} .step.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .step.done::before{background:var(--accent)}
.step.cur{color:var(--accent)} .step.cur .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)} .step.cur::before{background:var(--accent)}
.step:hover .dot{border-color:var(--accent)}
.step.caut-no{color:var(--danger)} .step.caut-no .dot{background:var(--danger);border-color:var(--danger);color:#fff;box-shadow:none}
.step.caut-si{color:var(--ok)} .step.caut-si .dot{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:none}
.step.cur.caut-si .dot,.step.cur.caut-no .dot{box-shadow:0 0 0 5px var(--sunken)}
.legend{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{border:0;background:none;padding:9px 14px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;display:inline-flex;gap:8px;align-items:center}
.tabs button:hover{background:var(--sunken);color:var(--ink)}
.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fact{background:var(--sunken);border-radius:12px;padding:12px 14px}
.fact span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.fact b{font-weight:600}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.doc{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.ia{background:var(--violet-soft);border-radius:14px;padding:18px;white-space:pre-wrap;line-height:1.6}
.notice{padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.notice.bad{background:var(--danger-soft);color:var(--danger)}
.notice.good{background:var(--ok-soft);color:var(--ok)}
.hash{font-family:var(--f-mono);font-size:12px;color:var(--faint);word-break:break-all}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:200px 1fr 40px;gap:12px;align-items:center}
.barrow .track{height:18px;background:var(--sunken);border-radius:6px;overflow:hidden}
.barrow .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--ok));border-radius:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;font-weight:700;color:var(--muted);background:var(--sunken)}
tr:last-child td{border-bottom:0}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
.mod.active{border-color:var(--accent);box-shadow:inset 0 4px 0 var(--accent), var(--shadow)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form label,.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
.form .full{grid-column:1/-1}
.hint{font-weight:400;font-size:13px;color:var(--faint)}
.fld > .pill{align-self:flex-start}
.savebadge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 12px;border-radius:20px;text-decoration:none;white-space:nowrap}
.savebadge.ok{background:var(--ok-soft);color:var(--ok)} .savebadge.warn{background:var(--warn-soft);color:var(--warn)} .savebadge.bad{background:var(--danger-soft);color:var(--danger)}
.sgroup{display:flex;flex-direction:column;gap:10px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-align:left;word-break:break-all}
.linkbtn:hover{text-decoration:underline;color:var(--accent)}
details.sug{padding:0;gap:0}
details.sug summary{list-style:none;display:flex;gap:10px;align-items:center;padding:14px 16px;cursor:pointer;flex-wrap:wrap}
details.sug summary::-webkit-details-marker{display:none}
details.sug summary:hover{background:var(--sunken)}
details.sug .stitle{flex:1;min-width:200px;font-weight:700;font-size:16px}
details.sug .chev{color:var(--muted);transition:transform .15s}
details.sug[open] .chev{transform:rotate(90deg)}
details.sug .sbody{padding:4px 18px 18px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
details.sug .slbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:10px 0 4px}
details.sug ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.5}
.splazo{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.sug{border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.sug.alta{border-left-color:var(--danger)} .sug.media{border-left-color:var(--warn)} .sug.baja{border-left-color:var(--ok)}
.sug p{color:var(--ink);line-height:1.55}
.pill.law{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.docrow{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.docrow select{max-width:260px}

/* modal y asistente de carga */
.overlay{position:fixed;inset:0;background:rgba(8,20,24,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:10}
.overlay.show{display:flex}
.modal.wide{width:min(1000px,100%)}
.viewer{display:flex;flex-direction:column;gap:10px;max-height:72vh;overflow:auto;background:var(--sunken);border-radius:12px;padding:14px}
.vpage{width:100%;height:auto;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);border-radius:4px}
.vtext{white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;line-height:1.55;margin:0;background:var(--surface);padding:16px;border-radius:8px}
.docview{background:#fff;color:#222;padding:28px;border-radius:6px;line-height:1.6}
.modal{background:var(--surface);border-radius:18px;width:min(640px,100%);padding:26px;display:flex;flex-direction:column;gap:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.wsteps{display:flex;gap:8px}
.wsteps span{flex:1;height:6px;border-radius:4px;background:var(--line)}
.wsteps span.on{background:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font-weight:600}
.opt:hover{border-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.tour{text-align:center;align-items:center}
.tour .ico{width:72px;height:72px;border-radius:20px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)} .dots i.on{background:var(--accent);width:22px;border-radius:4px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;z-index:20;display:flex;gap:14px;align-items:center;font-weight:600}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--accent-soft);font-weight:800;cursor:pointer;text-decoration:underline}

/* ingreso */
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.login .pitch{background:linear-gradient(160deg,#2F6B3F 0%,#24502F 60%,#5A3E2B 100%);color:var(--accent-ink);padding:56px;display:flex;flex-direction:column;gap:22px;justify-content:center}
.login .pitch h1{font-size:38px;line-height:1.15;max-width:16ch}
.login .pitch .feat{display:flex;gap:12px;align-items:center;font-size:17px}
.login .pitch .feat svg{opacity:.9}
.login .box{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--bg)}
.login .box .card{width:min(420px,100%);padding:30px}

/* esquema del equipo */
.org{display:flex;flex-direction:column;align-items:center;padding:8px 0}
.orgcard{display:flex;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;min-width:250px;box-shadow:var(--shadow);font:inherit;color:inherit}
.orgcard:hover{border-color:var(--accent)}
.orgcard.boss{border-color:var(--accent);background:var(--accent-soft)}
.kids{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;position:relative;padding-top:44px;margin-top:0}
.kids::before{content:"";position:absolute;top:0;left:50%;width:2px;height:22px;background:var(--violet)}
.kid{position:relative;display:flex}
.kid::before{content:"";position:absolute;top:-22px;left:50%;width:2px;height:22px;background:var(--violet)}
.kid::after{content:"";position:absolute;top:-22px;height:2px;background:var(--violet);left:-14px;right:-14px}
.kid:first-child::after{left:50%} .kid:last-child::after{right:50%} .kid:only-child::after{display:none}
.members{display:flex;flex-direction:column;gap:12px}
.member{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.member[open]{border-color:var(--accent)}
.member summary{list-style:none;display:flex;gap:14px;align-items:center;padding:16px 18px;cursor:pointer;flex-wrap:wrap}
.member summary::-webkit-details-marker{display:none}
.member summary:hover{background:var(--sunken)}
.member .chev{transition:transform .15s;color:var(--muted)}
.member[open] .chev{transform:rotate(90deg)}
.panel{background:var(--sunken);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{display:flex;gap:8px;align-items:center;font-size:15px}
.mini{background:var(--surface);border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.mini a{color:var(--ink);text-decoration:none} .mini a:hover{text-decoration:underline}

@media (max-width:860px){
  .kids{flex-direction:column;align-items:center;gap:14px} .kid::after{display:none}
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
  .side .navlabel,.brand b,.nav a span.lbl,.nav button span.lbl{display:none}
  .brand{padding:0 6px}
  .nav{flex-direction:row}
  .side .foot{margin:0;padding:0;border:0;display:flex}
  .view{padding:18px}
  .top{padding:10px 16px}
  .who div{display:none}
  .form{grid-template-columns:1fr}
  .login{grid-template-columns:1fr}
  .login .pitch{padding:32px}
  .barrow{grid-template-columns:120px 1fr 32px}
  .case{grid-template-columns:6px 1fr}
  .case .right{grid-column:2;align-items:flex-start;text-align:left}
  .tl{grid-template-columns:1fr;gap:4px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

  const known = new Set(base.exps.map(e=>String(e.numero||'').trim().toLowerCase()));
  let next = Math.max(base.nextId||1, ...base.exps.map(e=>+e.id||0)) + 1; const sum = [];
  otro.exps.forEach(e=>{ const n = String(e.numero||'').trim().toLowerCase(); if(n && !known.has(n)){ base.exps.push({...e, id:next++}); known.add(n); sum.push(e.afiliado); } });

  base._sumados = (base._sumados||[]).concat(sum);

// ---------- auditoría encadenada (SHA-256) ----------
async function sha(text){
  if(window.crypto && crypto.subtle){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  let h = 0; for(const c of text){ h = (h*31 + c.charCodeAt(0))|0; } return 'nocrypto'+(h>>>0).toString(16);
}

let chain = Promise.resolve();
function audit(accion, objeto, detalle, opts={}){
  const who = opts.user || S.user || 'sistema';
  chain = chain.then(async () => {
    const prev = S.audit.length ? S.audit[S.audit.length-1].hash : 'GENESIS';
    const e = {n:S.audit.length+1, ts:opts.ts || new Date().toISOString(), user:who, accion, objeto, detalle, prev};
    e.hash = await sha(entryBody(e));
    S.audit.push(e); save();
  });
  return chain;
}
async function verifyChain(){
  let prev = 'GENESIS';
  for(const e of S.audit){
    if(e.prev !== prev) return {ok:false, n:e.n};
    if(await sha(entryBody(e)) !== e.hash) return {ok:false, n:e.n};
    prev = e.hash;
  }
  return {ok:true};
}

// ---------- cifrado de respaldo (AES-GCM + PBKDF2) ----------
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function deriveKey(pass, salt){
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'}, k, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encrypt(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return 'FOJAS1.' + b64(salt) + '.' + b64(iv) + '.' + b64(ct);
}
async function decrypt(text, pass){
  const [tag, s, i, c] = text.trim().split('.');
  if(tag !== 'FOJAS1') throw new Error('formato');
  const key = await deriveKey(pass, unb64(s));
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(i)}, key, unb64(c));
  return JSON.parse(new TextDecoder().decode(pt));
}

function matches(q){
  q = q.trim().toLowerCase(); if(!q) return [];
  return S.exps.filter(e => [e.numero,e.afiliado,e.juzgado,e.prestacion,e.dni,(e.dni||'').replace(/\./g,'')].join(' ').toLowerCase().includes(q));
}
function searchResults(){
  const list = matches(ui.q).slice(0,6);
  if(!ui.q.trim()) return '';
  return `<div class="results">${list.map(e=>`<a href="#expediente-${e.id}"><b>${esc(e.afiliado)}</b><div class="small muted">${esc(e.numero)} · ${esc(e.prestacion)}</div></a>`).join('') || '<div class="empty small">No encontramos nada con esa búsqueda.</div>'}</div>`;
}

function taskRow(p, showExp=true){
  const n = daysTo(p.vence), u = urg(n);
  return `<div class="task ${u}">
    <div class="txt"><a href="#expediente-${p.exp.id}">${esc(p.desc)}</a>${showExp?`<div class="small muted">${esc(p.exp.afiliado)} · ${esc(p.exp.numero)}</div>`:''}</div>
    <div style="text-align:right"><div class="when ${u}">${whenText(n)}</div><div class="small muted">${fmt(p.vence)}</div></div>
    ${showExp?'':`<button class="btn sm ghost" data-act="plazoedit" data-e="${p.exp.id}" data-i="${p.idx}" title="Modificar plazo">${ic('pen','sm')} Modificar</button>`}
    <button class="btn sm" data-act="done" data-e="${p.exp.id}" data-i="${p.idx}" title="Marcar como hecho">${ic('check','sm')} Hecho</button>
  </div>`;
}

function vAmparos(){
  const all = S.exps;
  const F = {
    todos:{l:'En curso', f:e=>e.estado!=='Archivado'},
    urgentes:{l:'Urgentes', f:e=>{const p=nextPlazo(e); return p && daysTo(p.vence)<=3;}},
    cautelar:{l:'Con cautelar', f:e=>e.cautelar && e.estado!=='Archivado'},
    mios:{l:'Míos', f:e=>e.abogado===S.user && e.estado!=='Archivado'},
    ...(isLeader()?{equipo:{l:'De mi equipo', f:e=>myPeople().includes(e.abogado) && e.estado!=='Archivado'}}:{}),
    archivados:{l:'Archivados', f:e=>e.estado==='Archivado'}
  };
  if(!F[ui.filtro]) ui.filtro='todos';
  const list = all.filter(F[ui.filtro].f).sort((a,b)=>{ const pa=nextPlazo(a), pb=nextPlazo(b); return (pa?pa.vence:'9999').localeCompare(pb?pb.vence:'9999'); });
  return `
  <div class="head"><div><h1>Amparos</h1><p class="sub">Tocá cualquier amparo para ver todo lo que tiene. Los más urgentes aparecen primero.</p></div>

  <div class="chips">${Object.entries(F).map(([k,v])=>`<button class="chipbtn ${ui.filtro===k?'on':''}" data-filtro="${k}">${v.l} <span class="badge">${all.filter(v.f).length}</span></button>`).join('')}</div>

        <div class="row" style="margin-top:8px"><span class="pill">${esc(e.estado)}</span>${e.cautelar?'<span class="pill acc">Con cautelar</span>':''}${e.riesgo==='alto'?'<span class="pill red">Riesgo alto</span>':''}</div></div>
      <div class="right">${p?`<div class="when ${u}">${whenText(n)}</div><div class="small muted" style="max-width:240px">${esc(p.desc)}</div>`:'<span class="pill grn">Sin pendientes</span>'}</div>

  </div>`;

function vVencimientos(){
  const plazos = allPlazos();
  const groups = [
    ['Vencidos','late',p=>daysTo(p.vence)<0],
    ['Hoy y mañana','soon',p=>{const n=daysTo(p.vence); return n>=0 && n<=1;}],
    ['Esta semana','soon',p=>{const n=daysTo(p.vence); return n>=2 && n<=7;}],
    ['Más adelante','okk',p=>daysTo(p.vence)>7]
  ];
  return `
  <div><h1>Vencimientos</h1><p class="sub">Todo lo que hay que presentar o cumplir, ordenado por fecha. Cuando lo hagas, tocá "Hecho".</p></div>

    <div class="list">${upcomingHolidays(10).map(([d,m])=>`<div class="li"><span>${esc(m)}</span><span class="small muted">${fmtLargo(d)}</span></div>`).join('')}</div>
    <p class="small muted">Feriados nacionales según la Ley 27.399 y el Decreto 614/2025; días no laborables con fines turísticos de 2026 según la Resolución 164/2025. Los de 2027 todavía no fueron publicados. La feria judicial de enero se descuenta solo si la elegís al cargar el plazo.</p></details>
  ${groups.map(([t,c,f])=>{ const l = plazos.filter(f); if(!l.length) return ''; return `
    <section class="card"><div class="row"><h2>${t}</h2><span class="badge ${c==='late'?'red':''}">${l.length}</span></div>

}

function iaText(kind, e){
  const movs = [...e.movimientos].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const p = nextPlazo(e);
  if(kind==='resumen') return `RESUMEN DEL CASO\n\n${e.afiliado} presentó un amparo para que se le cubra: ${e.prestacion.toLowerCase()}. Tramita en el ${e.juzgado} desde el ${fmt(e.inicio)}.\n\nHoy está en la etapa: ${e.estado}.${e.cautelar?' El juez ya ordenó una medida cautelar, así que hay que cumplir la cobertura mientras dura el juicio.':' No hay medida cautelar.'}\n\nLo que pasó hasta ahora:\n${movs.map(m=>`• ${fmt(m.fecha)}: ${m.desc}`).join('\n')}\n${p?`\nLo próximo: ${p.desc} (${whenText(daysTo(p.vence)).toLowerCase()}, ${fmt(p.vence)}).`:''}`;
  if(kind==='paso'){
    const n = p?daysTo(p.vence):null;
    let s = `PRÓXIMOS PASOS\n\n`;
    if(p && n<0) s += `1. URGENTE: "${p.desc}" venció el ${fmt(p.vence)}. Confirmá si se cumplió. Si no, presentalo hoy y avisá al abogado a cargo por el riesgo de multas (astreintes).\n`;
    else if(p) s += `1. Preparar "${p.desc}" antes del ${fmt(p.vence)}.\n`;
    if(e.cautelar) s += `2. Pedirle a Auditoría Médica la constancia de que la prestación se entregó, y presentarla en el juzgado (escrito "Acreditar cumplimiento de cautelar").\n`;
    if(e.estado==='Informe art. 8 pendiente') s += `2. Pedir al área técnica el legajo del afiliado y armar el "Informe del art. 8".\n`;
    if(e.estado==='Sentencia') s += `2. Leer la sentencia y decidir con el abogado a cargo si se apela, dentro del plazo.\n`;
    s += `3. Cuando esté hecho, tocá "Ya lo hice" y cargá la novedad, así todo el equipo lo ve.`;
    return s;
  }
  const pts = (e.riesgo==='alto'?3:e.riesgo==='medio'?2:1) + (e.cautelar?1:0) + (p && daysTo(p.vence)<0 ? 2 : 0);
  return `¿QUÉ TAN RIESGOSO ES?\n\nNivel: ${pts>=4?'ALTO':pts>=3?'MEDIO':'BAJO'} (${pts} de 6 puntos)\n\nPuntos a cuidar:\n• Qué se reclama: ${e.prestacion}.${/oncol|Discapacidad|domiciliaria/.test(e.prestacion)?' En estos temas los jueces suelen darle la razón al afiliado.':''}\n• Medida cautelar: ${e.cautelar?'sí. Si no se cumple, puede haber multas.':'no.'}\n• Plazos vencidos: ${e.plazos.filter(x=>!x.hecho && daysTo(x.vence)<0).length}.\n• Monto en juego: ${money(e.monto)}.\n\n${pts>=4?'Recomendación: que el abogado a cargo lo revise hoy.':'Recomendación: seguimiento normal.'}`;
}

async function addModels(files){
  files = [...files]; if(!files.length) return;
  S.modelos = S.modelos || []; const box = $('#mprog');
  for(const f of files){
    let r = {text:''}; try{ r = await readFile(f, (t)=>{ if(box) box.textContent = `${f.name}: ${t}`; }); }catch(err){}
    const texto = (r.text||'').replace(/\[P[aá]gina \d+\]\n?/g,'').replace(/\n{3,}/g,'\n\n').trim();
    if(!texto){ toast(`No pudimos leer ${f.name}`); continue; }
    const m = {id:randId(6), nombre:f.name.replace(/\.[a-z0-9]+$/i,''), categoria:guessCategoria(texto), texto:texto.slice(0,150000), fecha:iso(today()), autor:S.user};
    S.modelos.push(m); audit('Subió un modelo','Modelos',`${m.nombre} (${m.categoria})`);
  }
  save(); render(); toast(files.length===1?'Modelo guardado':'Modelos guardados');
}

}

function assignable(e){ const t = teamOf(e.abogado) || teamsLed()[0]; const ids = t ? [t.jefe, ...t.miembros] : staff().map(u=>u.id); if(isAdmin()) staff().forEach(u=>{ if(!ids.includes(u.id)) ids.push(u.id); }); return ids.map(id=>S.users.find(u=>u.id===id)).filter(Boolean); }
function memberCard(uid, boss){
  const u = S.users.find(x=>x.id===uid); if(!u) return '';
  const st = statsOf(uid);
  return `<button class="orgcard ${boss?'boss':''}" data-openmember="${uid}">
    <div class="avatar" style="${boss?'background:var(--accent);color:#fff':''}">${initials(u.nombre)}</div>

function memberDetail(uid, t){
  const u = S.users.find(x=>x.id===uid); if(!u) return '';

  const open = ui.open[uid] ? 'open' : '';
  const others = [t.jefe, ...t.miembros].filter(x=>x!==uid);
  return `<details class="member" data-member="${uid}" ${open}>
    <summary><div class="avatar">${initials(u.nombre)}</div><div style="flex:1;min-width:180px"><b>${esc(u.nombre)}</b><div class="small muted">${esc(u.rol)}</div></div>

          ${(isAdmin()||t.jefe===S.user)&&others.length?`<select data-reassign="${e.id}" aria-label="Pasar a otra persona" class="small" style="margin-top:6px;padding:6px 8px"><option value="">Pasar a…</option>${others.map(o=>`<option value="${o}">${esc(userName(o))}</option>`).join('')}</select>`:''}

    </div>
  </details>`;
}

const LIB = {
  pdf:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
  pdfWorker:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
  tess:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  tessWorker:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
  tessCore:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
  tessLang:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/spa@1.0.0/4.0.0_best_int',
  mammoth:'https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js'
};
const loaded = {};
function loadScript(src){ return loaded[src] = loaded[src] || new Promise((res,rej)=>{ const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = ()=>{ delete loaded[src]; rej(new Error('No se pudo cargar el lector')); }; document.head.appendChild(s); }); }
async function makeOcr(progress){
  await loadScript(LIB.tess);
  let label = 'Leyendo la imagen…';
  const worker = await Tesseract.createWorker('spa', 1, {workerPath:LIB.tessWorker, corePath:LIB.tessCore, langPath:LIB.tessLang,
    logger:m=>{ if(m.status==='recognizing text') progress(label, m.progress); else if(/load/.test(m.status)) progress('Preparando el lector de imágenes (la primera vez tarda un poco)…', m.progress||0); }});
  return {read: async (img, lbl) => { label = lbl || label; const {data:{text}} = await worker.recognize(img); return text; }, end: () => worker.terminate()};
}
async function ocr(img, progress){ const o = await makeOcr(progress); try{ return await o.read(img); } finally { await o.end(); } }
// Devuelve {text, paginas, conImagen}: lee TODAS las páginas; las que no tienen texto (escaneadas o fotos) se leen como imagen.
async function readFile(file, progress){
  const name = file.name.toLowerCase();
  if(file.type==='application/pdf' || name.endsWith('.pdf')){
    await loadScript(LIB.pdf);
    pdfjsLib.GlobalWorkerOptions.workerSrc = LIB.pdfWorker;
    progress('Abriendo el PDF…', .02);
    const doc = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
    const N = doc.numPages; let text = '', conImagen = 0, o = null;
    try{
      for(let i=1;i<=N;i++){
        const pg = await doc.getPage(i);
        const c = await pg.getTextContent();
        let pt = c.items.map(it=>it.str + (it.hasEOL?'\n':' ')).join('');
        if(pt.replace(/\s/g,'').length < 40){
          // página escaneada o con fotos: se lee como imagen
          if(!o) o = await makeOcr((t,p)=>progress(`Página ${i} de ${N} (imagen): ${t}`, (i-1+p)/N));
          const vp = pg.getViewport({scale:2});
          const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
          await pg.render({canvasContext:cv.getContext('2d'), viewport:vp}).promise;
          pt = await o.read(cv, `Leyendo la página ${i} de ${N} (es una imagen)…`);
          cv.width = cv.height = 0; conImagen++;
        }
        text += `\n[Página ${i}]\n` + pt + '\n';
        progress(`Leída la página ${i} de ${N}${conImagen?` · ${conImagen} como imagen`:''}`, i/N);
        pg.cleanup();
      }
    } finally { if(o) await o.end(); }
    return {text, paginas:N, conImagen};
  }
  if(file.type.startsWith('image/')) return {text: await ocr(file, progress), paginas:1, conImagen:1};
  if(name.endsWith('.docx')){ await loadScript(LIB.mammoth); progress('Leyendo el Word…', .5); const r = await mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()}); return {text:r.value, paginas:null, conImagen:0}; }
  if(file.type.startsWith('text/') || name.endsWith('.txt')) return {text: await file.text(), paginas:null, conImagen:0};
  return {text:'', paginas:null, conImagen:0};
}

function scorePrestaciones(text){
  const t = String(text||'');
  const out = PREST_KW.map(([name, kws])=>[name, kws.reduce((a,[re,w])=>a + ((t.match(new RegExp(re.source, 'gi'))||[]).length * w), 0)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  // "Medicamentos" y "Cobertura integral" solo ganan si no hay algo más específico
  const spec = out.filter(x=>!/^Medicamentos$|^Cobertura integral$/.test(x[0]));
  return spec.length ? spec.concat(out.filter(x=>/^Medicamentos$|^Cobertura integral$/.test(x[0]))) : out;
}
function buildSumario(o){
  const partes = [];
  const jz = o.juzgado ? ` ante el ${o.juzgado}${o.secretaria?`, Secretaría ${o.secretaria}`:''}` : '';
  partes.push(`${o.afiliado||'[Afiliado]'}${o.dni?` (DNI ${o.dni})`:''} promovió acción de amparo contra Salud Integral Demo S.A.${jz}${o.numero?` (Expte. ${o.numero})`:''}.`);
  partes.push(`Reclama ${o.detalle?`la cobertura de ${o.detalle}`:`cobertura de ${(o.prestacion||'[prestación]').toLowerCase()}`}${o.prestacion && o.detalle?` (${o.prestacion.toLowerCase()})`:''}.`);
  if(o.cautelar) partes.push('El juzgado hizo lugar a la medida cautelar y ordenó otorgar la cobertura mientras tramita el proceso.');
  if(/Informe/.test(o.estado||'') || (o.extra||[]).some(x=>/informe/i.test(x.desc)) || /informe/i.test(o.plazoDesc||'')) partes.push('Se requirió a la empresa el informe circunstanciado del art. 8 de la Ley 16.986.');
  if(o.plazoDesc) partes.push(`Próximo vencimiento: ${o.plazoDesc.toLowerCase()} (${fmt(o.plazoFecha)}).`);
  const docs = (o.docs||[]).map(d=>d.tipo).filter(Boolean);
  if(docs.length) partes.push(`Documentación recibida: ${[...new Set(docs)].join(', ').toLowerCase()}.`);
  if(o.flags){ if(o.flags.reclamoPrevio) partes.push('Surge un reclamo o una negativa previa de la empresa.'); else partes.push('No surge de la documentación un reclamo previo a la empresa.'); }
  return partes.join(' ');
}

const FERIA_ENERO = y => ({desde:`${y}-01-01`, hasta:`${y}-01-31`});
const DOW = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const isoOf = d => iso(d);
function motivoInhabil(isoDate, opts={}){
  const d = new Date(isoDate+'T12:00:00'), w = d.getDay();
  if(w===0 || w===6) return w===0 ? 'domingo' : 'sábado';
  if(FERIADOS[isoDate]) return 'feriado: ' + FERIADOS[isoDate];
  if(opts.noLaborables!==false && NO_LABORABLES[isoDate]) return NO_LABORABLES[isoDate];
  if(opts.feria){ const f = FERIA_ENERO(d.getFullYear()); if(isoDate>=f.desde && isoDate<=f.hasta) return 'feria judicial de enero'; }
  return '';
}
// Calcula el vencimiento. modo: 'habiles' | 'corridos' | 'horas' | 'fecha'
function calcPlazo(r){
  const desde = r.desde || iso(today());
  const opts = {feria:!!r.feria, noLaborables:r.noLaborables!==false};
  const skipped = []; let d = new Date(desde+'T12:00:00'); let aviso = '';
  if(r.modo==='fecha') { const m = motivoInhabil(r.fecha, opts); return {vence:r.fecha, skipped, aviso: m ? `Esa fecha es inhábil (${m}).` : ''}; }
  if(r.modo==='habiles'){
    let k = 0; const n = Math.max(1, +r.cant||1);
    while(k<n){ d.setDate(d.getDate()+1); const id = isoOf(d), m = motivoInhabil(id, opts); if(m){ if(!/^(sábado|domingo)$/.test(m)) skipped.push({fecha:id, motivo:m}); } else k++; }
    return {vence:isoOf(d), skipped, aviso:''};
  }
  const dias = r.modo==='horas' ? Math.max(1, Math.ceil((+r.cant||24)/24)) : Math.max(1, +r.cant||1);
  d.setDate(d.getDate()+dias);
  let id = isoOf(d), m = motivoInhabil(id, opts);
  if(m){ const orig = id; while(motivoInhabil(id, opts)){ d.setDate(d.getDate()+1); id = isoOf(d); } aviso = `El ${fmt(orig)} es inhábil (${m}): lo pasamos al primer día hábil siguiente. Verificá el criterio del juzgado.`; }
  return {vence:id, skipped, aviso};
}
function addBusinessDays(n){ return calcPlazo({modo:'habiles', cant:n}).vence; }
const fmtLargo = s => { const d = new Date(s+'T12:00:00'); return `${DOW[d.getDay()]} ${d.getDate()} de ${d.toLocaleDateString('es-AR',{month:'long'})} de ${d.getFullYear()}`; };
function reglaTexto(r){ if(!r) return ''; if(r.modo==='fecha') return 'Fecha fijada a mano'; const u = r.modo==='habiles'?'días hábiles':r.modo==='corridos'?'días corridos':'horas'; return `${r.cant} ${u} desde el ${fmt(r.desde)}${r.feria?' · descontando feria de enero':''}`; }

// ---------- lectura de plazos del oficio o la cédula ----------
const NUMS = {un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,quince:15,veinte:20,treinta:30,veinticuatro:24,'cuarenta y ocho':48,'setenta y dos':72,'noventa y seis':96};
const ORD = {primer:1,primero:1,segundo:2,tercer:3,tercero:3,cuarto:4,quinto:5,sexto:6,septimo:7,'séptimo':7,octavo:8,noveno:9,decimo:10,'décimo':10};
const toNum = s => { if(!s) return null; s = s.trim().toLowerCase(); if(/^\d+$/.test(s)) return +s; return NUMS[s] || null; };
function extractPlazos(text, hayCautelar){
  const one = String(text||'').replace(/\[P[aá]gina \d+\]/g,' ').replace(/\s+/g,' ');
  const frases = one.split(/(?<=[.;])\s+(?=[A-ZÁÉÍÓÚÑ"“(])/);
  const out = [], vistos = new Set();
  const RE = /(?:plazo|t[eé]rmino|dentro)\b[^.;:]{0,60}?\b(\d{1,3}|cuarenta y ocho|setenta y dos|noventa y seis|veinticuatro|[a-záéíóú]{2,12})\s*(?:\(\s*(\d{1,3}|[a-záéíóú ]{2,20})\s*\)\s*)?(d[ií]as?(?:\s+h[aá]biles|\s+corridos)?|horas|hs\.?)/gi;
  const REORD = /dentro\s+del?\s+(primer|segundo|tercer|cuarto|quinto|sexto|s[eé]ptimo|octavo|noveno|d[eé]cimo)\s+d[ií]a/gi;
  for(const fr of frases){
    const cands = [];
    let m; RE.lastIndex = 0; while((m = RE.exec(fr))){ const n = toNum(m[1]) || toNum(m[2]); if(n) cands.push({n, unidad:m[3].toLowerCase(), txt:m[0]}); }
    REORD.lastIndex = 0; while((m = REORD.exec(fr))){ const n = ORD[m[1].toLowerCase()] || ORD[m[1].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')]; if(n) cands.push({n, unidad:'días', txt:m[0]}); }
    if(!cands.length) continue;
    let tipo = /informe|art(?:[ií]culo|\.)?\s*8\b|circunstanciado/i.test(fr) ? 'informe'
      : /cautelar|precautoria|innovar/i.test(fr) || (hayCautelar && /otorg|cobertura|provea|suministr|autoric|entreg/i.test(fr)) ? 'cautelar'
      : /int[ií]m/i.test(fr) ? 'intimacion' : /traslado|contest/i.test(fr) ? 'traslado' : 'otro';
    if(tipo==='cautelar' && !hayCautelar) tipo = 'intimacion';
    if(vistos.has(tipo)) continue; vistos.add(tipo);
    const c0 = cands[0];
    const modo = /hora|hs/.test(c0.unidad) ? 'horas' : /corrid/.test(c0.unidad) ? 'corridos' : 'habiles';
    const regla = {modo, cant:c0.n, desde:iso(today())};
    const calc = calcPlazo(regla);
    const desc = {cautelar:'Cumplir medida cautelar', informe:'Presentar informe art. 8 Ley 16.986', intimacion:'Cumplir intimación', traslado:'Contestar traslado', otro:'Cumplir lo ordenado por el juzgado'}[tipo];
    const cita = fr.length > 170 ? '…' + fr.slice(Math.max(0, fr.indexOf(c0.txt) - 70), fr.indexOf(c0.txt) + c0.txt.length + 40).trim() + '…' : fr.trim();
    const como = modo==='horas' ? `${c0.n} horas corridas` : modo==='corridos' ? `${c0.n} días corridos` : `${c0.n} días hábiles judiciales, desde el día siguiente a la notificación y salteando fines de semana y feriados nacionales`;
    out.push({tipo, desc, regla, vence:calc.vence, nota:`El documento dice: «${cita}». Lo contamos como ${como}, desde hoy. Si te notificaron otro día, cambiá la fecha.${calc.aviso?' '+calc.aviso:''}`});
  }
  return out;
}

// ---------- extracción de datos del texto ----------
const titleCase = s => String(s||'').replace(/[A-ZÁÉÍÓÚÑÜ]{2,}/g, w => w[0] + w.slice(1).toLowerCase());
const NUM_WORDS = {un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,quince:15,veinte:20,'veinticuatro':24,'cuarenta y ocho':48,'setenta y dos':72};
function extractFields(raw){
  const t = raw.replace(/[ \t\r\f]+/g,' ').replace(/\n+/g,'\n');
  const one = t.replace(/\n/g,' ');
  const f = {};
  // número de expediente
  let m = one.match(/\b(CCF|CIV|COM|CAF|CNT|CSS|FSM|FLP|FRO|FCB|FMZ|FTU|FMP|FCR|FRE|FPO|FBB|FGR|FCT|FSA|FPA|FLP)\s*0*(\d{1,6})\s*\/\s*(\d{4})/i);
  if(m) f.numero = `${m[1].toUpperCase()} ${m[2]}/${m[3]}`;
  else if((m = one.match(/Exp(?:ediente|te)?\.?\s*(?:N[°ºo]\.?|Nro\.?|n[uú]mero)?\s*:?\s*([\d.]{1,9}\s*\/\s*\d{4})/i))) f.numero = 'Expte. ' + m[1].replace(/\s/g,'');
  // autos y asociado: primero se busca la mención expresa de "autos"; si no aparece, cualquier "X c/ Y s/ Z"
  const AUT = /\bautos\s*(?:caratulados|rotulados|que\s+se\s+caratulan|n[°º.]*\s*[\w\/ ]{0,20})?\s*[:\-–]?\s*[“"«']*\s*([^"”»\n]{3,160}?)\s+[cC]\s*\/\s*([^"”»\n]{3,160}?)\s+[sS]\s*\/\s*([^"”»\n]{2,120})/;
  const GEN = /([A-ZÁÉÍÓÚÑa-záéíóúñ][A-ZÁÉÍÓÚÑa-záéíóúñ.,'() ]{3,120}?)\s+[cC]\s*\/\s*([^"”»\n]{3,160}?)\s+[sS]\s*\/\s*([A-ZÁÉÍÓÚÑa-záéíóúñ][^"”»\n]{2,120})/;
  m = t.match(AUT) || one.match(AUT) || t.match(GEN);
  if(m){
    let af = m[1].replace(/^(?:en\s+)?(?:los\s+)?(?:autos\s+)?(?:caratulados\s*:?)?\s*/i,'').replace(/^(?:del?\s+)?(?:Sr\.?|Sra\.?)\s+/i,'').replace(/^[“"«'\s]+/,'').trim();
    const dem = titleCase(m[2].trim()).replace(/\bS\.?\s?a\.?(?=\s|$)/g,'S.A.').replace(/\bS\.?r\.?l\.?(?=\s|$)/gi,'S.R.L.');
    const obj = m[3].replace(/\s*(?:\(?\s*Expte?\.?|Expediente|N[°º]\s*\d|\/\/).*$/i,'').replace(/[.,;:\s]+$/,'').trim();
    f.autos = `${titleCase(af)} c/ ${dem} s/ ${obj.toLowerCase()}`;
    // el asociado es la parte actora de los autos (sin aclaraciones de representación)
    f.afiliado = titleCase(af.replace(/\s*\((?:en\s+)?(?:rep|representaci)[^)]*\)/i,'').replace(/\s+(?:en\s+(?:nombre\s+y\s+)?representaci[oó]n|por\s+s[ií]\s+y\s+en).*$/i,'').trim());
  }
  // DNI
  m = one.match(/D\.?\s?N\.?\s?I\.?\s*(?:N\s*[°ºo*”"'´.]*|Nro\.?)?\s*:?\s*(\d{1,2})[.\s]?(\d{3})[.\s]?(\d{3})\b/i);
  if(m) f.dni = `${m[1]}.${m[2]}.${m[3]}`;
  // juzgado y secretaría
  const jzm = matchJuzgado(one);
  if(jzm) f.juzgado = jzm;
  else if((m = one.match(/(Juzgado\s+[^.;\n]{10,140}?)(?=,|\.|;|\s+Secretar|$)/i))) { f.juzgado = m[1].trim(); f.juzgadoLibre = true; }
  const sec = matchSecretaria(one); if(sec) f.secretaria = sec;
  if(f.juzgado && isCCF(f.juzgado) && sec){ const n = +((sec.match(/\d+/)||[])[0]||0); if(n && !ccfSecretarias(f.juzgado).includes(n)) f.secretariaDudosa = true; }
  // prestación: se puntúa cada tipo según cuántas veces aparecen sus palabras
  const scored = scorePrestaciones(one);
  if(scored.length){ f.prestacion = scored[0][0]; f.otrasPrestaciones = scored.slice(1).filter(x=>x[1] >= Math.max(2, scored[0][1]*0.4)).slice(0,2).map(x=>x[0]); }
  // qué pide exactamente
  m = one.match(/cobertura\s+(?:integral\s+|total\s+)?(?:del?\s+(?:cien\s+por\s+ciento\s+)?\(?100\s*%?\)?\s*)?(?:de(?:l)?\s+(?:la\s+|los\s+|las\s+)?)?([^.;]{6,180})/i);
  if(m) f.detalle = m[1].trim().replace(/\s*,?\s+(?:conforme|seg[uú]n|en los t[eé]rminos|dentro|en el plazo|bajo apercibimiento|a fin de|para que|hasta tanto)\b.*$/i,'').replace(/[,\s]+$/,'');
  // cautelar y etapa
  const ordena = /(hacer|hace|h[aá]gase|h[aá]cese)\s+lugar|ord[eé]n(ase|a|ar)|decr[eé]tase|int[ií]m(ase|ar|a)/i.test(one);
  if(/medida cautelar|medida precautoria|prohibici[oó]n de innovar|medida innovativa/i.test(one) && ordena) f.cautelar = true;
  const informe = /art(?:[ií]culo|\.)?\s*8|informe circunstanciado|informe previsto/i.test(one);
  if(f.cautelar) f.estado = 'Cautelar otorgada'; else if(informe) f.estado = 'Informe art. 8 pendiente'; else if(/int[ií]m|traslado/i.test(one)) f.estado = 'Intimación recibida';
  // plazos que da el juzgado
  const pl = extractPlazos(t, f.cautelar);
  const orden = ['cautelar','informe','intimacion','traslado','otro'];
  pl.sort((a,b)=>orden.indexOf(a.tipo)-orden.indexOf(b.tipo));
  if(pl.length){ const p = pl[0]; f.plazoDesc = p.desc; f.plazoFecha = p.vence; f.plazoRegla = p.regla; f.plazoNota = p.nota; f.extra = pl.slice(1).map(x=>({desc:x.desc, vence:x.vence, hecho:false, regla:x.regla, nota:x.nota})); }
  else if(f.cautelar){ f.plazoDesc = 'Cumplir medida cautelar'; }
  else if(informe){ f.plazoDesc = 'Presentar informe art. 8 Ley 16.986'; }
  // si hay cautelar e informe pero el oficio no dice el plazo del informe, se propone uno para revisar
  if(f.cautelar && informe && !pl.some(x=>x.tipo==='informe')){ const r = {modo:'habiles', cant:5, desde:iso(today())}; (f.extra = f.extra||[]).push({desc:'Presentar informe art. 8 Ley 16.986', vence:calcPlazo(r).vence, hecho:false, regla:r, nota:'El documento no dice el plazo del informe: propusimos 5 días hábiles. Revisalo.'}); }
  return f;
}

// ---------- clasificación de documentos ----------
const DOC_TYPES = ['Demanda','Cédula de notificación','Oficio','Resolución','Prescripción médica','Historia clínica','Certificado de discapacidad (CUD)','Presupuesto','Carta documento','Prueba documental','Otro documento'];
function classifyDoc(text, name){
  const t = (text||'') + ' ' + (name||'');
  if(/c[eé]dula\s+de\s+notificaci/i.test(t)) return 'Cédula de notificación';
  if(/(promuev|inicio|interpong|deduzc|vengo a (promover|interponer|iniciar)).{0,60}amparo|\bPETITORIO\b|acci[oó]n de amparo contra/i.test(t)) return 'Demanda';
  if(/\boficio\b/i.test(t) && /(s[ií]rvase|tengo el agrado|me dirijo|a fin de)/i.test(t)) return 'Oficio';
  if(/\bRESUELVO\b|SE RESUELVE|resuelvo\s*:/i.test(t)) return 'Resolución';
  if(/certificado\s+[uú]nico\s+de\s+discapacidad|\bCUD\b/i.test(t)) return 'Certificado de discapacidad (CUD)';
  if(/historia\s+cl[ií]nica|epicrisis|resumen\s+de\s+(la\s+)?historia/i.test(t)) return 'Historia clínica';
  if(/prescrip|receta|\bRp\s*[\/.]|indicaci[oó]n\s+m[eé]dica|indico\s+(el\s+)?tratamiento/i.test(t)) return 'Prescripción médica';
  if(/presupuesto/i.test(t)) return 'Presupuesto';
  if(/carta\s+documento/i.test(t)) return 'Carta documento';
  if(/demanda/i.test(name||'')) return 'Demanda';
  if(/oficio/i.test(name||'')) return 'Oficio';
  if(/c[eé]dula/i.test(name||'')) return 'Cédula de notificación';
  if(/prueba|anexo|document/i.test(name||'')) return 'Prueba documental';
  return 'Otro documento';
}
function flagsFromText(t){
  return {
    prescripcion:/prescrip|receta|\bRp\s*[\/.]|indicaci[oó]n\s+m[eé]dica/i.test(t),
    hc:/historia\s+cl[ií]nica|epicrisis/i.test(t),
    cud:/certificado\s+[uú]nico\s+de\s+discapacidad|\bCUD\b/i.test(t),
    reclamoPrevio:/carta\s+documento|reclam[oó]\s+(ante|a)\s+(la\s+)?(demandada|prepaga|empresa)|negativa|rechaz[oó]\s+(la\s+)?(cobertura|solicitud)|deneg[oó]/i.test(t),
    importado:/importad|del\s+exterior|extranjer/i.test(t),
    offlabel:/off[\s-]?label|fuera\s+de\s+prospecto|no\s+aprobad[oa]\s+por\s+(la\s+)?ANMAT|uso\s+compasivo|experimental/i.test(t),
    fueraCartilla:/fuera\s+de\s+cartilla|no\s+(es\s+)?prestador|prestador\s+no\s+contratado|de\s+su\s+elecci[oó]n|no\s+pertenece\s+a\s+la\s+cartilla/i.test(t),
    menor:/menor\s+de\s+edad|por\s+su\s+hij[oa]|en\s+representaci[oó]n\s+de\s+su\s+hij|\bmenor\b/i.test(t),
    marca:/\b(marca|exclusivamente|no\s+sustituible|no\s+reemplazar)\b/i.test(t)
  };
}
function caseFlags(e){
  const f = {...(e.flags||{})};
  (e.docs||[]).forEach(d=>{ const t = d.tipo+' '+d.nombre;
    if(/Prescripci|prescrip|receta/i.test(t)) f.prescripcion = true;
    if(/Historia|historia/i.test(t)) f.hc = true;
    if(/CUD|discapacidad/i.test(t)) f.cud = true;
    if(/Carta documento|negativa|reclamo/i.test(t)) f.reclamoPrevio = true;
    if(/Demanda|demanda/i.test(t)) f.demanda = true; });
  if(/por su hij/i.test(e.afiliado||'')) f.menor = true;
  return f;
}

// ---------- sugerencias: qué hacer y con qué normativa ----------

      plazo:{match:/cautelar/i, desc:'Cumplir medida cautelar', regla:{modo:'habiles', cant:5}}, escrito:'cumplimiento'});
    add('urgente',{titulo:'Evaluar si conviene apelar la cautelar', nivel:'alta',

      pasos:['Compará lo que ordenó el juez con lo que pidió el asociado y con la prescripción médica.',

      pasos:['Pedí el legajo de '+quien+': solicitudes presentadas, respuestas enviadas, dictamen de Auditoría Médica y cartilla ofrecida.',
        `Armá una cronología clara: cuándo pidió ${P.toLowerCase()||'la prestación'}, qué se le respondió y por qué.`,

      riesgo:'El plazo lo fija el juez en la providencia. Si no se presenta a tiempo, el amparo avanza sin la versión de la empresa.',
      normas:['Ley 16.986 art. 8','CN art. 43'],
      plazo:{match:/informe/i, desc:'Presentar informe art. 8 Ley 16.986', regla:{modo:'habiles', cant:5}}, escrito:'informe'});
    add('urgente',{titulo:'Analizar si la vía del amparo es admisible', nivel:'media',

      pasos:['Verificá cuándo se notificó la negativa al asociado: la ley prevé 15 días hábiles para presentar el amparo.',

  if(/Prótesis/i.test(P)) fondo('Prótesis y órtesis: alcance del PMO',

  // prueba: lo que surge o falta en lo presentado
  const prueba = (titulo, porque, pasos, normas, nivel='media') => add('prueba',{titulo, porque, pasos, normas, nivel});
  if(!f.prescripcion) prueba('No encontramos prescripción médica', `${docsTxt} no aparece una prescripción o indicación médica actual.`,

  if(/Discapacidad/i.test(P) && !f.cud) prueba('No encontramos el CUD', `${docsTxt} no aparece el Certificado Único de Discapacidad.`,
    ['Verificá si lo acompañaron y su fecha de vencimiento.','Sin CUD vigente, el reclamo no puede encuadrarse en la Ley 24.901.'], ['Ley 22.431 art. 3','Ley 24.901'],'alta');
  if(!f.reclamoPrevio) prueba('No surge un reclamo previo a la empresa', `${docsTxt} no aparece una solicitud, carta documento o negativa previa.`,

async function wProcess(fileList, append){
  const files = [...fileList]; if(!files.length) return;
  const base = append ? W.files.length : 0;
  W.files = (append ? W.files : []).concat(files.map(f=>({name:f.name, size:f.size, tipo:'', text:'', pv:randId(6)}))); files.forEach((f,j)=>{ PREVIEW[W.files[base+j].pv] = {file:f, text:''}; }); W.processing = true; W.readErr=''; drawWizard();
  for(let j=0;j<files.length;j++){
    const i = base + j;
    const set = (t,p) => { const a=$('#wpt'+i), b=$('#wpb'+i); if(a) a.textContent = t; if(b) b.style.width = Math.round((p||0)*100)+'%'; };
    try{ const r = await readFile(files[j], set); const tx = r.text; W.files[i].text = tx; if(PREVIEW[W.files[i].pv]) PREVIEW[W.files[i].pv].text = tx; W.files[i].paginas = r.paginas; W.files[i].tipo = classifyDoc(tx, files[j].name); set(tx.trim()?`Listo · ${r.paginas?`${r.paginas} página${r.paginas>1?'s':''} leída${r.paginas>1?'s':''}${r.conImagen?` (${r.conImagen} como imagen)`:''} · `:''}lo reconocimos como: ${W.files[i].tipo}`:'No tiene texto que se pueda leer', 1); }
    catch(err){ W.files[i].tipo = classifyDoc('', files[j].name); set('No pudimos leer este archivo', 1); W.readErr = 'No pudimos leer algún archivo automáticamente (revisá tu conexión a internet).'; }
  }
  // primero lo que notifica el juzgado, después la demanda y al final la prueba
  const order = t => /Cédula|Oficio|Resolución/.test(t) ? 0 : t==='Demanda' ? 1 : 2;
  const text = [...W.files].sort((a,b)=>order(a.tipo)-order(b.tipo)).map(f=>f.text).join('\n');
  W.text = text; W.processing = false;
  const f = extractFields(text);
  if(!append) W.found = {};
  for(const k of ['afiliado','dni','numero','juzgado','secretaria','prestacion','estado','plazoDesc','plazoFecha','autos','detalle']) if(f[k] && (!append || !W.found[k])){ W[k] = f[k]; W.found[k] = true; }
  if(f.otrasPrestaciones) W.otrasPrestaciones = f.otrasPrestaciones;
  if(f.juzgadoLibre) delete W.found.juzgado;
  delete W.found.detalle;
  if(f.cautelar){ W.cautelar = true; W.found.cautelar = true; }
  if(f.secretariaDudosa && !append) W.found.secretariaDudosa = true;
  if(!append || !W.plazoNota) W.plazoNota = f.plazoNota || ''; W.plazoRegla = f.plazoRegla || null;  if(!append || !(W.extra||[]).length) W.extra = f.extra || [];
  W.flags = flagsFromText(text);
  W.step = 2; drawWizard();
}

  showModal(`
    <h2>${forced?'Elegí tu contraseña':'Cambiar contraseña'}</h2>
    ${forced?'<div class="notice">Entraste con una contraseña provisoria. Elegí una tuya para seguir.</div>':''}
    <form class="form" id="pwdForm">
      <label class="full">Contraseña actual<input type="password" id="pwOld" required autocomplete="current-password"></label>
      <label>Nueva contraseña<input type="password" id="pwNew" required autocomplete="new-password"></label>
      <label>Repetila<input type="password" id="pwRep" required autocomplete="new-password"></label>
      <div class="full hint">Mínimo 8 caracteres, con letras y números.</div>
      <div class="full" id="pwMsg"></div>
      <div class="full row"><button class="btn pri" type="submit">Guardar</button>${forced?'<button class="btn ghost" type="button" data-act="logout">Salir</button>':'<button class="btn ghost" type="button" data-act="close">Cancelar</button>'}</div>
    </form>`, forced);
  setTimeout(()=>$('#pwOld').focus(), 30);
}

// ---------- render ----------
function render(){
  if(!logged()){ $('#root').innerHTML = vIngreso(); document.title='Fojas · Ingresar'; return; }
  document.title='Fojas';
  const r = route();
  const views = {equipo:vEquipo, inicio:vInicio, amparos:vAmparos, vencimientos:vVencimientos, escritos:vEscritos, modelos:vModelos, informes:vInformes, historial:vHistorial, modulos:vModulos, respaldo:vRespaldo, usuarios:vUsuarios};
  const html = r.name==='expediente' ? vExpediente(r.id) : (views[r.name]||vInicio)();
  const scroll = $('#view') ? $('#view').scrollTop : 0;
  $('#root').innerHTML = shell(html);
  $('#view').scrollTop = scroll;
  if(r.name==='respaldo') IDB.snaps().then(list=>{ const box = $('#snapList'); if(!box) return; list.sort((a,b)=>b.id-a.id); box.innerHTML = list.length ? list.slice(0,40).map(s=>`<div class="li"><div><b>${fmtTs(s.fecha)}</b><div class="small muted">${s.amparos} amparo${s.amparos===1?'':'s'}${s.nota?` · ${esc(s.nota)}`:''}${s.autor?` · ${esc(userName(s.autor))}`:''}</div></div><button class="btn sm" data-act="restoresnap" data-id="${s.id}">Restaurar</button></div>`).join('') : '<div class="small muted">Todavía no hay versiones guardadas: se crean solas mientras trabajás.</div>'; }).catch(()=>{ const box = $('#snapList'); if(box) box.innerHTML = '<div class="small muted">Este navegador no permite guardar versiones.</div>'; });
}
async function rerenderAfterAudit(){ await chain; render(); }

function markDone(e, i){
  const p = e.plazos[i]; if(!p || p.hecho) return;
  p.hecho = true; save(); audit('Marcó como hecho', e.numero, p.desc); render();
  toast(`Listo: "${p.desc}" quedó como hecho.`, () => { p.hecho = false; save(); audit('Deshizo "hecho"', e.numero, p.desc); render(); });
}

document.addEventListener('keydown', ev => {
  if(ev.key==='Enter' && ev.target.matches('[data-go]')) location.hash = ev.target.dataset.go;
  if(ev.key==='Escape' && $('#overlay').classList.contains('show') && !$('#overlay').dataset.forced) closeModal();
  if(ev.target.id==='gsearch'){
    const links = [...document.querySelectorAll('.results a')];
    if(ev.key==='Enter' && links.length){ ev.preventDefault(); location.hash = links[0].getAttribute('href').slice(1); ui.q=''; }
    if(ev.key==='Escape'){ ui.q=''; ui.results=false; render(); }
  }
  if(ev.key==='Enter' && $('#overlay').classList.contains('show') && W && ev.target.matches('#modal input[type=text]')){ ev.preventDefault(); const b = $('[data-wnav="1"]') || $('[data-act=wcreate]'); if(b) b.click(); }
});

  if(t.dataset && t.dataset.wdoc!==undefined && W){ wRead(); W.files[+t.dataset.wdoc].tipo = t.value; drawWizard(); }
  if(t.id==='wJz' && W){ wRead(); const box = $('#wSecBox'); if(box) box.innerHTML = secField(); }
  if(t.dataset && t.dataset.reassign && t.value){ const x = expById(t.dataset.reassign); if(!x || !canManage(x) || t.value===x.abogado) return; const old = x.abogado; x.abogado = t.value; save();
    audit('Reasignó un amparo', x.numero, `De ${userName(old)} a ${userName(t.value)}`); render();
    toast(`${x.afiliado} ahora está a cargo de ${userName(t.value)}.`, ()=>{ x.abogado = old; save(); audit('Deshizo reasignación', x.numero, `Vuelve a ${userName(old)}`); render(); }); }
  if(t.dataset && t.dataset.mod){ S.modules[t.dataset.mod] = t.checked; save(); const m = MODULES.find(x=>x.id===t.dataset.mod); audit(t.checked?'Activó un módulo':'Apagó un módulo', m.nombre, 'Configuración'); render(); toast(t.checked?`${m.nombre} activado: ya aparece en el menú`:`${m.nombre} apagado`); }
});
async function addFiles(e, files){
  files = [...files]; if(!files.length) return;
  toast(files.length===1?'Leyendo el documento completo…':`Leyendo ${files.length} documentos completos…`);
  const tipos = [], novedades = [];
  for(const f of files){
    let r = {text:''}; try{ r = await readFile(f, (t)=>{ const el = $('#toast'); if(el){ el.querySelector('span') && (el.querySelector('span').textContent = `${f.name}: ${t}`); el.classList.add('show'); clearTimeout(toast.t); } }); }catch(err){}
    const tx = r.text || '';
    const tipo = classifyDoc(tx, f.name); tipos.push(tipo);
    const fid = await saveFileBlob(f, tx);
    e.docs.push({nombre:f.name, fid, tipo, fecha:iso(today()), paginas:r.paginas||null, size: f.size>1e6?(f.size/1e6).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(f.size/1000))+' KB'});
    audit('Subió un documento', e.numero, `${f.name} (${tipo}${r.paginas?`, ${r.paginas} páginas leídas`:''})`);
    if(!tx) continue;
    const nf = flagsFromText(tx); e.flags = e.flags || {}; for(const k in nf) if(nf[k]) e.flags[k] = true;
    const x = extractFields(tx);
    if(x.cautelar && !e.cautelar){
      e.cautelar = true;
      if(ESTADOS.indexOf(e.estado) < ESTADOS.indexOf('Cautelar otorgada')) e.estado = 'Cautelar otorgada';
      e.movimientos.push({fecha:iso(today()), tipo:'Resolución', desc:`Se registra medida cautelar a partir de ${f.name}.`, user:S.user});
      audit('Registró medida cautelar', e.numero, `Detectada en ${f.name}`);
      novedades.push('se detectó una medida cautelar (la etapa quedó en verde)');
    }
    const nuevos = [];
    if(x.plazoDesc && x.plazoFecha) nuevos.push({desc:x.plazoDesc, vence:x.plazoFecha, regla:x.plazoRegla});
    (x.extra||[]).forEach(p=>nuevos.push({desc:p.desc, vence:p.vence, regla:p.regla}));
    nuevos.forEach(p=>{ if(e.plazos.some(q=>!q.hecho && q.desc===p.desc)) return; e.plazos.push({desc:p.desc, vence:p.vence, hecho:false, ...(p.regla?{regla:p.regla}:{})}); audit('Agendó un plazo', e.numero, `${p.desc} (${fmt(p.vence)}), leído de ${f.name}`); novedades.push(`se agendó "${p.desc}" para el ${fmt(p.vence)}`); });
  }
  save(); render();
  toast(`Listo: ${tipos.join(', ')}.${novedades.length?' Además, '+novedades.join('; ')+'.':''} Las sugerencias se actualizaron.`);
}
document.addEventListener('toggle', ev => { const d = ev.target; if(d.matches && d.matches('details[data-sugkey]')){ if(d.open) ui.openSug = d.dataset.sugkey; else if(ui.openSug===d.dataset.sugkey) ui.openSug = null; } if(d.matches && d.matches('details[data-member]')) ui.open[d.dataset.member] = d.open; }, true);
document.addEventListener('dragover', ev => { const md = ev.target.closest('#mdrop'); if(md){ ev.preventDefault(); md.classList.add('over'); return; } const wz = ev.target.closest('#wdrop'); if(wz){ ev.preventDefault(); wz.classList.add('over'); return; } const dz = ev.target.closest('#drop'); if(dz){ ev.preventDefault(); dz.classList.add('over'); } });
document.addEventListener('dragleave', ev => { const wz = ev.target.closest('#wdrop'); if(wz) wz.classList.remove('over'); const dz = ev.target.closest('#drop'); if(dz) dz.classList.remove('over'); });
document.addEventListener('drop', ev => { const md = ev.target.closest('#mdrop'); if(md){ ev.preventDefault(); md.classList.remove('over'); addModels(ev.dataTransfer.files); return; } const wz = ev.target.closest('#wdrop'); if(wz && W){ ev.preventDefault(); wProcess(ev.dataTransfer.files); return; } const dz = ev.target.closest('#drop'); if(dz){ ev.preventDefault(); const e = expById(route().id); if(e) addFiles(e, ev.dataTransfer.files); } });

document.addEventListener('input', ev => {
  const t = ev.target;
  if(t.id==='gsearch'){ ui.q = t.value; ui.results = true; const box = $('.search'); const old = box.querySelector('.results'); if(old) old.remove(); box.insertAdjacentHTML('beforeend', searchResults()); }
  if(t.id==='tplText'){ ui.tplText = t.value; const f = (t.value.match(/\[[^\]]+\]/g)||[]).length; const n = $('#faltan'); if(n){ n.className = 'notice '+(f?'':'good'); n.innerHTML = `${ic(f?'pen':'check')}<div>${f?`${f===1?'Te queda':'Te quedan'} <b>${f}</b> ${f===1?'parte':'partes'} para escribir vos: están entre [CORCHETES].`:'¡Listo! No quedan partes por completar.'}</div>`; } }
  if(t.id==='bkPass') ui.bkPass = t.value;

});
document.addEventListener('submit', async ev => {
  ev.preventDefault();
  const id = ev.target.id; const r = route(); const e = r.name==='expediente' ? expById(r.id) : null;
  if(id==='loginForm'){
    const org = $('#lgOrg').value.trim().toLowerCase(), uid = $('#lgUser').value.trim().toLowerCase(), pass = $('#lgPass').value;
    ui.lastOrg = org; S.lock = S.lock || {};
    const fail = t => { ui.loginMsg = {ok:false, t}; render(); setTimeout(()=>{ const f = $('#lgUser'); if(f){ f.value = uid; $('#lgPass').focus(); } }, 0); };
    if(org !== ORG) return fail('No encontramos esa organización. Revisá cómo está escrita.');
    const l = S.lock[uid];
    if(l && l.until > Date.now()) return fail(`Por seguridad, este usuario está bloqueado unos minutos. Probá de nuevo en ${Math.ceil((l.until-Date.now())/60000)} min o pedile al administrador que lo desbloquee.`);
    $('#lgBtn').disabled = true; $('#lgBtn').textContent = 'Ingresando…';
    const u = S.users.find(x=>x.id===uid);
    const ok = u && u.activo && (await hashPass(pass, u.salt)) === u.hash;
    if(!ok){
      const rec = S.lock[uid] = {fails:((l && l.until && l.until <= Date.now()) ? 0 : (l?l.fails:0)) + 1, until:0};
      if(rec.fails >= 5){ rec.until = Date.now() + 5*60000; rec.fails = 0; }
      save(); audit('Intento de ingreso fallido','Sistema', `Usuario "${uid}"`, {user: uid || 'desconocido'});
      return fail(rec.until ? 'Hubo demasiados intentos. Por seguridad, el usuario quedó bloqueado 5 minutos.' : `El usuario o la contraseña no son correctos. Te quedan ${5-rec.fails} ${5-rec.fails===1?'intento':'intentos'}.`);
    }
    delete S.lock[uid]; S.user = uid; setSession({user:uid, at:Date.now()}); lastActivity = Date.now(); ui.loginMsg = null;
    const firstTime = !(S.toured||{})[uid]; S.toured = S.toured || {}; S.toured[uid] = true; save();
    audit('Inició sesión','Sistema', u.nombre);
    location.hash = 'inicio'; render();
    if(u.mustChange) openPwd(true); else if(firstTime) openTour(0);
  }
  if(id==='pwdForm'){
    const u = me(), msg = t => { $('#pwMsg').innerHTML = `<div class="notice bad">${esc(t)}</div>`; };
    const o = $('#pwOld').value, n = $('#pwNew').value, r2 = $('#pwRep').value;
    if((await hashPass(o, u.salt)) !== u.hash) return msg('La contraseña actual no es correcta.');
    if(!passOk(n)) return msg('La nueva contraseña tiene que tener al menos 8 caracteres, con letras y números.');
    if(n !== r2) return msg('Las dos contraseñas nuevas no son iguales.');
    if(n === o) return msg('Elegí una contraseña distinta de la actual.');
    const wasForced = u.mustChange;
    u.salt = randId(16); u.hash = await hashPass(n, u.salt); u.mustChange = false; save();
    audit('Cambió su contraseña','Usuarios',u.id); closeModal(); toast('Contraseña actualizada');
    if(wasForced) openTour(0);
  }
  if(id==='movForm' && e){ const m = {fecha:$('#mvF').value, tipo:$('#mvT').value, desc:$('#mvD').value.trim(), user:S.user}; if(!m.desc) return; e.movimientos.push(m); save(); ui.addMov=false; audit('Cargó una novedad', e.numero, `${m.tipo}: ${m.desc}`); render(); toast('Novedad guardada'); }
  if(id==='plForm' && e){ const p = {desc:$('#plD').value.trim(), vence:$('#plV').value, hecho:false}; if(!p.desc||!p.vence) return; e.plazos.push(p); save(); ui.addPlazo=false; audit('Agregó un plazo', e.numero, `${p.desc} (${fmt(p.vence)})`); render(); toast('Plazo guardado'); }
  if(ev.target.classList.contains('teamform') && isAdmin()){
    const f = ev.target, tm = S.teams.find(x=>x.id===f.dataset.team);
    const jefe = f.jefe.value, miembros = [...f.querySelectorAll('input[name=m]:checked')].map(i=>i.value).filter(m=>m!==jefe);
    const taken = miembros.filter(m=>S.teams.some(o=>o.id!==tm.id && o.miembros.includes(m)));
    if(taken.length){ toast(`${taken.map(userName).join(', ')} ya está en otro equipo. Sacalo de ahí primero.`); return; }
    tm.nombre = f.nombre.value.trim() || tm.nombre; tm.jefe = jefe; tm.miembros = miembros; save();
    audit('Actualizó un equipo','Equipos',`${tm.nombre}: jefa/e ${userName(jefe)}, ${miembros.length} analista(s)`); await chain; render(); toast('Equipo guardado');
  }
  if(id==='cfgForm'){ S.config = {empresa:$('#cfEmp').value.trim(), cuitEmpresa:$('#cfCuit').value.trim(), letrado:$('#cfLet').value.trim(), matricula:$('#cfMat').value.trim(), domicilio:$('#cfDom').value.trim(), electronico:$('#cfEle').value.trim(), poder:$('#cfPod').value.trim()}; save(); audit('Actualizó los datos para escritos','Modelos','Encabezado de escritos'); toast('Datos guardados: se usan en los próximos escritos'); render(); }
  if(id==='userForm' && isAdmin()){
    const uid = $('#nuId').value.trim().toLowerCase();
    if(S.users.some(x=>x.id===uid)){ ui.userMsg={ok:false,t:'Ya hay alguien con ese usuario. Probá con otro.'}; render(); return; }
    const p = tempPass(); S.users.push(await makeUser({id:uid, nombre:$('#nuNom').value.trim(), rol:$('#nuRol').value}, p, true)); save();
    audit('Agregó un usuario','Usuarios', `${uid} (${$('#nuRol').value})`);
    ui.userMsg={ok:true, html:`Listo. <b>${esc(uid)}</b> ya puede entrar con la contraseña provisoria <span class="mono">${esc(p)}</span>. Pasásela en persona o por un canal seguro; no se vuelve a mostrar.`}; await chain; render();
  }
});

window.addEventListener('storage', async ev => {
  if(ev.key!==KEY || !ev.newValue) return;
  try{ const d = JSON.parse(ev.newValue); const user = S && S.user; S = d; S.user = user; render(); }catch(e){}
});

// ---------- arranque ----------
(async function init(){
  const got = load();
  let fromIdb = null; try{ fromIdb = await IDB.get('estado'); }catch(e){}
  if(fromIdb && Array.isArray(fromIdb.exps)){
    if(!got) { S = await migrate(fromIdb); save(); }
    else { const a = got.data, b = fromIdb; const nuevo = (b.savedAt||0) > (a.savedAt||0) ? b : a, otro = nuevo===a ? b : a; got.data = unir(nuevo, otro); }
  }
  try{ const h = await IDB.get('fileHandle'); if(h){ PERSIST.file = h; PERSIST.fileName = h.name; const p = await h.queryPermission({mode:'readwrite'}); PERSIST.fileNeeds = p!=='granted'; } }catch(e){}
  try{ if(navigator.storage && navigator.storage.persist){ PERSIST.persistent = await navigator.storage.persisted() || await navigator.storage.persist(); } }catch(e){}
  if(got){ S = await migrate(got.data); if(S._sumados && S._sumados.length) setTimeout(()=>toast(`Recuperamos: ${S._sumados.join(', ')}.`), 1200); delete S._sumados; save(); if(got.from){ setTimeout(()=>toast('Recuperamos los datos que tenías cargados en la versión anterior.'), 400); } }
  if(S && S.exps){ const r = rescatar(); if(r.length) setTimeout(()=>toast(`Recuperamos ${r.length===1?'un amparo':r.length+' amparos'} que había quedado guardado por una versión anterior: ${r.map(x=>x.afiliado).join(', ')}.`), 900); }
  else if(!S){ S = await fresh(); save(); await seedAudit(); }
  S.lock = S.lock || {}; S.toured = S.toured || {}; S.teams = S.teams || [];
  render();
  const u = getSession() && me(); if(u && u.mustChange) openPwd(true);
})();
